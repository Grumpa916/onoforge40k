# deployment UI redesign trigger
name: Apply deployment UI redesign
on:
  push:
    branches: [feature/opponent-turn-history]
    paths: ['.github/workflows/apply-deployment-ui-redesign.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch deployment workflow and maps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  if(state.tournamentLifecycle==='DEPLOYMENT'){
            const deploymentCheck=tournamentDeploymentValidation();
            if(!deploymentCheck.ready){alert('Deployment is incomplete:\\n\\n• '+deploymentCheck.missing.join('\\n• '));return false;}
          }else if(state.tournamentLifecycle!=='SETUP'){
            alert('The tournament is not in Setup or Deployment.');
            return false;
          }
"""
          new="""  if(!['SETUP','DEPLOYMENT'].includes(state.tournamentLifecycle)){
            alert('The tournament is not in Setup or Deployment.');
            return false;
          }
"""
          if old in s:s=s.replace(old,new,1)
          old=""" state.terrainSetupComplete=true;
 state.liveDeploymentPanelOpen=false;
"""
          new=""" state.terrainSetupComplete=true;
 if(state.tournamentLifecycle==='SETUP')setTournamentLifecycle('DEPLOYMENT');
 state.liveDeploymentPanelOpen=false;
"""
          if old not in s: raise SystemExit('Terrain completion block not found')
          s=s.replace(old,new,1)
          pat=r"function deploymentStatusHtml\(\)\{.*?\n\}\n\nfunction initializeLiveDeploymentFromPlan"
          repl="""function deploymentStatusHtml(){
 if(state.tournamentLifecycle!=='DEPLOYMENT')return '';
 const positions=ensureBattlefieldUnitPositions();
 const placed=Object.values(positions).filter(p=>p&&p.side).length;
 return '<div class=\"setup-section deployment-status-info\"><div class=\"split\"><div><h3 style=\"margin:0\">Deployment Tracking</h3><div class=\"tiny\">Record approximate tabletop positions when useful. Reserves remain in the reserve tray. Position tracking is a visual aid, not a precision measurement system.</div></div><span class=\"pill\">'+placed+' positions recorded</span></div><div class=\"status\">Deployment tracking is optional. <b>Start Battle</b> does not require every unit to have a recorded position.</div></div>';
}

function initializeLiveDeploymentFromPlan"""
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Deployment status function not found')
          marker="function objectiveMapRendererHtml(mode='battle'){"
          backdrop="""function approximateBattlefieldBackdropHtml(mode){
 const my=esc(state.myName||'My Army'),opp=esc(state.oppName||'Opponent');
 return '<div class=\"approximate-battlefield-backdrop\" aria-hidden=\"true\"><div class=\"approx-side opp\">'+opp+' side</div><div class=\"approx-centerline\"></div><div class=\"approx-side my\">'+my+' side</div><div class=\"approx-map-note\">Approximate placement • 60 × 44 battlefield</div></div>';
}
"""
          if marker not in s: raise SystemExit('Map renderer marker not found')
          s=s.replace(marker,backdrop+marker,1)
          old="const status=mode==='terrain'?'Official Event Companion reference':model.verified?'Verified geometry':'Geometry pending verification'"
          new="const status=mode==='terrain'?'Official Event Companion reference':model.verified?'Verified geometry':'Approximate map'"
          if old not in s: raise SystemExit('Map status expression not found')
          s=s.replace(old,new,1)
          old="const battlefieldMarkup=terrainSetup?terrainReferenceImageHtml(model):'<div class=\"objective-map-canvas \'+(setup?'terrain-measurement-map':'')+'\" data-objective-map-canvas data-objective-map-mode=\"'+esc(mode)+'\" role=\"application\" aria-label=\"'+esc(title)+' 60 by 44 inch battlefield map\">'+(model.verified?regions+terrain+objectiveNodes+ghostNodes+unitNodes:'<div class=\"objective-map-placeholder\">Verified Event Companion geometry required</div>')+'</div>';"
          new="const battlefieldMarkup=terrainSetup?terrainReferenceImageHtml(model):'<div class=\"objective-map-canvas '+(setup?'deployment-planning-map ':'')+(deployment?'deployment-tracking-map ':'')+'\" data-objective-map-canvas data-objective-map-mode=\"'+esc(mode)+'\" role=\"application\" aria-label=\"'+esc(title)+' approximate 60 by 44 inch battlefield map\">'+approximateBattlefieldBackdropHtml(mode)+(model.verified?regions+terrain+objectiveNodes:'')+ghostNodes+unitNodes+'</div>';"
          if old not in s: raise SystemExit('Battlefield markup expression not found')
          s=s.replace(old,new,1)
          old="pending='<div class=\"status\" style=\"margin-top:8px\"><b>Map geometry pending verification.</b><div class=\"tiny\" style=\"margin-top:4px\">No deployment zone, territory, terrain, or objective position is inferred from the 60 × 44 table boundary. The Event Companion geometry must be verified first.</div></div>'"
          new="pending='<div class=\"status\" style=\"margin-top:8px\"><b>Approximate map mode.</b><div class=\"tiny\" style=\"margin-top:4px\">Unit placement is intentionally approximate. Exact deployment zones, terrain geometry, and objective coordinates are shown only after Event Companion geometry is verified. The map is a tracking aid, not a precision measurement tool.</div></div>'"
          if old not in s: raise SystemExit('Pending map notice not found')
          s=s.replace(old,new,1)
          s=s.replace("function deploymentPlanMapControlsHtml(model){if(!model.verified)return '';", "function deploymentPlanMapControlsHtml(model){")
          s=s.replace("function deploymentTrackingControlsHtml(model){if(!model.verified)return '';", "function deploymentTrackingControlsHtml(model){")
          s=s.replace("if(!model.verified||!units.length)return '';const selected=state.battlefieldMapPlacement||{}", "if(!units.length)return '';const selected=state.battlefieldMapPlacement||{}",1)
          s=s.replace("function objectiveMapUnitNodesHtml(model,pct,mode='battle'){if(!model.verified)return '';", "function objectiveMapUnitNodesHtml(model,pct,mode='battle'){")
          s=s.replace("function objectiveMapPlanGhostNodesHtml(model,pct){if(!model.verified)return '';", "function objectiveMapPlanGhostNodesHtml(model,pct){")
          s=s.replace("<span class=\"pill\">0.1″ coordinates</span>", "<span class=\"pill\">Approximate placement</span>")
          s=s.replace("Select a unit, then tap/click its new tabletop position on the map.", "Select a unit, then tap/click its approximate tabletop position on the map.")
          s=s.replace("Select a unit, then tap/click its intended starting position.", "Select a unit, then tap/click its approximate intended starting position.")
          s,n=re.subn(r"function deploymentPlanPositionEditorHtml\(\)\{.*?\n\}\nfunction objectiveMapPlacementPanelHtml", "function deploymentPlanPositionEditorHtml(){return '<div class=\"status approximate-position-note\"><b>Map placement only.</b><div class=\"tiny\" style=\"margin-top:4px\">Starting positions are recorded by dragging or tapping the map. Numeric coordinates are intentionally hidden because they are not expected to be physically measured at the table.</div></div>;}\nfunction objectiveMapPlacementPanelHtml", s, count=1, flags=re.S)
          if n!=1: raise SystemExit('Deployment plan coordinate editor not found')
          s,n=re.subn(r"function deploymentTrackingEditorHtml\(\)\{.*?\n\}\nfunction deploymentTrackingControlsHtml", "function deploymentTrackingEditorHtml(){return '<div class=\"status approximate-position-note\"><b>Map placement only.</b><div class=\"tiny\" style=\"margin-top:4px\">Drag unit icons to update approximate positions. No manual coordinate entry is required.</div></div>';}\nfunction deploymentTrackingControlsHtml", s, count=1, flags=re.S)
          if n!=1: raise SystemExit('Deployment coordinate editor not found')
          s=s.replace("return {x,y,side:'my',source:'deployment-plan'};", "return {x,y,side:'my',source:'deployment-plan',accuracy:raw.accuracy||'approximate'};")
          s=s.replace("plans[key].positions[id]={x:nx,y:ny,side:'my',source:'deployment-plan'};", "plans[key].positions[id]={x:nx,y:ny,side:'my',source:'deployment-plan',accuracy:'approximate'};")
          s=s.replace("return {x,y,side:raw.side,source:raw.source||'manual'};", "return {x,y,side:raw.side,source:raw.source||'manual',accuracy:raw.accuracy||'approximate'};")
          s=s.replace("ensureBattlefieldUnitPositions()[id]={x:nx,y:ny,side:nextSide,source,round:Math.max(1,Number(state.round)||1)};", "ensureBattlefieldUnitPositions()[id]={x:nx,y:ny,side:nextSide,source,accuracy:'approximate',round:Math.max(1,Number(state.round)||1)};")
          css="""
<style id=\"deployment-map-approximate-v1\">
.approximate-battlefield-backdrop{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(105,125,150,.07),rgba(45,65,90,.02));}
.approx-side{position:absolute;left:0;right:0;text-align:center;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#71849a;}.approx-side.opp{top:9%;}.approx-side.my{bottom:9%;}.approx-centerline{position:absolute;left:0;right:0;top:50%;border-top:1px dashed #40566e;opacity:.8}.approx-map-note{position:absolute;right:8px;bottom:6px;font-size:9px;color:#71849a}.deployment-planning-map,.deployment-tracking-map{min-height:clamp(520px,66vh,820px);aspect-ratio:60/44}.deployment-planning-map{max-height:820px}.deployment-tracking-map{max-height:760px}.approximate-position-note{margin-top:10px}.objective-map-renderer:has(.deployment-planning-map) .objective-map-legend,.objective-map-renderer:has(.deployment-tracking-map) .objective-map-legend{margin-top:8px}@media(max-width:700px){.deployment-planning-map,.deployment-tracking-map{min-height:440px}}
</style>
"""
          if 'id=\"deployment-map-approximate-v1\"' not in s:s=s.replace('</style>','</style>'+css,1)
          s=re.sub(r'<button[^>]*onclick=["\']beginDeployment\(\)[^>]*>\s*Begin Deployment\s*</button>', '', s, flags=re.I)
          s=s.replace('actual alternating deployment is recorded after Begin Deployment.', 'actual alternating deployment is recorded in the Deployment Tracking map.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/index.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.js
          grep -F "if(state.tournamentLifecycle==='SETUP')setTournamentLifecycle('DEPLOYMENT');" index.html
          grep -F "Approximate placement" index.html
          grep -F "approximate-battlefield-backdrop" index.html
          grep -F "accuracy:'approximate'" index.html
          ! grep -F 'Begin Deployment' index.html
      - name: Commit source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-deployment-ui-redesign.yml
          git add index.html
          git commit -m "Redesign deployment maps for approximate play"
          git push origin HEAD:feature/opponent-turn-history
