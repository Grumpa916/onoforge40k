name: Tactical Advisor Surface Fix Preview

on:
  push:
    branches:
      - feature/tactical-impact-layer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build corrected preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/deploy.yml').read_text(encoding='utf-8')

          for script_id, source_path in [
              ('onoforge-tactical-advisor-engine', Path('tactical-advisor-engine.js')),
              ('onoforge-tactical-advisor-adapter', Path('tactical-advisor-adapter.js')),
              ('onoforge-tactical-charge-workflow', Path('tactical-charge-workflow.js')),
              ('onoforge-tactical-advisor-surface-fix', Path('tactical-advisor-surface-fix.js')),
          ]:
              if f'id="{script_id}"' not in html:
                  html = html.replace(
                      '</head>',
                      f'<script id="{script_id}">\n{source_path.read_text(encoding="utf-8")}\n</script></head>',
                      1
                  )

          def extract_raw_string(name):
              marker=f'{name} = r"""'
              start=workflow.find(marker)
              if start<0: raise SystemExit(f'Missing {name} renderer source')
              start += len(marker)
              end=workflow.find('"""', start)
              if end<0: raise SystemExit(f'Unterminated {name} renderer source')
              return workflow[start:end]

          css=extract_raw_string('css')
          js=extract_raw_string('js')
          if 'id="onoforge-advisor-render-css"' not in html:
              html=html.replace('</head>',css+'</head>',1)
          if 'id="onoforge-advisor-render-js"' not in html:
              html=html.replace('</body>',js+'</body>',1)

          out=Path('preview-site-fixed')
          out.mkdir(parents=True,exist_ok=True)
          (out/'index.html').write_text(html,encoding='utf-8')
          data_out=out/'data'
          data_out.mkdir(parents=True,exist_ok=True)
          companion=Path('data/warhammer-event-companion-v1.2.json')
          (data_out/companion.name).write_text(companion.read_text(encoding='utf-8'),encoding='utf-8')
          (out/'README.txt').write_text(
              'OnoForge 40K Tactical Advisor surface-fix preview\\n\\n'
              'This preview contains the consolidated Tactical Advisor plus a hard removal of the hidden '
              'staging renderer host after Tactical Impact is mounted into the existing Advisor.\\n',
              encoding='utf-8'
          )
          PY

      - name: Upload corrected preview
        uses: actions/upload-artifact@v4
        with:
          name: onoforge40k-tactical-advisor-surface-fix-preview
          path: preview-site-fixed
          if-no-files-found: error
          retention-days: 14
