name: Tablet Test Artifact

on:
  push:
    branches:
      - feature/opponent-turn-history-clean-reset
  workflow_dispatch:

jobs:
  build-test-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v6

      - name: Verify source identity
        run: |
          echo "Commit: $GITHUB_SHA"
          test -f index.html
          test -f data/warhammer-event-companion-v1.2.json
          test -f deployment-state.js
          test -f deployment-bridge.js
          test -f deployment-interaction.js

      - name: Assemble browser test package
        run: |
          rm -rf tablet-test-artifact
          mkdir -p tablet-test-artifact/data
          cp index.html tablet-test-artifact/index.html
          cp deployment-state.js tablet-test-artifact/deployment-state.js
          cp deployment-bridge.js tablet-test-artifact/deployment-bridge.js
          cp deployment-interaction.js tablet-test-artifact/deployment-interaction.js
          cp data/warhammer-event-companion-v1.2.json tablet-test-artifact/data/warhammer-event-companion-v1.2.json
          printf '%s\n' "$GITHUB_SHA" > tablet-test-artifact/SOURCE_COMMIT.txt
          printf '%s\n' "Generated by GitHub Actions from the exact committed branch source." > tablet-test-artifact/ARTIFACT_SOURCE.txt

      - name: Verify test package
        run: |
          test -s tablet-test-artifact/index.html
          test -s tablet-test-artifact/data/warhammer-event-companion-v1.2.json
          test -s tablet-test-artifact/deployment-state.js
          test -s tablet-test-artifact/deployment-bridge.js
          test -s tablet-test-artifact/deployment-interaction.js
          echo "Artifact source commit: $(cat tablet-test-artifact/SOURCE_COMMIT.txt)"
          du -h tablet-test-artifact/* tablet-test-artifact/data/*

      - name: Upload browser test artifact
        uses: actions/upload-artifact@v4
        with:
          name: onoforge40k-tablet-test-${{ github.sha }}
          path: tablet-test-artifact/
          if-no-files-found: error
          retention-days: 14
