name: Deployment Bridge Integrator

on:
  push:
    branches:
      - feature/opponent-turn-history-clean-reset

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[deployment-bridge-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply bounded compatibility-bridge integration
        run: node scripts/integrate-deployment-bridge.js

      - name: Validate deployment boundary and application syntax
        run: |
          node scripts/deployment-boundary-audit.js
          node tests/deployment-panel-state-regression.test.js

      - name: Commit integrated monolith change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: integrate deployment compatibility bridge [deployment-bridge-integrated]'
          git push origin HEAD:${GITHUB_REF_NAME}
