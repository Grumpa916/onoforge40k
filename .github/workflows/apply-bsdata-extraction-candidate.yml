name: Apply BSData Extraction Candidate

on:
  push:
    branches:
      - refactor/bsdata-extraction-candidate
  pull_request:
    branches:
      - feature/opponent-turn-history
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  extract-and-verify:
    if: ${{ !startsWith(github.event.head_commit.message || '', 'refactor: apply BSData extraction') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate extraction
        run: |
          node tools/extract-bsdata-parser.js
          cp index.extracted.html index.html
          rm index.extracted.html

      - name: Verify extracted module
        run: node tools/verify-bsdata-extracted-module.js

      - name: Verify extraction boundary and syntax
        run: |
          node --check js/data/bsdata-parser.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const required='<script src="js/data/bsdata-parser.js"></script><script>';
          const oldFns=['collectBSDataObjects','bsProfile','bsCharacteristics','normalize11eWeaponAbilities','bsAbilities','bsWeapons','bsWargearOptions','bsUnitFromEntry'];
          for(const name of oldFns) if(html.includes(`function ${name}(`)) throw new Error(`Old BSData parser function remains: ${name}`);
          if(!html.includes(required))throw new Error('Parser module loader not found');
          if(html.includes('window.__BS_OBJECT_MAP=map;'))throw new Error('Hidden BSData object-map global remains');
          const start=html.indexOf('<script>')+8;
          const end=html.lastIndexOf('</script>');
          new Function(html.slice(start,end));
          console.log('index.html inline JavaScript syntax: OK');
          NODE

      - name: Check diff hygiene
        run: |
          git diff --check
          git status --short
          if [ "${{ github.event_name }}" = "push" ]; then
            test "$(git status --porcelain | wc -l | tr -d ' ')" = "1"
            test "$(git status --porcelain | head -1 | cut -c4-)" = "index.html"
          fi

      - name: Commit extracted index.html on candidate branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: apply BSData extraction"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
