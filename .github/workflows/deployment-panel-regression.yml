name: Deployment Panel Regression

on:
  push:
    branches:
      - feature/opponent-turn-history-clean-reset
  pull_request:
    paths:
      - 'index.html'
      - 'deployment-state.js'
      - 'deployment-bridge.js'
      - 'tests/deployment-panel-state-regression.test.js'
      - 'scripts/deployment-bridge-audit.js'
      - '.github/workflows/deployment-panel-regression.yml'

jobs:
  deployment-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deployment state compatibility bridge audit
        run: node scripts/deployment-bridge-audit.js

      - name: Run deployment panel regression
        run: node tests/deployment-panel-state-regression.test.js
