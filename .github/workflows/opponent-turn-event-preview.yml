name: Opponent Turn Event Capture Preview

on:
  push:
    branches:
      - feature/opponent-turn-history
  pull_request:
    paths:
      - 'opponent-turn-event-layer.js'
      - 'opponent-turn-capture.js'
      - 'opponent-turn-render-fix.js'
      - 'scripts/opponent-turn-event-layer-audit.js'
      - 'tests/opponent-turn-event-layer.test.js'
      - 'tests/opponent-turn-render-bridge.test.js'
      - 'tests/bidirectional-combat-edge-cases.test.js'
      - '.github/workflows/opponent-turn-event-preview.yml'
      - 'index.html'
      - 'data/warhammer-event-companion-v1.2.json'
      - 'js/data/bsdata-parser.js'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run opponent-turn event layer unit tests
        run: node tests/opponent-turn-event-layer.test.js

      - name: Run opponent-turn resolver render bridge regression
        run: node tests/opponent-turn-render-bridge.test.js

      - name: Run bidirectional combat edge-case regression
        run: node tests/bidirectional-combat-edge-cases.test.js

      - name: Run opponent-turn event layer architecture audit
        run: node scripts/opponent-turn-event-layer-audit.js

      - name: Validate capture UI syntax
        run: node --check opponent-turn-capture.js

      - name: Validate resolver render bridge syntax
        run: node --check opponent-turn-render-fix.js

      - name: Validate inline JavaScript in index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[ \\t\\r\\n][^>]*)?>(.*?)</script>',html,re.I|re.S)
          if not scripts:
              raise SystemExit('No inline script blocks found in index.html')
          for i,src in enumerate(scripts,1):
              Path(f'/tmp/onoforge-inline-{i}.js').write_text(src,encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script block(s)')
          PY
          for f in /tmp/onoforge-inline-*.js; do
            node --check "$f"
          done

      - name: Build opponent-turn preview artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          head_layers=[
              ('onoforge-opponent-turn-event-layer',Path('opponent-turn-event-layer.js')),
              ('onoforge-opponent-turn-capture',Path('opponent-turn-capture.js')),
          ]
          for script_id,source_path in head_layers:
              if f'id="{script_id}"' not in html:
                  html=html.replace('</head>', f'<script id="{script_id}">\n{source_path.read_text(encoding="utf-8")}\n</script></head>', 1)

          expected="${state.currentTurn==='opp'?(opponentTurnTrackingHtml()+tacticalPreRollResolutionModal()):(tacticalMovementTrackerHtml()+tacticalAdvisorHtml()+tacticalContextHtml()+tacticalShootingResultHtml()+tacticalPreRollResolutionModal())}"
          if expected not in html:
              raise SystemExit('Production opponent-turn resolver render fix is missing from index.html')

          marker='<script id="onoforge-opponent-turn-render-v4">window.ONOFORGE_OPPONENT_RESOLVER_RENDER_V4=true;</script>'
          if 'id="onoforge-opponent-turn-render-v4"' not in html:
              html=html.replace('</body>', marker+'</body>',1)

          for marker_text in ['ONOFORGE_OPPONENT_EVENT_CAPTURE','ONOFORGE_OPPONENT_CAPTURE_UI','ONOFORGE_OPPONENT_RESOLVER_RENDER_V4']:
              if marker_text not in html:
                  raise SystemExit(f'Missing injected opponent-turn marker: {marker_text}')
          out=Path('preview-site')
          out.mkdir(parents=True,exist_ok=True)
          (out/'index.html').write_text(html,encoding='utf-8')
          data_src=Path('data/warhammer-event-companion-v1.2.json')
          if not data_src.exists():
              raise SystemExit('Required Event Companion geometry data file is missing')
          data_out=out/'data'
          data_out.mkdir(parents=True,exist_ok=True)
          (data_out/data_src.name).write_text(data_src.read_text(encoding='utf-8'),encoding='utf-8')
          parser_target=out/'js'/'data'
          parser_target.mkdir(parents=True,exist_ok=True)
          parser_target.joinpath('bsdata-parser.js').write_text(Path('js/data/bsdata-parser.js').read_text(encoding='utf-8'),encoding='utf-8')
          print('Built preview-site with index.html, Event Companion geometry data, and extracted BSData parser')
          PY
          node --check opponent-turn-event-layer.js
          node --check opponent-turn-capture.js
          node --check opponent-turn-render-fix.js
          node --check js/data/bsdata-parser.js

      - name: Assert preview contains no literal backslash-n escape in injected scripts
        shell: bash
        run: |
          if grep -nF '\\n/* OnoForge 40K — opponent-turn resolver render bridge' preview-site/index.html; then
            echo 'ERROR: preview contains a literal backslash-n escape before the resolver bridge.'
            exit 1
          fi

      - name: Upload opponent-turn preview
        uses: actions/upload-artifact@v4
        with:
          name: onoforge40k-opponent-turn-event-preview
          path: preview-site
          if-no-files-found: error
          retention-days: 14

      - name: Report
        run: echo "Opponent-turn event capture validation passed with extracted BSData parser and Event Companion geometry data"

  reconcile-bsdata-current-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current candidate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Switch from PR merge ref to actual candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/opponent-turn-history refactor/bsdata-extraction-candidate refactor/bsdata-extraction-current-base
          git checkout -B reconcile-work origin/refactor/bsdata-extraction-current-base

      - name: Apply extraction against the actual feature baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=origin/feature/opponent-turn-history
          CAND=origin/refactor/bsdata-extraction-candidate
          MB=$(git merge-base "$BASE" "$CAND")
          echo "BASE=$BASE"
          echo "CAND=$CAND"
          echo "MERGE_BASE=$MB"

          git show "$BASE:index.html" > /tmp/base-index.html
          git show "$CAND:index.html" > /tmp/candidate-index.html
          git show "$MB:index.html" > /tmp/merge-base-index.html
          if ! git merge-file -p /tmp/base-index.html /tmp/candidate-index.html /tmp/merge-base-index.html > index.html; then
            echo 'Three-way merge conflict in index.html'
            grep -nE '^(<<<<<<<|=======|>>>>>>>)' index.html || true
            exit 1
          fi

          node tools/verify-bsdata-extracted-module.js
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' index.html; then
            echo 'Conflict markers remain in index.html'
            exit 1
          fi

          git add index.html
          if git diff --cached --quiet; then
            echo 'No index reconciliation changes were produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rebase: apply BSData extraction to current feature baseline'
          git push origin HEAD:refactor/bsdata-extraction-current-base
