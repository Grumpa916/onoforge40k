name: BSData Rebase Current Base

on:
  push:
    branches:
      - refactor/bsdata-extraction-current-base
  pull_request:
    branches:
      - feature/opponent-turn-history

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-base candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconcile extraction candidate with current feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refactor/bsdata-extraction-candidate
          BASE=$(git rev-parse HEAD)
          CAND=$(git rev-parse origin/refactor/bsdata-extraction-candidate)
          MB=$(git merge-base "$BASE" "$CAND")
          echo "BASE=$BASE"
          echo "CAND=$CAND"
          echo "MERGE_BASE=$MB"

          merge_file() {
            local path="$1"
            git show "$BASE:$path" > /tmp/base-file
            git show "$CAND:$path" > /tmp/candidate-file
            git show "$MB:$path" > /tmp/merge-base-file
            if ! git merge-file -p /tmp/base-file /tmp/candidate-file /tmp/merge-base-file > /tmp/merged-file; then
              echo "Three-way merge conflict in $path"
              grep -nE '^(<<<<<<<|=======|>>>>>>>)' /tmp/merged-file || true
              exit 1
            fi
            mv /tmp/merged-file "$path"
          }

          merge_file index.html

          for path in \
            .github/workflows/tactical-advisor-preview.yml \
            .github/workflows/tactical-advisor-surface-fix-preview.yml \
            CHAT_SAVEPOINT_2026-10-03_BSDATA_EXTRACTION_CANDIDATE_FINAL.md \
            tools/extract-bsdata-parser.js \
            tools/verify-bsdata-extracted-module.js \
            js/data/bsdata-parser.js; do
            mkdir -p "$(dirname "$path")"
            git show "$CAND:$path" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/opponent-turn-event-preview.yml')
          text=path.read_text(encoding='utf-8')

          if "      - 'js/data/bsdata-parser.js'" not in text:
              text=text.replace(
                  "      - 'data/warhammer-event-companion-v1.2.json'\n",
                  "      - 'data/warhammer-event-companion-v1.2.json'\n      - 'js/data/bsdata-parser.js'\n",
                  1
              )

          parser_bundle="""          parser_target=out/'js'/'data'
          parser_target.mkdir(parents=True,exist_ok=True)
          parser_target.joinpath('bsdata-parser.js').write_text(Path('js/data/bsdata-parser.js').read_text(encoding='utf-8'),encoding='utf-8')
"""
          if "parser_target=out/'js'/'data'" not in text:
              marker="          print('Built preview-site with index.html and Event Companion geometry data')\n"
              if marker not in text:
                  raise SystemExit('Opponent-turn preview build marker not found')
              text=text.replace(marker, parser_bundle+marker, 1)

          if "node --check js/data/bsdata-parser.js" not in text:
              marker="          node --check opponent-turn-render-fix.js\n"
              if marker not in text:
                  raise SystemExit('Opponent-turn syntax validation marker not found')
              text=text.replace(marker, marker+"          node --check js/data/bsdata-parser.js\n", 1)

          path.write_text(text,encoding='utf-8')
          PY

          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' index.html; then
            echo 'Conflict markers remain after reconciliation.'
            exit 1
          fi

          node tools/verify-bsdata-extracted-module.js
          node tests/opponent-turn-event-capture.test.js

      - name: Commit reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/data/bsdata-parser.js .github/workflows/opponent-turn-event-preview.yml .github/workflows/tactical-advisor-preview.yml .github/workflows/tactical-advisor-surface-fix-preview.yml CHAT_SAVEPOINT_2026-10-03_BSDATA_EXTRACTION_CANDIDATE_FINAL.md tools/extract-bsdata-parser.js tools/verify-bsdata-extracted-module.js
          if git diff --cached --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git commit -m 'rebase: reconcile BSData extraction with current opponent-turn branch'
          git push origin HEAD:refactor/bsdata-extraction-current-base
