name: OnoForge Monolith Refactor Tests

on:
  push:
    branches:
      - refactor/clean-reset-monolith
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'js/data/bsdata-parser.js'
      - 'js/utils/pure-utils.js'
      - 'js/state/reserve-state.js'
      - 'js/state/deployment-plan-state.js'
      - 'js/state/objective-map-state.js'
      - 'js/state/objective-metadata-state.js'
      - 'js/state/transport-state.js'
      - 'js/state/stratagem-state.js'
      - 'js/state/game-timer-state.js'
      - 'js/state/phase-cp-state.js'
      - 'tests/monolith-refactor.test.js'
      - '.github/workflows/monolith-refactor-tests.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run monolith refactor validation
        run: node tests/monolith-refactor.test.js
