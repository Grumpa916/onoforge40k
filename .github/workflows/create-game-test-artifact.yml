name: Create Game Test Artifact

on:
  workflow_dispatch:

jobs:
  package-known-good:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected known-good gameplay checkpoint
        uses: actions/checkout@v4
        with:
          ref: 132551b340bdff635eeb9b193470f2c1a8e46ccd

      - name: Package game test build
        run: |
          mkdir -p game-test-build
          cp index.html game-test-build/index.html
          cp -r data game-test-build/data
          printf '%s\n' '132551b340bdff635eeb9b193470f2c1a8e46ccd' > game-test-build/SOURCE_COMMIT.txt
          printf '%s\n' 'Protected known-good gameplay checkpoint; deployment-refactor work is intentionally excluded.' > game-test-build/BUILD_NOTE.txt

      - name: Upload game test artifact
        uses: actions/upload-artifact@v4
        with:
          name: onoforge40k-known-good-game-test-132551b
          path: game-test-build
          if-no-files-found: error
