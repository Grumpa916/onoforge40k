name: One-time Deployment Interaction Integration

on:
  push:
    branches:
      - feature/opponent-turn-history-clean-reset

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/opponent-turn-history-clean-reset

      - name: Integrate deployment interaction seam
        run: node scripts/integrate-deployment-interaction.js

      - name: Commit integrated monolith and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/integrate-deployment-interaction.yml scripts/integrate-deployment-interaction.js
          git commit -m "feat: integrate deployment interaction seam [deployment-interaction-integrated]"
          git push origin HEAD:feature/opponent-turn-history-clean-reset
