name: Repair live deployment panel state

on:
  push:
    paths:
      - 'scripts/trigger-live-deployment-panel-repair.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ hashFiles('scripts/trigger-live-deployment-panel-repair.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/opponent-turn-history

      - name: Restore Pass 1A index and apply targeted panel-state repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout 5a0c064508f65e9181e4840c4467deb092f7ebc2 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const sideSel=ev.target.closest('[data-deployment-side]');if(sideSel){state.deploymentTrackingSide=sideSel.value==='opp'?'opp':'my';delete state.battlefieldMapPlacement;render();return;}const sel=ev.target.closest('.objective-map-unit-select');if(!sel)return;"
          new = "const livePanel=ev.target.closest('[data-live-deployment-panel]');if(livePanel)state.liveDeploymentPanelOpen=!!livePanel.open;const sideSel=ev.target.closest('[data-deployment-side]');if(sideSel){state.deploymentTrackingSide=sideSel.value==='opp'?'opp':'my';delete state.battlefieldMapPlacement;render();return;}const sel=ev.target.closest('.objective-map-unit-select');if(!sel)return;"
          if old not in s:
              raise SystemExit('Target deployment change-handler snippet not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join('\n');
          fs.writeFileSync('/tmp/onoforge-inline.js', scripts);
          NODE
          node --check /tmp/onoforge-inline.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix deployment tracking panel state on unit selection'
          git push origin HEAD:feature/opponent-turn-history
