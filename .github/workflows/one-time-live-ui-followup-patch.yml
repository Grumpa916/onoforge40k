name: One-time live UI follow-up patch

on:
  push:
    branches:
      - feature/opponent-turn-history-clean-reset

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opponent-turn-history-clean-reset
          fetch-depth: 1
      - name: Apply patch
        run: python3 scripts/one-time-live-ui-patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A .github/workflows/one-time-live-ui-followup-patch.yml scripts/one-time-live-ui-patch.py
          git commit -m "fix: refine deployment, objective labels, secondary scoring, unit data"
          git push origin feature/opponent-turn-history-clean-reset
