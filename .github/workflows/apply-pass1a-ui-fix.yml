name: Fix Start Battle deployment gate
on:
  push:
    branches: [feature/opponent-turn-history]
    paths: ['.github/workflows/apply-pass1a-ui-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch Start Battle gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  if(state.tournamentLifecycle==='DEPLOYMENT'){
            const deploymentCheck=tournamentDeploymentValidation();
            if(!deploymentCheck.ready){alert('Deployment is incomplete:\\n\\n• '+deploymentCheck.missing.join('\\n• '));return false;}
          }else if(state.tournamentLifecycle!=='SETUP'){
            alert('The tournament is not in Setup or Deployment.');
            return false;
          }
"""
          new="""  if(!['SETUP','DEPLOYMENT'].includes(state.tournamentLifecycle)){
            alert('The tournament is not in Setup or Deployment.');
            return false;
          }
"""
          if old not in s:
              raise SystemExit('Expected Pass 1A Start Battle gate was not found; refusing to modify index.html')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/index.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.js
          grep -F "if(!['SETUP','DEPLOYMENT'].includes(state.tournamentLifecycle))" index.html
          grep -F "const transitions={SETUP:['DEPLOYMENT','LIVE']" index.html
          ! grep -F 'onclick="beginDeployment()">Begin Deployment</button>' index.html
      - name: Commit source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-pass1a-ui-fix.yml
          git add index.html
          git commit -m "Allow Start Battle without deployment validation"
          git push origin HEAD:feature/opponent-turn-history
