name: Apply Pass 1A UI Fix
on:
  push:
    branches: [feature/opponent-turn-history]
    paths: ['.github/workflows/apply-pass1a-ui-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          patches=[
          ("<button class=\"btn primary\" type=\"button\" onclick=\"beginDeployment()\">Begin Deployment</button><button class=\"btn primary\" type=\"button\" onclick=\"startBattle()\" ${state.tournamentLifecycle==='DEPLOYMENT'?'':'disabled'}>Start Battle</button>","<button class=\"btn primary\" type=\"button\" onclick=\"startBattle()\" ${(['SETUP','DEPLOYMENT'].includes(state.tournamentLifecycle))?'':'disabled'}>Start Battle</button>"),
          ("const transitions={SETUP:['DEPLOYMENT'],DEPLOYMENT:['SETUP','LIVE'],LIVE:['COMPLETED'],COMPLETED:['SETUP']};","const transitions={SETUP:['DEPLOYMENT','LIVE'],DEPLOYMENT:['SETUP','LIVE'],LIVE:['COMPLETED'],COMPLETED:['SETUP']};"),
          ("""if(state.tournamentLifecycle!=='DEPLOYMENT'){
            alert('Begin Deployment before starting the live battle.');
            return false;
          }
          const deploymentCheck=tournamentDeploymentValidation();
          if(!deploymentCheck.ready){alert('Deployment is incomplete:\n\n• '+deploymentCheck.missing.join('\n• '));return false;}""","""if(state.tournamentLifecycle==='DEPLOYMENT'){
            const deploymentCheck=tournamentDeploymentValidation();
            if(!deploymentCheck.ready){alert('Deployment is incomplete:\n\n• '+deploymentCheck.missing.join('\n• '));return false;}
          }else if(state.tournamentLifecycle!=='SETUP'){
            alert('The tournament is not in Setup or Deployment.');
            return false;
          }""")]
          for a,b in patches:
            if s.count(a)!=1: raise SystemExit('Pass 1A expected one match')
            s=s.replace(a,b)
          old="${state.currentTurn==='opp'?opponentTurnTrackingHtml():(tacticalMovementTrackerHtml()+tacticalAdvisorHtml()+tacticalContextHtml()+tacticalShootingResultHtml()+tacticalPreRollResolutionModal())}"
          new="${state.currentTurn==='opp'?(opponentTurnTrackingHtml()+tacticalPreRollResolutionModal()):(tacticalMovementTrackerHtml()+tacticalAdvisorHtml()+tacticalContextHtml()+tacticalShootingResultHtml()+tacticalPreRollResolutionModal())}"
          if old in s: s=s.replace(old,new)
          elif new not in s: raise SystemExit('Resolver fix missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/index.js').write_text('\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          PY
          node --check /tmp/index.js
          grep -F "const transitions={SETUP:['DEPLOYMENT','LIVE']" index.html
          grep -F "(['SETUP','DEPLOYMENT'].includes(state.tournamentLifecycle))" index.html
          ! grep -F 'onclick="beginDeployment()">Begin Deployment</button>' index.html
      - name: Commit source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-pass1a-ui-fix.yml
          git add index.html
          git commit -m "Apply Pass 1A UI setup flow"
          git push origin HEAD:feature/opponent-turn-history
