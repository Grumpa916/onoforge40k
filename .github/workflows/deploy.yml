name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout

        uses: actions/checkout@v6

      - name: Run five-part catalogue integrity audit
        shell: bash
        run: node scripts/catalogue-audit.js

      - name: Run objective and scoring regression audit
        shell: bash
        run: node scripts/objective-scoring-audit.js

      - name: Run Step 20 tournament regression audit
        shell: bash
        run: node scripts/tournament-regression-audit.js

      - name: Run Step 22 tournament playtest integration audit
        shell: bash
        run: node scripts/tournament-playtest-audit.js

      - name: Run Step 23 interactive tournament map layer audit
        shell: bash
        run: node scripts/map-interaction-audit.js

      - name: Run Task 24 objective control refinement audit
        shell: bash
        run: node scripts/objective-control-refinement-audit.js

      - name: Run Task 25 Tactical Advisor integration audit
        shell: bash
        run: node scripts/tactical-advisor-integration-audit.js

      - name: Run Task 26 tournament UI optimization audit
        shell: bash
        run: node scripts/tournament-ui-optimization-audit.js
      
      - name: Run Task 28 dice entry architecture audit
        shell: bash
        run: node scripts/dice-entry-architecture-audit.js
      
      - name: Run Task 29 Tactical Advisor scope regression audit
        shell: bash
        run: node scripts/tactical-advisor-scope-audit.js

      - name: Run Task 31 model-level damage resolution audit
        shell: bash
        run: node scripts/model-level-damage-audit.js

      - name: Run Task 32 FNP resolution integrity audit
        shell: bash
        run: node scripts/fnp-resolution-audit.js

      - name: Run Track 1 end-of-turn scoring audit
        shell: bash
        run: node scripts/track1-end-turn-scoring-audit.js

      - name: Run Track 1 scoring VP CP integrity audit
        shell: bash
        run: node scripts/track1-scoring-vp-cp-audit.js

      - name: Run Track 1 turn phase action-log integrity audit
        shell: bash
        run: node scripts/track1-turn-phase-action-log-audit.js
      - name: Run Track 1 authoritative game-state completion audit
        shell: bash
        run: node scripts/track1-completion-audit.js

      - name: Run Track 2 physical combat regression audit
        shell: bash
        run: node scripts/track2-combat-regression-audit.js

      - name: Run Track 3 mission system regression audit
        shell: bash
        run: node scripts/track3-mission-system-audit.js

      - name: Run Track 3 mission catalogue and scoring audit
        shell: bash
        run: node scripts/track3-mission-catalogue-audit.js
      - name: Run Army Builder Bodyguard and naming audit
        shell: bash
        run: node scripts/army-builder-bodyguard-naming-audit.js

      - name: Run Track 4 Tactical Advisor v2 battle-state audit
        shell: bash
        run: node scripts/track4-tactical-advisor-v2-audit.js
      - name: Run Track 4 prioritization refinement audit
        shell: bash
        run: node scripts/track4-prioritization-refinement-audit.js

      - name: Run Track 5 Tournament Operations integrity audit
        shell: bash
        run: node scripts/track5-tournament-operations-audit.js
      - name: Run Track 5 lifecycle and result lock audit
        shell: bash
        run: node scripts/track5-result-lock-audit.js
      - name: Run Track 5 tournament recovery audit
        shell: bash
        run: node scripts/track5-tournament-recovery-audit.js
      - name: Run Track 5 tournament-day workflow hardening audit
        shell: bash
        run: node scripts/track5-tournament-day-workflow-audit.js

      - name: Run Track 6 Rules Data Integrity audit
        shell: bash
        run: node scripts/track6-rules-data-integrity-audit.js
      - name: Run Track 6 rules coverage audit
        shell: bash
        run: node scripts/track6-rules-coverage-audit.js
      - name: Run Track 6 edition contamination audit
        shell: bash
        run: node scripts/track6-edition-contamination-audit.js
      - name: Run Track 6 source consistency audit
        shell: bash
        run: node scripts/track6-source-consistency-audit.js
      - name: Run Track 7 tournament UX audit
        shell: bash
        run: node scripts/track7-tournament-ux-audit.js
      - name: Run terrain measurement map audit
        shell: bash
        run: node scripts/terrain-measurement-map-audit.js

      - name: Run deployment planning and live battlefield map integrity audit
        shell: bash
        run: node scripts/deployment-map-integrity-audit.js
      
      - name: Run live deployment tracking and drag-map integrity audit
        shell: bash
        run: node scripts/live-deployment-map-audit.js
      - name: Run reserve declaration and live-map integrity audit
        shell: bash
        run: node scripts/reserve-map-integrity-audit.js

      - name: Run architecture map audit
        shell: bash
        run: node scripts/architecture-map-audit.js


      - name: Inject Tactical Advisor decision layer into deploy artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          layers = [
              ("onoforge-tactical-advisor-engine", Path("tactical-advisor-engine.js")),
              ("onoforge-tactical-advisor-adapter", Path("tactical-advisor-adapter.js")),
              ("onoforge-tactical-charge-workflow", Path("tactical-charge-workflow.js")),
          ]
          for script_id, source_path in layers:
              marker = f'id="{script_id}"'
              if marker not in html:
                  content = source_path.read_text(encoding="utf-8")
                  tag = f'<script id="{script_id}">\n{content}\n</script>'
                  html = html.replace("</head>", tag + "</head>", 1)
          required = ['id="onoforge-tactical-advisor-engine"', 'id="onoforge-tactical-advisor-adapter"', 'id="onoforge-tactical-charge-workflow"']
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing Tactical Advisor layer injection: " + ", ".join(missing))
          p.write_text(html, encoding="utf-8")
          print("Injected Tactical Advisor engagement engine and adapter into deploy artifact")
          PY

      - name: Validate Tactical Advisor decision-layer injection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          checks = [
              ('onoforge-tactical-advisor-engine', 'ONOFORGE_TACTICAL_ADVISOR'),
              ('onoforge-tactical-advisor-adapter', 'ONOFORGE_TACTICAL_ADVISOR_ADAPTER'),
              ('onoforge-tactical-charge-workflow', 'ONOFORGE_TACTICAL_CHARGE_WORKFLOW'),
          ]
          for script_id, symbol in checks:
              if f'id="{script_id}"' not in html:
                  raise SystemExit(f"Missing {script_id}")
              if symbol not in html:
                  raise SystemExit(f"Missing {symbol}")
          print("Tactical Advisor decision-layer injection validated")
          PY

      - name: Render Tactical Advisor decision surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          css = r"""
          <style id="onoforge-advisor-render-css">
          .ta-decision-render{background:#0d1621;border:1px solid #3d6688;border-radius:12px;padding:14px;margin:0 0 14px}
          .ta-decision-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
          .ta-decision-title{font-size:16px;font-weight:900}.ta-decision-sub{font-size:11px;color:#9fb4c8;margin-top:3px}
          .ta-mode{padding:6px 9px;border:1px solid #4f789c;border-radius:999px;background:#16283a;font-size:10px;font-weight:900;letter-spacing:.06em}
          .ta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
          .ta-metric{background:#0b1018;border:1px solid #2b3b4e;border-radius:8px;padding:8px;min-width:0}
          .ta-metric b{display:block;font-size:16px}.ta-metric span{display:block;color:#8798aa;font-size:9px;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
          .ta-reason{margin-top:10px;padding:9px 10px;background:#111e2b;border-left:3px solid #4f9ad6;border-radius:6px;font-size:11px;line-height:1.35}
          .ta-targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
          .ta-target{background:#0b1018;border:1px solid #2b3b4e;border-radius:8px;padding:9px}
          .ta-target-name{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .ta-target-score{font-size:20px;font-weight:900;margin-top:3px}.ta-target-meta{font-size:9px;color:#8fa0b1;line-height:1.35;margin-top:3px}
          .ta-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
          .ta-compare-card{background:#0b1018;border:1px solid #2b3b4e;border-radius:8px;padding:9px}
          .ta-compare-card span{display:block;color:#8798aa;font-size:9px;text-transform:uppercase;letter-spacing:.07em}
          .ta-compare-card b{display:block;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .ta-compare-card small{display:block;color:#8fa0b1;font-size:9px;margin-top:3px}
          .ta-unknown{color:#9ca8b8;font-size:10px}.ta-foot{font-size:9px;color:#75879a;margin-top:9px}
          @media(max-width:900px){.ta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ta-targets,.ta-compare{grid-template-columns:1fr}}
          </style>
          """
          js = r"""
          <script id="onoforge-advisor-render-js">
          (function(){
            let lastSig='';
            let busy=false;
            function pct(v){return Number.isFinite(Number(v))?Math.round(Math.max(0,Math.min(1,Number(v)))*100)+'%':'—'}
            function num(v,d=0){return Number.isFinite(Number(v))?Number(v).toFixed(d):'—'}
            function firstFriendly(){
              const arr=Array.isArray(state?.my)?state.my:[];
              const selected=state?.tactical?.selectedAttackerUid;
              return arr.find(x=>x&&String(x.uid)===String(selected)&&!x.attachedTo&&!x.destroyed)||arr.find(x=>x&&x.uid&&!x.attachedTo&&x.alive!==false&&!x.destroyed&&!x.isDestroyed)||arr.find(x=>x&&x.uid)||null;
            }
            function extractTargets(result){
              const candidates=[];
              for(const k of ['targets','recommendations','results','enemyTargets','targetResults']){
                if(Array.isArray(result?.[k])) candidates.push(...result[k]);
              }
              if(!candidates.length){
                for(const v of Object.values(result||{})){
                  if(Array.isArray(v)&&v.some(x=>x&&typeof x==='object'&&('decisionScore' in x||'decisionMode' in x))) candidates.push(...v);
                }
              }
              return candidates.filter(x=>x&&typeof x==='object');
            }
            function modeLabel(m){
              return ({SCORE_NOW:'SCORE NOW',DENY_SCORE:'DENY SCORE',PRESERVE_UNIT:'PRESERVE UNIT',TRADE_UP:'TRADE UP',SET_UP_FUTURE_SCORE:'SET UP FUTURE SCORE',TACTICAL:'TACTICAL',LOW_CONFIDENCE:'LOW CONFIDENCE'})[m]||'TACTICAL';
            }
            function renderAdvisor(){
              const host=document.getElementById('onoforge-advisor-render');
              if(!host)return;
              if(state?.page!=='battle'){host.innerHTML='';return}
              const a=firstFriendly();
              if(!a||typeof window.tacticalAdvisorV1!=='function'){
                host.innerHTML='<div class="ta-decision-render"><div class="ta-decision-title">Tactical Advisor</div><div class="ta-unknown">Waiting for an active friendly unit and legal combat state.</div></div>';
                return;
              }
              const stateSig=typeof window.tacticalAdvisorStateSignature==='function'?window.tacticalAdvisorStateSignature():'';
              const sig=[stateSig,state.page,a.uid].join('|');
              if(sig===lastSig)return;
              lastSig=sig;
              if(busy)return;
              busy=true;
              try{
                const r=(typeof window.getTacticalAdvisorResult==='function'
                  ?window.getTacticalAdvisorV2Result(a.uid,{samples:4000})
                  :window.tacticalAdvisorV2(a.uid,{samples:4000}))||{};
                const allBaselineTargets=extractTargets(r);
                const baselineTargets=allBaselineTargets.slice(0,3);
                const baselineTop=baselineTargets[0]||{};
                const compareBase={...r,recommendations:allBaselineTargets.map(x=>({...x}))};
                const layerAdapter=window.ONOFORGE_TACTICAL_ADVISOR_ADAPTER;
                const layerEngine=window.ONOFORGE_TACTICAL_ADVISOR;
                const layered=layerAdapter&&layerEngine
                  ?layerAdapter.enrichAdvisor(compareBase,layerEngine)
                  :compareBase;
                const tacticalTargets=Array.isArray(layered.recommendations)?layered.recommendations.slice(0,3):[];
                const tacticalTop=tacticalTargets[0]||baselineTop;
                const dc=baselineTop.decisionComponents||{};
                const mc=r.missionDecisionContext||{};
                const mode=baselineTop.decisionMode||dc.mode||'TACTICAL';
                const interpretation=baselineTop.decisionInterpretation||dc.interpretation||'No single mission mode dominates the current exchange.';
                const tacticalReasons=Array.isArray(tacticalTop.tacticalImpactReasons)?tacticalTop.tacticalImpactReasons:[];
                const isCharge=r.chargeMode===true||String(r.phase||'')==='Charge'||String(r.decisionContext?.phase||'')==='Charge';
                const chargeActionState=typeof window.tacticalAdvisorActionState==='function'?window.tacticalAdvisorActionState(a.uid):null;
                const projected=tacticalTop.projectedFight||{};
                const projectedOut=projected.outgoing?.result||{};
                const projectedIn=projected.incoming?.result||{};
                const chargeMeasurement=projected.distanceEvidence||{};
                const chargePanel=isCharge&&projected.available
                  ?'<div class="ta-reason"><b>Projected Fight exchange:</b> '+num(projectedOut.damage,1)+' damage / '+num(projectedOut.modelsKilled,1)+' models from the charge, versus '+num(projectedIn.damage,1)+' expected return damage. Charge success '+pct(tacticalTop.chargeSuccessChance)+' • '+(chargeMeasurement.physicalDistanceConfirmed?'measured distance confirmed':'physical distance still required')+'.</div>'
                  :isCharge?'<div class="ta-reason"><b>Projected Fight:</b> incomplete for this candidate.'+
                    (projected?.reason?' '+String(projected.reason)+'.':'')+
                    ((projected?.outgoing?.available===false&&projected?.outgoing?.reason)?' Outgoing: '+String(projected.outgoing.reason)+'.':'')+
                    ((projected?.incoming?.available===false&&projected?.incoming?.reason)?' Return: '+String(projected.incoming.reason)+'.':'')+
                    '</div>':'';
                host.innerHTML=
                  '<div class="ta-decision-render">'+
                  '<div class="ta-decision-head"><div><div class="ta-decision-title">Tactical Advisor</div><div class="ta-decision-sub">8-factor mission-aware decision model • active combat recommendation</div></div>'+
                  '<div class="ta-mode">'+modeLabel(mode)+'</div></div>'+
                  '<div class="ta-grid">'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.lethality)+'</b><span>Lethality</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.scoreNow)+'</b><span>Score now</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.denyOpponentScore)+'</b><span>Deny score</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.preserveFriendlyUnit)+'</b><span>Preserve</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.tradeValue)+'</b><span>Trade</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.objectiveValue)+'</b><span>Objective</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.futureScoringValue)+'</b><span>Future score</span></div>'+
                  '<div class="ta-metric"><b>'+pct(baselineTop.decisionConfidence)+'</b><span>Confidence</span></div>'+
                  '</div>'+
                  '<div class="ta-reason"><b>Why:</b> '+String(interpretation)+'</div>'+
                  chargePanel+
                  (isCharge?chargeExecutionPanel(a.uid,allBaselineTargets,chargeActionState):'')+
                  (baselineTargets.length?'<div class="ta-targets">'+baselineTargets.map((t,i)=>'<div class="ta-target"><div class="ta-target-name">'+String(t.targetName||t.name||t.defenderName||'Target '+(i+1))+'</div><div class="ta-target-score">'+pct(t.decisionScore)+'</div><div class="ta-target-meta">Existing '+modeLabel(t.decisionMode||'TACTICAL')+''+(isCharge&&t.projectedFight?.outgoing?.result ? ' • projected '+num(t.projectedFight.outgoing.result.damage,1)+'W / return '+num(t.projectedFight.incoming?.result?.damage,1)+'W' : ' • damage '+num(t.expectedDamage,1)+' • kill '+pct(t.killFraction||t.wipeChance))+'</div></div>').join('')+'</div>':'<div class="ta-unknown" style="margin-top:10px">No legal target recommendation is available from the current state.</div>')+
                  '<div class="ta-compare"><div class="ta-compare-card"><span>Existing Advisor</span><b>'+String(baselineTop.name||baselineTop.targetName||'—')+'</b><small>'+num(baselineTop.decisionScore,2)+' current decision score</small></div><div class="ta-compare-card"><span>Tactical Impact Layer</span><b>'+String(tacticalTop.name||tacticalTop.targetName||'—')+'</b><small>'+num(tacticalTop.tacticalImpactScore,2)+' • '+String(tacticalTop.tacticalImpactType||'TACTICAL')+'</small></div></div>'+
                  (String(baselineTop.entryUid||'')!==String(tacticalTop.entryUid||'')&&baselineTop.entryUid&&tacticalTop.entryUid?'<div class="ta-reason"><b>Comparison:</b> The new tactical layer would change the leading candidate; the existing Advisor ordering remains authoritative during this test.</div>':'')+
                  (tacticalReasons.length?'<div class="ta-reason"><b>Tactical layer:</b> '+tacticalReasons.map(String).join(' • ')+'</div>':'')+
                  (tacticalTop.requiresPhysicalConfirmation?'<div class="ta-foot">Execution note: physical measurement is still required; live-map geometry is not authoritative.</div>':'')+
                  '<div class="ta-foot">Mission context: Round '+String(mc.round??state.round??'—')+' • VP '+String(mc.myVP??state.myVP??'—')+'–'+String(mc.oppVP??state.oppVP??'—')+' • Battlefield Layout '+String(mc.battlefield?.mapLayout||state.objectiveMapLayout||'—')+(mc.battlefield?.mapPage?' • Event Companion p.'+String(mc.battlefield.mapPage):'')+' • objective data is used only when known; unknown state is not guessed.</div>'+
                  '</div>';
              }catch(e){
                console.error('OnoForge Tactical Impact render error',e);
                host.innerHTML='<div class="ta-decision-render"><div class="ta-decision-title">Tactical Advisor</div><div class="ta-unknown">Decision analysis unavailable for this state.<br><span style="opacity:.8">Diagnostic: '+String(e?.message||e).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})+'</span></div></div>';
              }finally{busy=false}
            }
            function chargeExecutionPanel(attackerUid,targets,actionState){
              const selectedTargets=Array.isArray(actionState?.chargeTargets)?actionState.chargeTargets.map(String):[];
              if(actionState?.chargeDone){
                const outcome=actionState.chargeMade?'Successful':'Failed';
                const names=selectedTargets.map(uid=>{
                  const hit=targets.find(t=>String(t.entryUid)===uid);
                  return hit?.name||uid;
                }).join(', ');
                return '<div class="ta-reason"><b>Charge recorded:</b> '+outcome+(names?' • '+String(names):'')+'<br><button type="button" class="btn primary" style="margin-top:7px;width:100%" onclick="window.advancePhase();return false;">Continue to Fight</button></div>';
              }
              const rows=targets.filter(t=>t&&t.entryUid&&t.recommendationEligible!==false).map((t,i)=>{
                const raw=state?.tactical?.pairs?.[String(attackerUid)+'>'+String(t.entryUid)]||{};
                const measured=Number.isFinite(Number(raw.distanceInches));
                const checked=String(state?.tactical?.selectedTargetUid||'')===String(t.entryUid);
                return '<label style="display:flex;gap:7px;align-items:center;margin-top:5px;font-size:10px"><input type="checkbox" data-onoforge-charge-target="'+String(t.entryUid).replace(/"/g,'&quot;')+'" '+(checked?'checked ':'')+'><span><b>'+String(t.name||('Target '+(i+1)))+'</b> • '+(measured?Number(raw.distanceInches).toFixed(1)+'" measured':'measure distance first')+'</span></label>';
              }).join('');
              return '<div class="ta-reason"><b>Charge execution</b><div class="tiny" style="margin-top:3px">Physically measure selected target distances, then record the 2D6 result. The app records success/failure; it does not require individual dice values.</div>'+(rows||'<div class="tiny" style="margin-top:6px">No currently eligible Charge targets.</div>')+
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button type="button" class="btn primary" onclick="window.recordTacticalChargeResult(\'success\',\''+String(attackerUid).replace(/'/g,"\\'")+'\');return false;">Charge Successful</button><button type="button" class="btn" onclick="window.recordTacticalChargeResult(\'failed\',\''+String(attackerUid).replace(/'/g,"\\'")+'\');return false;">Charge Failed</button></div></div>';
            }
            function ensureHost(){
              let h=document.getElementById('onoforge-advisor-render');
              if(!h){
                const advisorCard=document.querySelector('.tactical-advisor-card');
                if(!advisorCard||!advisorCard.parentNode)return;
                h=document.createElement('div');
                h.id='onoforge-advisor-render';
                advisorCard.parentNode.insertBefore(h,advisorCard);
              }
              renderAdvisor();
            }
            window.addEventListener('load',function(){setTimeout(ensureHost,500)});
            const oldRender=window.render;
            if(typeof oldRender==='function'){
              window.render=function(){const out=oldRender.apply(this,arguments);ensureHost();return out}
            }
          })();
          </script>
          """
          if 'id="onoforge-advisor-render-css"' not in html:
              html = html.replace('</head>', css + '</head>', 1)
          if 'id="onoforge-advisor-render-js"' not in html:
              html = html.replace('</body>', js + '</body>', 1)
          p.write_text(html, encoding="utf-8")
          print("Rendered Tactical Advisor decision surface into deploy artifact")
          PY

      - name: Run runtime internal symbol audit
        shell: bash
        run: node scripts/runtime-internal-symbol-audit.js

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No script blocks found")
          Path("/tmp/onoforge.js").write_text("\n\n".join(scripts), encoding="utf-8")
          print(f"Validated {len(scripts)} script block(s)")
          PY
          node --check /tmp/onoforge.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
