name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout

        uses: actions/checkout@v6

      - name: Run five-part catalogue integrity audit
        shell: bash
        run: node scripts/catalogue-audit.js

      - name: Run objective and scoring regression audit
        shell: bash
        run: node scripts/objective-scoring-audit.js

      - name: Run Step 20 tournament regression audit
        shell: bash
        run: node scripts/tournament-regression-audit.js

      - name: Run Step 22 tournament playtest integration audit
        shell: bash
        run: node scripts/tournament-playtest-audit.js

      - name: Run Step 23 interactive tournament map layer audit
        shell: bash
        run: node scripts/map-interaction-audit.js

      - name: Run Task 24 objective control refinement audit
        shell: bash
        run: node scripts/objective-control-refinement-audit.js

      - name: Run Task 25 Tactical Advisor integration audit
        shell: bash
        run: node scripts/tactical-advisor-integration-audit.js

      - name: Run Task 26 tournament UI optimization audit
        shell: bash
        run: node scripts/tournament-ui-optimization-audit.js
      
      - name: Run Task 28 dice entry architecture audit
        shell: bash
        run: node scripts/dice-entry-architecture-audit.js
      
      - name: Run Task 29 Tactical Advisor scope regression audit
        shell: bash
        run: node scripts/tactical-advisor-scope-audit.js

      - name: Run Task 31 model-level damage resolution audit
        shell: bash
        run: node scripts/model-level-damage-audit.js

      - name: Run Task 32 FNP resolution integrity audit
        shell: bash
        run: node scripts/fnp-resolution-audit.js

      - name: Run Track 1 end-of-turn scoring audit
        shell: bash
        run: node scripts/track1-end-turn-scoring-audit.js

      - name: Run Track 1 scoring VP CP integrity audit
        shell: bash
        run: node scripts/track1-scoring-vp-cp-audit.js

      - name: Render Tactical Advisor decision surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          css = r"""
          <style id="onoforge-advisor-render-css">
          .ta-decision-render{background:#0d1621;border:1px solid #3d6688;border-radius:12px;padding:14px;margin:0 0 14px}
          .ta-decision-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
          .ta-decision-title{font-size:16px;font-weight:900}.ta-decision-sub{font-size:11px;color:#9fb4c8;margin-top:3px}
          .ta-mode{padding:6px 9px;border:1px solid #4f789c;border-radius:999px;background:#16283a;font-size:10px;font-weight:900;letter-spacing:.06em}
          .ta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
          .ta-metric{background:#0b1018;border:1px solid #2b3b4e;border-radius:8px;padding:8px;min-width:0}
          .ta-metric b{display:block;font-size:16px}.ta-metric span{display:block;color:#8798aa;font-size:9px;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
          .ta-reason{margin-top:10px;padding:9px 10px;background:#111e2b;border-left:3px solid #4f9ad6;border-radius:6px;font-size:11px;line-height:1.35}
          .ta-targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
          .ta-target{background:#0b1018;border:1px solid #2b3b4e;border-radius:8px;padding:9px}
          .ta-target-name{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .ta-target-score{font-size:20px;font-weight:900;margin-top:3px}.ta-target-meta{font-size:9px;color:#8fa0b1;line-height:1.35;margin-top:3px}
          .ta-unknown{color:#9ca8b8;font-size:10px}.ta-foot{font-size:9px;color:#75879a;margin-top:9px}
          @media(max-width:900px){.ta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ta-targets{grid-template-columns:1fr}}
          </style>
          """
          js = r"""
          <script id="onoforge-advisor-render-js">
          (function(){
            let lastSig='';
            let busy=false;
            function pct(v){return Number.isFinite(Number(v))?Math.round(Math.max(0,Math.min(1,Number(v)))*100)+'%':'—'}
            function num(v,d=0){return Number.isFinite(Number(v))?Number(v).toFixed(d):'—'}
            function firstFriendly(){
              const arr=Array.isArray(window.state?.my)?window.state.my:[];
              const selected=window.state?.tactical?.selectedAttackerUid;
              return arr.find(x=>x&&String(x.uid)===String(selected)&&!x.attachedTo&&!x.destroyed)||arr.find(x=>x&&x.uid&&!x.attachedTo&&x.alive!==false&&!x.destroyed&&!x.isDestroyed)||arr.find(x=>x&&x.uid)||null;
            }
            function extractTargets(result){
              const candidates=[];
              for(const k of ['targets','recommendations','results','enemyTargets','targetResults']){
                if(Array.isArray(result?.[k])) candidates.push(...result[k]);
              }
              if(!candidates.length){
                for(const v of Object.values(result||{})){
                  if(Array.isArray(v)&&v.some(x=>x&&typeof x==='object'&&('decisionScore' in x||'decisionMode' in x))) candidates.push(...v);
                }
              }
              return candidates.filter(x=>x&&typeof x==='object').sort((a,b)=>(Number(b.decisionScore)||-1)-(Number(a.decisionScore)||-1));
            }
            function modeLabel(m){
              return ({SCORE_NOW:'SCORE NOW',DENY_SCORE:'DENY SCORE',PRESERVE_UNIT:'PRESERVE UNIT',TRADE_UP:'TRADE UP',SET_UP_FUTURE_SCORE:'SET UP FUTURE SCORE',TACTICAL:'TACTICAL',LOW_CONFIDENCE:'LOW CONFIDENCE'})[m]||'TACTICAL';
            }
            function renderAdvisor(){
              const host=document.getElementById('onoforge-advisor-render');
              if(!host)return;
              if(window.state?.page!=='battle'){host.innerHTML='';return}
              const a=firstFriendly();
              if(!a||typeof window.tacticalAdvisorV1!=='function'){
                host.innerHTML='<div class="ta-decision-render"><div class="ta-decision-title">Tactical Advisor</div><div class="ta-unknown">Waiting for an active friendly unit and legal combat state.</div></div>';
                return;
              }
              const stateSig=typeof window.tacticalAdvisorStateSignature==='function'?window.tacticalAdvisorStateSignature():'';
              const sig=[stateSig,window.state.page,a.uid].join('|');
              if(sig===lastSig)return;
              lastSig=sig;
              if(busy)return;
              busy=true;
              try{
                const r=(typeof window.getTacticalAdvisorResult==='function'
                  ?window.getTacticalAdvisorResult(a.uid,{samples:4000})
                  :window.tacticalAdvisorV1(a.uid,{samples:4000}))||{};
                const targets=extractTargets(r).slice(0,3);
                const top=targets[0]||{};
                const dc=top.decisionComponents||{};
                const mc=r.missionDecisionContext||{};
                const mode=top.decisionMode||dc.mode||'TACTICAL';
                const interpretation=top.decisionInterpretation||dc.interpretation||'No single mission mode dominates the current exchange.';
                host.innerHTML=
                  '<div class="ta-decision-render">'+
                  '<div class="ta-decision-head"><div><div class="ta-decision-title">Tactical Advisor</div><div class="ta-decision-sub">8-factor mission-aware decision model • active combat recommendation</div></div>'+
                  '<div class="ta-mode">'+modeLabel(mode)+'</div></div>'+
                  '<div class="ta-grid">'+
                  '<div class="ta-metric"><b>'+pct(top.lethality)+'</b><span>Lethality</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.scoreNow)+'</b><span>Score now</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.denyOpponentScore)+'</b><span>Deny score</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.preserveFriendlyUnit)+'</b><span>Preserve</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.tradeValue)+'</b><span>Trade</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.objectiveValue)+'</b><span>Objective</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.futureScoringValue)+'</b><span>Future score</span></div>'+
                  '<div class="ta-metric"><b>'+pct(top.decisionConfidence)+'</b><span>Confidence</span></div>'+
                  '</div>'+
                  '<div class="ta-reason"><b>Why:</b> '+String(interpretation)+'</div>'+
                  (targets.length?'<div class="ta-targets">'+targets.map((t,i)=>'<div class="ta-target"><div class="ta-target-name">'+String(t.targetName||t.name||t.defenderName||'Target '+(i+1))+'</div><div class="ta-target-score">'+pct(t.decisionScore)+'</div><div class="ta-target-meta">'+modeLabel(t.decisionMode||'TACTICAL')+' • damage '+num(t.expectedDamage,1)+' • kill '+pct(t.killFraction||t.wipeChance)+'</div></div>').join('')+'</div>':'<div class="ta-unknown" style="margin-top:10px">No legal target recommendation is available from the current state.</div>')+
                  '<div class="ta-foot">Mission context: Round '+String(mc.round??window.state.round??'—')+' • VP '+String(mc.myVP??window.state.myVP??'—')+'–'+String(mc.oppVP??window.state.oppVP??'—')+' • Battlefield Layout '+String(mc.battlefield?.mapLayout||window.state.objectiveMapLayout||'—')+(mc.battlefield?.mapPage?' • Event Companion p.'+String(mc.battlefield.mapPage):'')+' • objective data is used only when known; unknown state is not guessed.</div>'+
                  '</div>';
              }catch(e){
                host.innerHTML='<div class="ta-decision-render"><div class="ta-decision-title">Tactical Advisor</div><div class="ta-unknown">Decision analysis unavailable for this state.</div></div>';
              }finally{busy=false}
            }
            function ensureHost(){
              const h=document.getElementById('onoforge-advisor-render');
              if(h)renderAdvisor();
            }
            window.addEventListener('load',function(){setTimeout(ensureHost,500)});
            const oldRender=window.render;
            if(typeof oldRender==='function'){
              window.render=function(){const out=oldRender.apply(this,arguments);ensureHost();return out}
            }
          })();
          </script>
          """
          if 'id="onoforge-advisor-render-css"' not in html:
              html = html.replace('</head>', css + '</head>', 1)
          if 'id="onoforge-advisor-render-js"' not in html:
              html = html.replace('</body>', js + '</body>', 1)
          p.write_text(html, encoding="utf-8")
          print("Rendered Tactical Advisor decision surface into deploy artifact")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No script blocks found")
          Path("/tmp/onoforge.js").write_text("\n\n".join(scripts), encoding="utf-8")
          print(f"Validated {len(scripts)} script block(s)")
          PY
          node --check /tmp/onoforge.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
