<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnoForge Cache Reset</title></head>
<body style="font-family:Arial,sans-serif;background:#0b0f15;color:#e9edf3;padding:30px">
<h2>OnoForge cache reset</h2>
<p>Clearing the old service worker and browser caches…</p>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('./?cache-reset=314');
})();
</script>
</body>
</html>
