const CURRENT_11E_DATA_SOURCES={
  Tyranids:'https://raw.githubusercontent.com/BSData/wh40k-11e/main/Tyranids.json',
  Ultramarines:'https://raw.githubusercontent.com/BSData/wh40k-11e/main/Imperium%20-%20Ultramarines.json'

function unitDatabase(){
  return window.CURRENT_UNIT_DATABASE || ((typeof EXPANDED_CATALOGUE!=='undefined')?EXPANDED_CATALOGUE:DEMO);
}

function collectBSDataObjects(root){
  const map=new Map(), seen=new Set();
  function walk(x){
    if(!x||typeof x!=='object'||seen.has(x))return;
    seen.add(x);
    if(typeof x.id==='string')map.set(x.id,x);
    Object.keys(x).forEach(k=>walk(x[k]));
  }
  walk(root);
  return map;
}

function bsProfile(entry,typeName){
  return (entry?.profiles||[]).find(p=>p.typeName===typeName) || null;
}

function bsCharacteristics(profile){
  const out={};
  (profile?.characteristics||[]).forEach(c=>{
    const k=c.name==='LD'?'Ld':c.name;
    out[k]=c.$text??'';
  });
  return out;
}

function bsWeapons(entry){
  const out=[], seen=new Set(), visited=new Set();
  const objectMap=(typeof window!=='undefined' && window.__BS_OBJECT_MAP && typeof window.__BS_OBJECT_MAP.get==='function')?window.__BS_OBJECT_MAP:null;
  function walk(x){
    if(!x||typeof x!=='object')return;
    const objectId=x.id||x.targetId;
    if(objectId){
      if(visited.has(objectId))return;
      visited.add(objectId);
    }
    if(Array.isArray(x.profiles)){
      x.profiles.forEach(p=>{
        const type=String(p.typeName||'').toLowerCase();
        if(type!=='ranged weapons' && type!=='melee weapons' && !type.includes('ranged weapon') && !type.includes('melee weapon'))return;
        const chars=bsCharacteristics(p);
        const w={name:p.name,...chars,abilities:chars.Keywords?[chars.Keywords]:[]};
        delete w.Keywords;
        const key=JSON.stringify(w);
        if(!seen.has(key)){seen.add(key);out.push(w);}
      });
    }
    if(Array.isArray(x.selectionEntries))x.selectionEntries.forEach(walk);
    if(Array.isArray(x.selectionEntryGroups))x.selectionEntryGroups.forEach(walk);
    if(Array.isArray(x.entryLinks)){
      x.entryLinks.forEach(link=>{
        const targetId=link.targetId||link.id;
        if(objectMap && targetId){
          const target=objectMap.get(targetId);
          if(target)walk(target);
        }
      });
    }
  }
  walk(entry);
  return out;
}
function bsWargearOptions(entry){
  const out=[],seen=new Set();
  function walk(x){
    if(!x||typeof x!=='object')return;
    if(Array.isArray(x.selectionEntries))x.selectionEntries.forEach(s=>{
      if(s.type==='upgrade' && s.name && !seen.has(s.name)){
        seen.add(s.name);out.push(s.name);
      }
      walk(s);
    });
    if(Array.isArray(x.selectionEntryGroups))x.selectionEntryGroups.forEach(walk);
  }
  walk(entry);
  return out;
}

function bsUnitFromEntry(entry,faction){
  if(!entry||entry.type!=='model')return null;
  const p=bsProfile(entry,'Unit');
  if(!p)return null;
  const stats=bsCharacteristics(p);
  const pts=(entry.costs||[]).find(c=>c.name==='pts');
  const categories=(entry.categoryLinks||[]).map(c=>c.name).filter(Boolean);
  const weapons=bsWeapons(entry);
  return {
    id:`${faction}_${String(entry.name).toLowerCase().replace(/[^a-z0-9]+/g,'_')}`,
    name:entry.name,
    faction,
    points:pts?Number(pts.value):0,
    models:1,
    wounds:Number(stats.W)||1,
    profile:stats,
    keywords:categories,
    abilities:[],
    weapons,
    weaponOptions:bsWargearOptions(entry),
    dataSource:'BSData 11e',
    dataVersion:'current'
  };
}

async function refreshCurrentUnitDatabase(showMessage=true){
  try{
    const all=[];
    for(const faction of Object.keys(CURRENT_11E_DATA_SOURCES)){
      const res=await fetch(CURRENT_11E_DATA_SOURCES[faction],{cache:'no-store'});
      if(!res.ok)throw new Error(`${faction} data request failed (${res.status})`);
      const root=await res.json();
      const map=collectBSDataObjects(root);
      window.__BS_OBJECT_MAP=map;
      const links=root?.catalogue?.entryLinks||[];
      const seen=new Set();
      links.forEach(link=>{
        const entry=map.get(link.targetId||link.id);
        const u=bsUnitFromEntry(entry,faction);
        if(u&&!seen.has(u.name)){seen.add(u.name);all.push(u);}
      });
      // Also include direct model entries that may not be root-linked.
      map.forEach(entry=>{
        const u=bsUnitFromEntry(entry,faction);
        if(u&&!seen.has(u.name)){seen.add(u.name);all.push(u);}
      });
    }

    if(!all.length)throw new Error('No unit data was found.');
    const currentByName=new Map(all.map(u=>[`${u.faction}|${u.name}`,u]));

    // Merge into the existing catalogue so any custom/app-only metadata is retained.
    const merged=(typeof EXPANDED_CATALOGUE!=='undefined'?EXPANDED_CATALOGUE:[]).map(old=>{
      const fresh=currentByName.get(`${old.faction}|${old.name}`);
      return fresh?{...old,...fresh,id:old.id}:old;
    });
    all.forEach(fresh=>{
      if(!merged.some(u=>u.faction===fresh.faction&&u.name===fresh.name))merged.push(fresh);
    });
    window.CURRENT_UNIT_DATABASE=merged;
    window.DEMO=merged;
    state.dataUpdatedAt=new Date().toISOString();
    save();
    render();
    if(showMessage)alert(`Updated ${all.length} units from current 11th-edition data.`);
  }catch(err){
    console.error(err);
    if(showMessage)alert('Unit database update failed: '+(err.message||err));
  }
}
function saveCurrentArmyList(){
  if(!Array.isArray(state.savedArmyLists))state.savedArmyLists=[];
  const name=prompt('Name this army list:', `${state.faction||'Army'} List`);
  if(!name)return;
  const list={
    id:uid(),
    name,
    faction:state.faction||'',
    detachment:state.detachment||state.detachmentSelections?.[0]||'',
    units:JSON.parse(JSON.stringify(state.my||[])),
    secondaryPlans:JSON.parse(JSON.stringify(ensureSecondaryPersonalPlans())),
    created:new Date().toISOString(),
    updated:new Date().toISOString()
  };
  state.savedArmyLists.push(list);
  save();
  render();
  cloudUpsertArmyList(list).catch(()=>{});
}

function loadSavedArmyList(id){
  const list=(state.savedArmyLists||[]).find(x=>x.id===id);
  if(!list)return;
  state.myName=list.name||'My Army';
  state.faction=list.faction||'';
  state.my=JSON.parse(JSON.stringify(list.units||[]));
  state.secondaryPersonalPlans=JSON.parse(JSON.stringify(list.secondaryPlans||defaultSecondaryPersonalPlans()));ensureSecondaryPersonalPlans();state.gameReferencePersonal=JSON.parse(JSON.stringify(list.gameReferencePersonal||defaultGameReferencePersonal()));ensureGameReferencePersonal();
  state.detachmentSelections=list.detachment?[list.detachment]:[];
  state.detachment=list.detachment||'';
  state.activeRosterId=list.id;
  state.savedMyListSnapshot=currentMyListSnapshot();
  save();
  render();
}

function deleteSavedArmyList(id){
  const list=(state.savedArmyLists||[]).find(x=>x.id===id);
  state.savedArmyLists=(state.savedArmyLists||[]).filter(x=>x.id!==id);
  save();
  render();
  if(list)cloudDeleteArmyList(list).catch(()=>{});
}

function formatSavedListDate(value){
  if(!value)return 'Date not recorded';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

function forceDispositionNameForDetachment(side){
  const names=detachmentSelections(side);
  const faction=side==='my'?state.faction:state.oppFaction;
  return names.map(n=>detachmentInfo(faction,n)?.[2]).filter(Boolean);
}
function availableForceDispositions(side){return [...new Set(forceDispositionNameForDetachment(side))];}
function forceDisposition(side){
  const key=side==='my'?'myForceDisposition':'oppForceDisposition';
  const avail=availableForceDispositions(side);
  const current=state[key];
  if(current && avail.includes(current)) return current;
  return avail[0]||'';
}
function primaryMission(side){
  const own=forceDisposition(side);
  const opp=forceDisposition(side==='my'?'opp':'my');
  return own&&opp ? (PRIMARY_MISSIONS[own]?.[opp]||'') : '';
}
function setForceDisposition(side,value){
  const key=side==='my'?'myForceDisposition':'oppForceDisposition';
  const before=snapshotForUndo();
  state[key]=value;
  event('FORCE_DISPOSITION_CHANGED',{side,action:'Set Force Disposition',forceDisposition:value,primaryMission:primaryMission(side)},before);
  save();render();
}

function scorePrimary(side,vpInput){
  let vp=Math.floor(Number(vpInput)||0);
  if(vp<1)return;
  const key=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
  const before=Number(state[key])||0;
  const roundTotal=primaryRoundScoredVP(side);
  const allowed=Math.min(vp,Math.max(0,15-roundTotal),Math.max(0,45-before));
  if(allowed<=0){alert(roundTotal>=15?'Primary scoring is capped at 15 VP for this round.':'Primary Missions are capped at 45 VP for the game.');return;}
  const after=Math.min(45,before+allowed);
  const actual=after-before;
  if(actual<=0)return;
  const fullBefore=snapshotForUndo();
  state[key]=after;
  if(side==='my')state.myVP=Math.max(0,(Number(state.myVP)||0)+actual);
  else state.oppVP=Math.max(0,(Number(state.oppVP)||0)+actual);
  event('PRIMARY_SCORED',{
    side,
    unit:side==='my'?'Primary Mission':'Opponent Primary Mission',
    action:'Primary scored +'+actual+' VP',
    before,after,delta:actual,
    mission:primaryMission(side)
  },fullBefore);
  save();render();
}
function resetPrimary(side){
  const key=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
  const actual=Number(state[key])||0;
  if(actual<=0)return;
  const fullBefore=snapshotForUndo();
  state[key]=0;
  const byRoundKey=side==='my'?'primaryScoringByRoundMy':'primaryScoringByRoundOpp';
  const amountKey=side==='my'?'primaryScoringAmountsByRoundMy':'primaryScoringAmountsByRoundOpp';
  const valueKey=side==='my'?'primaryScoringValuesByRoundMy':'primaryScoringValuesByRoundOpp';
  state[byRoundKey]={};
  state[amountKey]={};
  state[valueKey]={};
  state[side==='my'?'primaryScoredItemsMy':'primaryScoredItemsOpp']=[];
  if(side==='my')state.myVP=Math.max(0,(Number(state.myVP)||0)-actual);
  else state.oppVP=Math.max(0,(Number(state.oppVP)||0)-actual);
  event('PRIMARY_SCORE_RESET',{
    side,
    unit:side==='my'?'Primary Mission':'Opponent Primary Mission',
    action:'Primary score reset -'+actual+' VP',
    before:actual,after:0,delta:-actual,
    mission:primaryMission(side)
  },fullBefore);
  save();render();
}

function primaryScoringHtml(mission){
  const rows=PRIMARY_SCORING[mission];
  if(!rows)return '<div class="muted">Scoring details not loaded for this mission.</div>';
  const round=Math.max(1,Number(state.round)||1);
  const visible=rows.filter(r=>{
    const timing=String(r[0]||'').toLowerCase();
    const isEndOfBattle=timing.includes('end of battle');
    const isEndOfTurn=timing.includes('end of turn');
    if(round===1)return isEndOfTurn;
    if(round<5)return !isEndOfBattle;
    return true;
  });
  if(!visible.length)return '<div class="muted">No scoring available this round.</div>';
  return `<div class="primary-scoring"><div class="muted primary-scoring-title">Scoring — Round ${round}</div>${visible.map(r=>`<div class="primary-score-row"><span class="tiny">${esc(r[0])}</span><strong>${esc(r[1])}</strong><span>${esc(r[2])}</span></div>`).join('')}</div>`;
}
function syncPrimaryScoringRound(){
  const round=Math.max(1,Number(state.round)||1);
  const roundKey=String(round);
  state.primaryScoringRound=round;
  if(!state.primaryScoringByRoundMy || typeof state.primaryScoringByRoundMy!=='object') state.primaryScoringByRoundMy={};
  if(!state.primaryScoringByRoundOpp || typeof state.primaryScoringByRoundOpp!=='object') state.primaryScoringByRoundOpp={};
  if(!state.primaryScoringAmountsByRoundMy || typeof state.primaryScoringAmountsByRoundMy!=='object') state.primaryScoringAmountsByRoundMy={};
  if(!state.primaryScoringAmountsByRoundOpp || typeof state.primaryScoringAmountsByRoundOpp!=='object') state.primaryScoringAmountsByRoundOpp={};
  if(!state.primaryScoringValuesByRoundMy || typeof state.primaryScoringValuesByRoundMy!=='object') state.primaryScoringValuesByRoundMy={};
  if(!state.primaryScoringValuesByRoundOpp || typeof state.primaryScoringValuesByRoundOpp!=='object') state.primaryScoringValuesByRoundOpp={};
  if(!Array.isArray(state.primaryScoringByRoundMy[roundKey])) state.primaryScoringByRoundMy[roundKey]=[];
  if(!Array.isArray(state.primaryScoringByRoundOpp[roundKey])) state.primaryScoringByRoundOpp[roundKey]=[];
  if(!state.primaryScoringAmountsByRoundMy[roundKey] || typeof state.primaryScoringAmountsByRoundMy[roundKey]!=='object') state.primaryScoringAmountsByRoundMy[roundKey]={};
  if(!state.primaryScoringAmountsByRoundOpp[roundKey] || typeof state.primaryScoringAmountsByRoundOpp[roundKey]!=='object') state.primaryScoringAmountsByRoundOpp[roundKey]={};
  if(!state.primaryScoringValuesByRoundMy[roundKey] || typeof state.primaryScoringValuesByRoundMy[roundKey]!=='object') state.primaryScoringValuesByRoundMy[roundKey]={};
  if(!state.primaryScoringValuesByRoundOpp[roundKey] || typeof state.primaryScoringValuesByRoundOpp[roundKey]!=='object') state.primaryScoringValuesByRoundOpp[roundKey]={};
  state.primaryScoredItemsMy=[...state.primaryScoringByRoundMy[roundKey]];
  state.primaryScoredItemsOpp=[...state.primaryScoringByRoundOpp[roundKey]];
}
function primaryScoringRowsForRound(mission){
  const rows=PRIMARY_SCORING[mission]||[];
  const round=Math.max(1,Number(state.round)||1);
  return rows.filter(r=>{
    const timing=String(r[0]||'').toLowerCase();
    const isEndOfBattle=timing.includes('end of battle');
    const isEndOfTurn=timing.includes('end of turn');
    if(round===1)return isEndOfTurn;
    if(round<5)return !isEndOfBattle;
    return true;
  });
}
function primaryScoringVP(value){
  const m=String(value||'').match(/\d+/);
  return m?Math.max(0,Number(m[0])||0):0;
}
function primaryScoringIsPer(row){
  const text=String(row?.[2]||'').toLowerCase();
  return /\bper\b|\bfor each\b/.test(text);
}
function primaryScoringExclusiveGroup(mission,index){
  if(mission==='Purge and Secure' && index<=1)return 'purge-secure-kill';
  if(mission==='Consecrate' && index<=1)return 'consecrate-tier';
  if(mission==='Reconnaissance Sweep' && index<=1)return 'recon-sweep-tier';
  if(mission==='Triangulation' && index>=1 && index<=3)return 'triangulation-tier';
  return '';
}
function primaryRoundScoredVP(side){
  const roundKey=String(Math.max(1,Number(state.round)||1));
  const valueKey=side==='my'?'primaryScoringValuesByRoundMy':'primaryScoringValuesByRoundOpp';
  const values=state[valueKey]?.[roundKey]||{};
  return Object.values(values).reduce((sum,v)=>sum+Math.max(0,Number(v)||0),0);
}
function primaryRoundCapRemaining(side){return Math.max(0,15-primaryRoundScoredVP(side));}
function scorePrimaryItem(side,index,mission,amountOverride){
  syncPrimaryScoringRound();
  const round=Math.max(1,Number(state.round)||1);
  const roundKey=String(round);
  const listKey=side==='my'?'primaryScoredItemsMy':'primaryScoredItemsOpp';
  const byRoundKey=side==='my'?'primaryScoringByRoundMy':'primaryScoringByRoundOpp';
  const amountKey=side==='my'?'primaryScoringAmountsByRoundMy':'primaryScoringAmountsByRoundOpp';
  const valueKey=side==='my'?'primaryScoringValuesByRoundMy':'primaryScoringValuesByRoundOpp';
  const vpKey=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
  const overallKey=side==='my'?'myVP':'oppVP';
  const rows=primaryScoringRowsForRound(mission);
  const row=rows[index];
  if(!row)return;
  const scored=Array.isArray(state[byRoundKey][roundKey])?state[byRoundKey][roundKey].slice():[];
  const values=state[valueKey][roundKey]||{};
  const amounts=state[amountKey][roundKey]||{};
  const wasScored=scored.includes(index);
  const fullBefore=snapshotForUndo();

  if(wasScored){
    const actual=Math.max(0,Number(values[index])||0);
    const before=Number(state[vpKey])||0;
    const after=Math.max(0,before-actual);
    const delta=after-before;
    state[vpKey]=after;
    state[overallKey]=Math.max(0,(Number(state[overallKey])||0)+delta);
    state[byRoundKey][roundKey]=scored.filter(i=>i!==index);
    delete values[index];
    delete amounts[index];
    state[listKey]=state[byRoundKey][roundKey];
    event('PRIMARY_UNSCORED',{side,unit:side==='my'?'Primary Mission':'Opponent Primary Mission',action:'Primary scoring condition removed -'+Math.abs(delta)+' VP',before,after,delta,mission,round,scoringItem:row[2],scoringTiming:row[0]},fullBefore);
  }else{
    const per=primaryScoringIsPer(row);
    const amount=per?Math.max(1,Math.min(50,Math.floor(Number(amountOverride??amounts[index]??1)||1))):1;
    const baseVP=primaryScoringVP(row[1]);
    const requestedVP=baseVP*amount;
    const group=primaryScoringExclusiveGroup(mission,index);

    if(group){
      for(const otherIndex of [...scored]){
        if(primaryScoringExclusiveGroup(mission,otherIndex)===group){
          const otherActual=Math.max(0,Number(values[otherIndex])||0);
          state[vpKey]=Math.max(0,(Number(state[vpKey])||0)-otherActual);
          state[overallKey]=Math.max(0,(Number(state[overallKey])||0)-otherActual);
          delete values[otherIndex];
          delete amounts[otherIndex];
        }
      }
      state[byRoundKey][roundKey]=scored.filter(i=>primaryScoringExclusiveGroup(mission,i)!==group);
    }

    const roundTotalBefore=primaryRoundScoredVP(side);
    const allowedVP=Math.min(requestedVP,Math.max(0,15-roundTotalBefore));
    if(allowedVP<=0){alert('Primary scoring is capped at 15 VP for this round.');return;}
    const before=Number(state[vpKey])||0;
    const after=Math.min(45,before+allowedVP);
    const actual=after-before;
    state[vpKey]=after;
    state[overallKey]=Math.max(0,(Number(state[overallKey])||0)+actual);
    state[byRoundKey][roundKey]=[...state[byRoundKey][roundKey],index];
    state[valueKey][roundKey][index]=actual;
    state[amountKey][roundKey][index]=amount;
    state[listKey]=state[byRoundKey][roundKey];
    event('PRIMARY_SCORED',{side,unit:side==='my'?'Primary Mission':'Opponent Primary Mission',action:'Primary scored +'+actual+' VP',before,after,delta:actual,mission,round,scoringItem:row[2],scoringTiming:row[0],amount,roundCap:15,roundTotal:roundTotalBefore+actual},fullBefore);
  }
  save();
  render();
}

function primaryScoreAdjust(side,index,mission,direction){
  const rows=primaryScoringRowsForRound(mission);
  if(!rows[index])return;
  const byRoundKey=side==='my'?'primaryScoringByRoundMy':'primaryScoringByRoundOpp';
  const roundKey=String(Math.max(1,Number(state.round)||1));
  const scored=state[byRoundKey]?.[roundKey]||[];
  if(direction>0){
    scorePrimaryItem(side,index,mission);
  }else if(scored.includes(index)){
    scorePrimaryItem(side,index,mission);
  }
}

        (per&&!done?'<label class="primary-score-quantity">Count <input type="number" min="1" max="50" value="'+amount+'" data-primary-amount="1" data-primary-side="'+side+'" data-primary-index="'+i+'" data-primary-mission="'+esc(mission)+'"></label>':'')+
      '</div>';
    }).join('')+'</div>'+
    primaryMissionRulesHtml(mission,side)+

function detachmentOptions(faction,current){const arr=DETACHMENTS[faction]||[];return arr.map(d=>`<option value="${esc(d[0])}" ${d[0]===current?'selected':''}>${esc(d[0])} — ${d[1]} DP • ${esc(d[2])}</option>`).join('')}
function detachmentInfo(faction,name){return (DETACHMENTS[faction]||[]).find(d=>d[0]===name)||null}
function detachmentSelections(side){
  const key=side==='my'?'detachmentSelections':'oppDetachmentSelections';
  const faction=side==='my'?state.faction:state.oppFaction;
  let arr=Array.isArray(state[key])?state[key].filter(n=>detachmentInfo(faction,n)):[];
  if(!arr.length){const fallback=side==='my'?state.detachment:state.oppDetachment;if(fallback&&detachmentInfo(faction,fallback))arr=[fallback]}
  return arr;
}
function detachmentDP(side){const faction=side==='my'?state.faction:state.oppFaction;return detachmentSelections(side).reduce((n,name)=>n+(detachmentInfo(faction,name)?.[1]||0),0)}
function toggleDetachment(side,name){
  const key=side==='my'?'detachmentSelections':'oppDetachmentSelections';
  const faction=side==='my'?state.faction:state.oppFaction;
  const info=detachmentInfo(faction,name); if(!info)return;
  let arr=detachmentSelections(side).slice();
  if(arr.includes(name)){
    arr=arr.filter(x=>x!==name);
  }else{
    if(detachmentDP(side)+info[1]>3){alert('Detachment Points cannot exceed 3 DP for this army.');return}
    arr.push(name);
  }
  state[key]=arr;
  if(side==='my')state.detachment=arr[0];else state.oppDetachment=arr[0];
  save();render();
}
function detachmentChecklist(side){
  const faction=side==='my'?state.faction:state.oppFaction, selected=detachmentSelections(side), totalDP=detachmentDP(side);
  return (DETACHMENTS[faction]||[]).map(d=>{
    const checked=selected.includes(d[0]), wouldExceed=!checked&&totalDP+d[1]>3;
    return `<label class="detach-check ${checked?'selected':''} ${wouldExceed?'disabled':''}"><input type="checkbox" ${checked?'checked':''} ${wouldExceed?'disabled':''} onchange="toggleDetachment('${side}','${esc(d[0])}')"><span><strong>${esc(d[0])}</strong><small>${d[1]} DP • ${esc(d[2])}</small></span></label>`;
  }).join('');
}
function detachmentSummary(side){const faction=side==='my'?state.faction:state.oppFaction, names=detachmentSelections(side), dp=detachmentDP(side);return `${names.map(n=>esc(n)).join(' + ')} • <b>${dp}/3 DP</b>`}

function ensureStratagemState(){
 if(!Array.isArray(state.stratagemsMy))state.stratagemsMy=[];
 if(!Array.isArray(state.stratagemsOpp))state.stratagemsOpp=[];
}
function armyStratagemDetachment(side){
 const faction=side==='my'?state.faction:state.oppFaction;
 const selections=side==='my'?state.detachmentSelections:state.oppDetachmentSelections;
 const fallback=side==='my'?state.detachment:state.oppDetachment;
 const det=(Array.isArray(selections)&&selections[0])||fallback||'';
 return faction&&det?`${faction} — ${det}`:'';
}
function loadStratagems(){
 ensureStratagemState();
 ['my','opp'].forEach(side=>{
  const key=side==='my'?'stratagemsMy':'stratagemsOpp';
  const previous=Array.isArray(state[key])?state[key]:[];
  const usedByName=new Set(previous.filter(s=>s&&s.used).map(s=>String(s.name)));
  const det=armyStratagemDetachment(side);
  const list=[...CORE_STRATAGEMS_11E.map(s=>({...s,source:'Core'})),...(DETACHMENT_STRATAGEMS_11E[det]||[]).map(s=>({...s,source:'Detachment',detachment:det}))];
  state[key]=list.map(s=>({
    ...s,
    id:previous.find(x=>x&&x.name===s.name)?.id||uid(),
    used:usedByName.has(String(s.name))
  }));
 });
}
function useStratagem(side,index){
 ensureStratagemState();
 const key=side==='my'?'stratagemsMy':'stratagemsOpp';
 const s=state[key][index];
 if(!s)return;

 const cpKey=side==='my'?'myCP':'oppCP';
 const beforeCP=Number(state[cpKey])||0;
 const before=snapshotForUndo();

 // Clicking an already-used stratagem toggles it back to its normal state
 // and returns the CP that was spent on it.
 if(s.used){
   const afterCP=beforeCP+s.cp;
   if(side==='my')state.myCP=afterCP;else state.oppCP=afterCP;
   s.used=false;
   event('CP_CHANGED',{side,unit:side==='my'?'My CP':'Opponent CP',action:'CP +'+s.cp,before:beforeCP,after:afterCP,delta:s.cp},before);
   event('STRATAGEM_UNSELECTED',{name:s.name,side,cp:s.cp,phase:s.phase,source:s.source,detachment:s.detachment||'',action:'Unselected — '+s.name},before);
   state.stratagemsOpen=true;
   save();render();
   return;
 }

 if(beforeCP<s.cp){alert('Not enough CP.');return;}
 const afterCP=beforeCP-s.cp;
 if(side==='my')state.myCP=afterCP;else state.oppCP=afterCP;
 s.used=true;
 event('CP_CHANGED',{side,unit:side==='my'?'My CP':'Opponent CP',action:'CP -'+s.cp,before:beforeCP,after:afterCP,delta:-s.cp},before);
 event('STRATAGEM_USED',{name:s.name,side,cp:s.cp,phase:s.phase,source:s.source,detachment:s.detachment||'',action:s.name},before);
 state.stratagemsOpen=true;
 save();render();
}
const STRATAGEM_PHASE_ORDER_11E=['Command','Movement','Shooting','Charge','Fight','End','Any Phase'];
function stratagemPhaseRank(phase){
 const p=String(phase||'Any Phase').trim();
 const i=STRATAGEM_PHASE_ORDER_11E.indexOf(p);
 return i<0?STRATAGEM_PHASE_ORDER_11E.length:i;
}
function stratagemPhaseGroups(arr){
 const sorted=(Array.isArray(arr)?arr:[]).map((s,i)=>({s,i}))
   .sort((a,b)=>stratagemPhaseRank(a.s.phase)-stratagemPhaseRank(b.s.phase)||String(a.s.name||'').localeCompare(String(b.s.name||'')));
 const groups=[];
 sorted.forEach(item=>{
  const phase=String(item.s.phase||'Any Phase');
  let group=groups.find(g=>g.phase===phase);
  if(!group){group={phase,items:[]};groups.push(group)}
  group.items.push(item);
 });
 return groups;
}

}

function secState(side){
 const k=side==='my'?'secondaryMyCards':'secondaryOppCards';
 if(!Array.isArray(state[k]))state[k]=[];
 return state[k];
}
function secDeck(side){const k=side==='my'?'secondaryMyDeck':'secondaryOppDeck';if(!Array.isArray(state[k]))state[k]=[];return state[k];}
function secDiscard(side){const k=side==='my'?'secondaryMyDiscard':'secondaryOppDiscard';if(!Array.isArray(state[k]))state[k]=[];return state[k];}
function secScored(side){const k=side==='my'?'secondaryMyScored':'secondaryOppScored';if(!Array.isArray(state[k]))state[k]=[];return state[k];}
function secondaryByName(name){return SECONDARY_CARDS.find(c=>c.name===name)||{name,type:'Secondary Mission',fixed:false,tacticalVP:5,fixedVP:5,maxVP:null};}
function secondaryChoiceOptions(side){
 const mode=side==='my'?state.secondaryMy:state.secondaryOpp;
 const active=secState(side), scored=secScored(side), discard=secDiscard(side);
 const pool=SECONDARY_CARDS.filter(c=>mode==='fixed'?c.fixed:!c.fixed);
 return pool.filter(c=>!active.includes(c.name)&&!scored.includes(c.name)&&!discard.includes(c.name));
}
function chooseSecondary(side,name){
 const mode=side==='my'?state.secondaryMy:state.secondaryOpp;
 const active=secState(side);
 if(!name)return;
 if(active.includes(name)||secScored(side).includes(name)||secDiscard(side).includes(name))return;
  const card=secondaryByName(name);
 if(mode==='fixed'&&!card.fixed)return;
 if(mode==='tactical'&&card.fixed)return;
 if(mode==='fixed' && active.length>=2){
   alert('Fixed Secondary Missions are limited to 2 active cards.');
   return;
 }
 const fullBefore=snapshotForUndo();
 if(mode==='tactical'){
   const dk=side==='my'?'secondaryMyDeck':'secondaryOppDeck';
   if(Array.isArray(state[dk]))state[dk]=state[dk].filter(x=>x!==name);
 }
 const k=side==='my'?'secondaryMyCards':'secondaryOppCards';
 state[k]=[...active,name];
 event('SECONDARY_SELECTED',{side,unit:name,action:'Secondary selected',secondary:name,mode},fullBefore);
 save();render();
}

function openManualSecondarySelection(side){
  const pool=typeof secondaryMissionPool==='function'
    ? secondaryMissionPool(side)
    : (Array.isArray(state.secondaryMyDeck)&&side==='my'
      ? state.secondaryMyDeck
      : Array.isArray(state.secondaryOppDeck)&&side==='opp'
        ? state.secondaryOppDeck
        : []);
  const available=Array.isArray(pool)?pool:[];
  if(!available.length){
    alert('No secondary missions are available to select.');
    return;
  }
  const current=side==='my'
    ? (Array.isArray(state.secondaryMy)?state.secondaryMy:[])
    : (Array.isArray(state.secondaryOpp)?state.secondaryOpp:[]);
  const selectedNames=current.map(m=>typeof m==='string'?m:(m&&m.name)||'').filter(Boolean);
  const choices=available.map(m=>{
    const name=typeof m==='string'?m:(m&&m.name)||'';
    return `<label style="display:block;margin:5px 0">
      <input type="checkbox" value="${esc(name)}" ${selectedNames.includes(name)?'checked':''}>
      ${esc(name)}
    </label>`;
  }).join('');
  const holder=document.createElement('div');
  holder.innerHTML=`<div class="modal-backdrop" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center">
    <div class="card" style="max-width:520px;width:calc(100% - 24px);max-height:80vh;overflow:auto;padding:16px">
      <h3 style="margin-top:0">Select ${side==='my'?'My':'Opponent'} Secondary Missions</h3>
      <div id="manual-secondary-options">${choices}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn primary" type="button" id="manual-secondary-confirm">Confirm Selection</button>
        <button class="btn" type="button" id="manual-secondary-cancel">Cancel</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(holder);
  holder.querySelector('#manual-secondary-cancel').onclick=()=>holder.remove();
  holder.querySelector('#manual-secondary-confirm').onclick=()=>{
    const names=[...holder.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
    chooseSecondaryBatch(side,names);
    holder.remove();

function wargearGroups(u){
  const groups=WARGEAR_11E[u.id];
  if(groups) return groups;
  const standard=(u.weapons||[]).map(w=>w.name).filter(Boolean);
  return [{key:'standard',label:'Standard Wargear',type:'fixed',options:standard.length?standard:['Standard unit wargear'],help:'No alternate wargear choices are currently defined in the prototype catalogue for this unit.'}];
}
function ensureWargear(e,u){
  e.wargearSelections=e.wargearSelections&&typeof e.wargearSelections==='object'?e.wargearSelections:{};
  for(const g of wargearGroups(u)){
    if(g.type==='single' && !(g.key in e.wargearSelections)) e.wargearSelections[g.key]=g.options[0]||'';
    if(g.type==='multi' && !Array.isArray(e.wargearSelections[g.key])) e.wargearSelections[g.key]=[];
  }
}
function setWargear(side,id,key,value){
  const e=entry(side,id); if(!e) return;
  const u=get(e.unitId),g=wargearGroups(u).find(x=>x.key===key); if(!g) return;
  ensureWargear(e,u);
  if(g.type==='single') e.wargearSelections[key]=value;
  else if(g.type==='multi'){
    const arr=Array.isArray(e.wargearSelections[key])?e.wargearSelections[key].slice():[];
    e.wargearSelections[key]=arr.includes(value)?arr.filter(v=>v!==value):arr.concat(value);
  }
  save();render();
}

function wargearOptionPoints(u,g,opt){const byUnit=WARGEAR_COSTS_11E[u.id]||{},byGroup=byUnit[g.key]||{},n=Number(byGroup[opt]);if(Number.isFinite(n))return n;const p=Number(WARGEAR_PROFILES_11E[u.id]?.[opt]?.points);return Number.isFinite(p)?p:0;}

function wargearOptionStats(u,opt){const name=String(opt||'').trim();if(!name||name==='None')return '';const p=WARGEAR_PROFILES_11E[u.id]?.[name];if(p){const vals=[];if(p.rng)vals.push(['RNG',p.rng]);if(p.A!==undefined)vals.push(['A',p.A]);if(p.BS!==undefined)vals.push(['BS',p.BS]);if(p.WS!==undefined)vals.push(['WS',p.WS]);if(p.S!==undefined)vals.push(['S',p.S]);if(p.AP!==undefined)vals.push(['AP',p.AP]);if(p.D!==undefined)vals.push(['D',p.D]);return '<div class="wargear-stats">'+vals.map(([k,v])=>'<span><b>'+esc(k)+'</b> '+esc(v)+'</span>').join('')+(p.abilities?'<span><b>Abilities</b> '+esc(p.abilities)+'</span>':'')+'</div>';}const needle=name.toLowerCase(),weapons=Array.isArray(u.weapons)?u.weapons:[];let w=weapons.find(x=>String(x.name||'').trim().toLowerCase()===needle);if(!w)w=weapons.find(x=>{const n=String(x.name||'').trim().toLowerCase();return n&&(n.includes(needle)||needle.includes(n));});if(!w)return '<div class="wargear-stats"><span class="muted">Profile not yet loaded for this option</span></div>';const vals=[['A',w.A??'—'],['BS',w.BS??'—'],['WS',w.WS??'—'],['S',w.S??'—'],['AP',w.AP??'—'],['D',w.D??'—']];const abilities=Array.isArray(w.abilities)&&w.abilities.length?w.abilities.join(', '):'';return '<div class="wargear-stats">'+vals.map(([k,v])=>'<span><b>'+esc(k)+'</b> '+esc(v)+'</span>').join('')+(abilities?'<span><b>Abilities</b> '+esc(abilities)+'</span>':'')+'</div>';}
function selectedWargearCost(e,u){
  ensureWargear(e,u);
  let total=0;
  for(const g of wargearGroups(u)){
    if(g.type==='single'){
      const v=e.wargearSelections[g.key];
      if(v && v!=='None') total+=wargearOptionPoints(u,g,v);
    } else if(g.type==='multi'){
      const vals=e.wargearSelections[g.key]||[];
      for(const v of vals) if(v && v!=='None') total+=wargearOptionPoints(u,g,v);
    }
  }
  return total;
}
function selectedWargearDetails(e,u){
  ensureWargear(e,u);

    if(g.type==='fixed') continue;
    const vals=g.type==='multi'?(e.wargearSelections[g.key]||[]):[e.wargearSelections[g.key]];
    for(const v of vals) if(v && v!=='None') out.push({name:v,points:wargearOptionPoints(u,g,v)});

function entry(side,id){return state[side].find(e=>e.uid===id)}

function unitRules(u){let r={minModels:u.models,maxModels:u.models,step:1,maxUnits:3};if(u.name==='Hormagaunts')r={minModels:10,maxModels:20,step:10,maxUnits:6};if(u.name==='Intercessor Squad')r={minModels:5,maxModels:10,step:5,maxUnits:6};if(u.name==='Terminator Squad')r={minModels:5,maxModels:10,step:5,maxUnits:3};return r}
function issues(side){let out=[];let seen={};for(const e of state[side]){const u=get(e.unitId),r=unitRules(u);seen[e.unitId]=(seen[e.unitId]||0)+e.qty;if(e.models<r.minModels||e.models>r.maxModels||((e.models-r.minModels)%r.step))out.push(u.name+': invalid model count');if(e.qty>r.maxUnits)out.push(u.name+': too many units');if((u.weapons||[]).length&&!e.weapons.length)out.push(u.name+': no weapons selected');if(side==='my'&&u.faction!==state.faction)out.push(u.name+': faction mismatch')}for(const id in seen){const u=get(id);if(seen[id]>unitRules(u).maxUnits)out.push(u.name+': duplicate limit exceeded')}if(total(side)>state.limit)out.push('Points limit exceeded');return [...new Set(out)]}

function alphaLabel(n){let s='';n=Math.max(1,Number(n)||1);while(n>0){n--;s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)}return s;}
function unitDisplayName(side,e){const arr=Array.isArray(state[side])?state[side]:[],same=arr.filter(x=>x.unitId===e.unitId),u=get(e.unitId);if(same.length<=1)return u?.name||e.unitId;const idx=Math.max(0,same.findIndex(x=>x.uid===e.uid));return (u?.name||e.unitId)+' '+alphaLabel(idx+1);}
function rosterCreatedLabel(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function savedRosterDisplayName(x){const stamp=rosterCreatedLabel(x?.created);return (x?.name||'Unnamed Roster')+(stamp?' • '+stamp:'');}
function activeArmyDisplayName(side){const name=side==='my'?state.myName:state.oppName,id=side==='my'?state.activeRosterId:state.activeOpponentRosterId,list=(state.savedArmyLists||[]).find(x=>x.id===id);return savedRosterDisplayName({name,created:list?.created});}

function leaderAttachmentNamesForBodyguardFix(u){return leaderNamesForBodyguard(u)}
function unitListCategory(u){const k=(Array.isArray(u.keywords)?u.keywords:[]).map(x=>String(x).toUpperCase());if(k.includes('CHARACTER'))return 0;if(k.includes('INFANTRY'))return 1;if(k.includes('MONSTER')||k.includes('VEHICLE'))return 2;return 3}
function sortUnitList(arr){return arr.slice().sort((a,b)=>unitListCategory(a)-unitListCategory(b)||a.name.localeCompare(b.name));}
function unitListCategoryName(u){const c=unitListCategory(u);return c===0?'Characters':c===1?'Infantry':c===2?'Monsters / Vehicles':'Other'}
function selectedUnitIds(side){
 const key=side==='my'?'selectedUnitsMy':'selectedUnitsOpp';
 if(!Array.isArray(state[key]))state[key]=[];
 return state[key];
}
function selectedUnitAddQty(side,id){
 const key=side==='my'?'selectedUnitAddQtyMy':'selectedUnitAddQtyOpp';
 if(!state[key]||typeof state[key]!=='object'||Array.isArray(state[key]))state[key]={};
 const n=Math.max(1,Math.floor(Number(state[key][id])||1));
 state[key][id]=n;
 return n;
}
function setSelectedUnitAddQty(side,id,value){
 const key=side==='my'?'selectedUnitAddQtyMy':'selectedUnitAddQtyOpp';
 if(!state[key]||typeof state[key]!=='object'||Array.isArray(state[key]))state[key]={};
 const u=get(id),max=Math.max(1,Number(unitRules(u).maxUnits)||1);
 const n=Math.max(1,Math.min(max,Math.floor(Number(value)||1)));
 state[key][id]=n;
 save();render();
}
function toggleUnitSelection(side,id){
 const key=side==='my'?'selectedUnitsMy':'selectedUnitsOpp';
 const ids=selectedUnitIds(side).slice();
 const i=ids.indexOf(id);
 if(i>=0){
   ids.splice(i,1);
   const qtyKey=side==='my'?'selectedUnitAddQtyMy':'selectedUnitAddQtyOpp';
   if(state[qtyKey]&&typeof state[qtyKey]==='object')delete state[qtyKey][id];
 }else{
   ids.push(id);
   selectedUnitAddQty(side,id);
 }
 state[key]=ids;
 save();render();
}
function addSelectedUnits(side){
 const key=side==='my'?'selectedUnitsMy':'selectedUnitsOpp';
 const qtyKey=side==='my'?'selectedUnitAddQtyMy':'selectedUnitAddQtyOpp';
 const ids=selectedUnitIds(side).slice();
 if(!ids.length){alert('Select at least one unit first.');return;}
 let changed=false;
 ids.forEach(id=>{
   const u=get(id); if(!u)return;
   const requested=selectedUnitAddQty(side,id);
   const maxUnits=Math.max(1,Number(unitRules(u).maxUnits)||1);
   const current=(state[side]||[]).filter(e=>e.unitId===id).reduce((n,e)=>n+Math.max(0,Number(e.qty)||0),0);
   const room=Math.max(0,maxUnits-current);
   if(room<=0)return;
   const add=Math.min(requested,room);
   for(let i=0;i<add;i++){
     const e=makeEntry(u);
     e.qty=1;
     state[side].push(e);
     changed=true;
   }
   if(add<requested)alert(`${u.name}: only ${add} additional unit${add===1?' is':'s are'} allowed by the ${maxUnits}-unit limit.`);
 });
 state[key]=[];
 if(state[qtyKey]&&typeof state[qtyKey]==='object')state[qtyKey]={};
 save();
 render();
}
function renderUnitSections(arr,side){
 const groups=[['Characters',0],['Infantry',1],['Monsters / Vehicles',2],['Other',3]];
 const statKeys=[['M','M'],['T','T'],['Sv','Sv'],['W','W'],['Ld','Ld'],['OC','OC']];
 const weaponCell=(w,key)=>w[key]===undefined?'—':esc(w[key]);
 const selected=selectedUnitIds(side);
 const selectedCount=selected.length;
 const addButton=`<div class="unit-selection-toolbar"><button type="button" class="btn primary" onclick="addSelectedUnits('${side}')">Add Selected${selectedCount?` (${selectedCount})`:''}</button></div>
 <div class="unit-search-under-add"><input value="${esc(side==='my'?state.searchMy:state.searchOpp)}" placeholder="Search units" oninput="${side==='my'?'updateMyUnitSearch(this.value)':''}"></div>`;
 const sections=groups.map(([label,cat])=>{
  const items=sortUnitList(arr.filter(u=>unitListCategory(u)===cat));
  if(!items.length)return '';
  return `<div class="unit-category"><div class="unit-category-title">${label}</div>${
   items.map(u=>{
    const profile={...(u.profile||{})}; if(profile.M===undefined)profile.M=profile.Move??profile.Movement??u.M??u.Move??u.Movement;
    const weapons=Array.isArray(u.weapons)?u.weapons:[];
    const stats=statKeys.filter(([k])=>profile[k]!==undefined);
    const isSelected=selected.includes(u.id);
    return `<div class="unit ${isSelected?'unit-selected':''}" data-unit-id="${esc(u.id)}">
      <div class="unit-select-row" onclick="toggleUnitSelection('${side}','${esc(u.id)}')">
        <button type="button" class="unit-title-toggle" aria-expanded="false" onclick="event.stopPropagation();toggleUnitInfo(this)">
          <strong>${esc(u.name)}</strong>${isLeaderUnit(u)?'<span class="pill" style="margin-left:6px">Leader</span>':''}
        </button>
        ${isSelected?`<label class="unit-copy-control" onclick="event.stopPropagation()">Copies <input type="number" min="1" max="${Math.max(1,Number(unitRules(u).maxUnits)||1)}" value="${selectedUnitAddQty(side,u.id)}" onclick="event.stopPropagation()" onchange="setSelectedUnitAddQty('${side}','${esc(u.id)}',this.value);event.stopPropagation()"></label>`:''}
      </div>
      <div class="add-unit-details" hidden>
        <div class="muted" style="margin-bottom:6px">${esc(u.faction)} • ${u.points} pts • ${u.models} model${u.models===1?'':'s'}</div>
        <div class="muted small">Unit Stats</div>
        <div class="add-unit-stats">
          ${stats.length?stats.map(([k,label])=>`<div class="add-unit-stat"><b>${esc(profile[k])}</b><span>${label}</span></div>`).join(''):'<span class="muted small">No stat profile available</span>'}
        </div>
        ${weapons.length?`<div class="add-unit-weapons">
          ${(()=>{
            const ranged=weapons.filter(w=>w.BS!==undefined&&w.BS!==''&&w.BS!=='—');
            const melee=weapons.filter(w=>w.WS!==undefined&&w.WS!==''&&w.WS!=='—');
            const renderWeaponTable=(title,list)=>list.length?`<div class="muted small" style="margin:${title==='Ranged Weapons'?'0':'8px'} 0 4px">${title}</div>
              <table>
                <thead><tr><th>Weapon</th><th>A</th><th>WS</th><th>BS</th><th>S</th><th>AP</th><th>D</th><th>Abilities</th></tr></thead>
                <tbody>${list.map(w=>`<tr>
                  <td><b>${esc(w.name||'')}</b></td>
                  <td>${weaponCell(w,'A')}</td>
                  <td>${weaponCell(w,'WS')}</td>
                  <td>${weaponCell(w,'BS')}</td>
                  <td>${weaponCell(w,'S')}</td>
                  <td>${weaponCell(w,'AP')}</td>
                  <td>${weaponCell(w,'D')}</td>
                  <td>${Array.isArray(w.abilities)?esc(w.abilities.join(', ')):esc(w.abilities||'—')}</td>
                </tr>`).join('')}</tbody>
              </table>`:'';
            const other=weapons.filter(w=>!ranged.includes(w)&&!melee.includes(w));
            return renderWeaponTable('Ranged Weapons',ranged)+renderWeaponTable('Melee Weapons',melee)+renderWeaponTable('Other Weapons',other);
          })()}
        </div>`:''}
      </div>
    </div>`;
   }).join('')
  }</div>`;
 }).join('');
 return addButton+sections;
}

let gameTimerInterval=null;
function ensureGameTimer(){
  if(!state.gameTimer || typeof state.gameTimer!=='object'){
    state.gameTimer={elapsedMs:0,running:false,paused:false,startedAt:0,pausedAt:0,finishedAt:0,turnMyMs:0,turnOppMs:0,turnStartedGameMs:0,turnPaused:false};
  }
  return state.gameTimer;
}
function gameTimerElapsed(){
  const t=ensureGameTimer();
  if(!t.running)return Math.max(0,Number(t.elapsedMs)||0);
  return Math.max(0,(Number(t.elapsedMs)||0)+(Date.now()-(Number(t.startedAt)||Date.now())));
}

function turnElapsedMs(side){
  const t=ensureGameTimer();
  const key=side==='opp'?'turnOppMs':'turnMyMs';
  const saved=Math.max(0,Number(t[key])||0);
  if(t.turnPaused)return saved;
  if(state.currentTurn!==side)return saved;
  return saved+Math.max(0,gameTimerElapsed()-(Number(t.turnStartedGameMs)||0));
}
function finalizeCurrentTurnTime(){
  const t=ensureGameTimer();
  if(t.turnPaused)return;
  const side=state.currentTurn==='opp'?'opp':'my';
  const key=side==='opp'?'turnOppMs':'turnMyMs';
  const now=gameTimerElapsed();
  const delta=Math.max(0,now-(Number(t.turnStartedGameMs)||0));
  t[key]=Math.max(0,Number(t[key])||0)+delta;
  t.turnStartedGameMs=now;
}
function toggleTurnPause(){
  const t=ensureGameTimer();
  if(t.finishedAt)return;
  if(t.turnPaused){
    t.turnStartedGameMs=gameTimerElapsed();
    t.turnPaused=false;
  }else{
    finalizeCurrentTurnTime();
    t.turnPaused=true;
  }
  save();
  render();
}
function switchTurnClock(next){
  const t=ensureGameTimer();
  if(!t.turnPaused){
    finalizeCurrentTurnTime();
    t.turnStartedGameMs=gameTimerElapsed();
  }
  state.currentTurn=next==='opp'?'opp':'my';
}
function formatGameTime(ms){
  const total=Math.max(0,Math.floor(Number(ms)||0)/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=Math.floor(total%60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function updateGameTimerDisplay(){
  const el=document.getElementById('game-timer-value');
  if(el)el.textContent=formatGameTime(gameTimerElapsed());
  const turnEl=document.getElementById('turn-timer-value');
  if(turnEl)turnEl.textContent=formatGameTime(turnElapsedMs(state.currentTurn==='opp'?'opp':'my'));
  const myTurnEl=document.getElementById('my-turn-time-value');
  if(myTurnEl)myTurnEl.textContent=formatGameTime(turnElapsedMs('my'));
  const oppTurnEl=document.getElementById('opp-turn-time-value');
  if(oppTurnEl)oppTurnEl.textContent=formatGameTime(turnElapsedMs('opp'));
  const status=document.getElementById('game-timer-status');
  if(status){
    const t=ensureGameTimer();
    status.textContent=t.finishedAt?'Finished':(t.turnPaused?'Turn Paused':'Game Running');
  }
}
function ensureLiveGameTimerDisplay(){
  if(gameTimerInterval!==null)return;
  const t=ensureGameTimer();
  if(t.running && !t.finishedAt){
    gameTimerInterval=setInterval(updateGameTimerDisplay,100);
  }
}

function startGameTimer(){
  const t=ensureGameTimer();
  t.elapsedMs=0;
  t.startedAt=Date.now();
  t.pausedAt=0;
  t.finishedAt=0;
  t.running=true;
  t.paused=false;
  if(gameTimerInterval)clearInterval(gameTimerInterval);
  gameTimerInterval=setInterval(updateGameTimerDisplay,100);
  updateGameTimerDisplay();
}
function toggleGameTimer(){
  toggleTurnPause();
}
function finishGameTimer(){
  const t=ensureGameTimer();
  if(t.finishedAt)return;
  if(t.running){finalizeCurrentTurnTime();t.elapsedMs=gameTimerElapsed();}
  t.running=false;
  t.paused=false;
  t.finishedAt=Date.now();
  if(gameTimerInterval){clearInterval(gameTimerInterval);gameTimerInterval=null;}
  save();
  render();
}
function gameTimerHtml(){
  const t=ensureGameTimer();
  const label=t.finishedAt?'Finished':t.turnPaused?'Resume Turn':'Pause Turn';
  const action=t.finishedAt?'':`<button type="button" class="btn ${t.turnPaused?'primary':'danger'}" onclick="toggleGameTimer();return false;">${label}</button>`;
  return `<div class="game-timer" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:7px 9px;border:1px solid var(--border,#2d4055);border-radius:8px;background:var(--panel,#111c2b)">

    <span class="muted small">Current Turn: ${esc(state.currentTurn==='opp'?state.oppName:state.myName)} <strong id="turn-timer-value">${formatGameTime(turnElapsedMs(state.currentTurn==='opp'?'opp':'my'))}</strong></span>
    <span class="muted small">${esc(state.myName)}: <strong id="my-turn-time-value">${formatGameTime(turnElapsedMs('my'))}</strong></span>
    <span class="muted small">${esc(state.oppName)}: <strong id="opp-turn-time-value">${formatGameTime(turnElapsedMs('opp'))}</strong></span>
    ${action}
    <button type="button" class="btn" onclick="finishGameTimer();return false;" ${t.finishedAt?'disabled':''}>Finish</button>
  </div>`;
}

 if(p.attacks!=null)parts.push(`${p.attacks} atk`);
 if(p.hits!=null)parts.push(`${p.hits} hits`);

function engineContext(a,w,t,m){const abilities=(w.abilities||[]).map(x=>String(x).toUpperCase());const txt=abilities.join(' | ');const c={};c.lethal=abilities.some(x=>x.includes('LETHAL HITS'))||!!m.lethal;c.sustained=Number((txt.match(/SUSTAINED HITS\s*(D\d+|\d+)/)||[])[1]?.replace('D',''))||0;c.devastating=abilities.some(x=>x.includes('DEVASTATING WOUNDS'))||!!m.devastating;c.torrent=abilities.some(x=>x.includes('TORRENT'))||!!m.torrent;c.blast=Number((txt.match(/BLAST\s*(\d+)/)||[])[1])||0;c.rapidFire=Number((txt.match(/RAPID FIRE\s*(\d+)/)||[])[1])||0;c.heavy=abilities.some(x=>x.trim()==='HEAVY');c.twin=abilities.some(x=>x.includes('TWIN-LINKED'));c.melta=Number((txt.match(/MELTA\s*(\d+)/)||[])[1])||0;c.precision=abilities.some(x=>x.includes('PRECISION'));c.ignoreCover=abilities.some(x=>x.includes('IGNORES COVER'));c.anti=engineAntiForTarget(w,t,m);c.hitNeed=Math.max(2,Number(String(w.BS||w.WS||'4+').replace('+',''))||4)-(m.plusHit?1:0)+(m.minusHit?1:0);c.hitNeed=Math.max(2,Math.min(6,c.hitNeed));c.hitReroll=m.rerollHits?'all':m.rerollHit1?'ones':'none';let S=(Number(w.S)||4)+(m.plusStrength?1:0);let T=Number(t.profile.T)||4;c.woundNeed=targetNeed(S,T);if(m.plusWound)c.woundNeed=Math.max(2,c.woundNeed-1);if(c.anti)c.woundNeed=Math.min(c.woundNeed,c.anti);c.woundNeed=Math.max(2,Math.min(6,c.woundNeed));c.woundReroll=m.rerollWounds?'all':m.rerollWound1?'ones':c.twin?'all':'none';c.critHitThreshold=m.critHit5?5:m.critHit4?4:6;c.critWoundThreshold=m.critWound5?5:m.critWound4?4:6;return c}
function engineDistForNeed(need,critThreshold,reroll){let success=0,crit=0;for(let d=1;d<=6;d++){let p=1/6;if((reroll==='all')||(reroll==='ones'&&d===1)){for(let r=1;r<=6;r++){const q=1/36;if(r>=need)success+=q;if(r>=critThreshold)crit+=q}}else{if(d>=need)success+=p;if(d>=critThreshold)crit+=p}}return {success,crit}}

function engineSaveDistribution(t,w,c,m){let base=parseInt(t.profile.Sv)||4;let ap=Number(w.AP)||0;let armour=base-Math.min(0,ap);if(m.minusSave)armour--;if(m.cover&&!c.ignoreCover)armour=Math.max(2,armour-1);armour=Math.max(2,Math.min(7,armour));const inv=m.invuln4?4:m.invuln5?5:m.invuln6?6:(t.profile.Invuln||t.profile.invuln||null);const invN=inv?parseInt(inv):null;const need=invN?Math.min(armour,invN):armour;let fail=need>6?1:(need-1)/6; // unmodified 1 always fails

return {need,fail,inv:invN,armour}}
function engineApplyFnp(d,m){const f=engineFnp(m);if(!f)return d;let out=0;for(let i=0;i<Math.max(0,Math.floor(d));i++)if(1+Math.floor(Math.random()*6)<f)out++;return out+(d-Math.floor(d))}
function engineRollDistributionExact(need,reroll,crit){return engineDistForNeed(need,crit,reroll)}
function engineOneAttack(a,w,t,m,modelsRemaining,woundsState){const c=engineContext(a,w,t,m);let attacks=Math.max(0,Math.round(engineRoll(w.A)+(c.rapidFire&&m.halfRange?c.rapidFire:0)+(c.blast?c.blast*Math.floor(modelsRemaining/5):0)));let totalDamage=0,hits=0,wounds=0,saved=0,critHits=0,critWounds=0,rollLog=[];for(let ai=0;ai<attacks;ai++){let h=1+Math.floor(Math.random()*6),rerolled=false;if(c.hitReroll==='all'||(c.hitReroll==='ones'&&h===1)){h=1+Math.floor(Math.random()*6);rerolled=true}const hit=h>=c.hitNeed;if(!hit)continue;const crit=h>=c.critHitThreshold;if(crit)critHits++;if(crit&&c.lethal){wounds++;rollLog.push({hit:h,wound:'AUTO'});continue}hits++;const extra=crit?engineSustained(c,m):0;for(let x=0;x<1+extra;x++){let wr=1+Math.floor(Math.random()*6);if(c.woundReroll==='all'||(c.woundReroll==='ones'&&wr===1)){wr=1+Math.floor(Math.random()*6)}const wound=wr>=c.woundNeed;const critW=wr>=c.critWoundThreshold;if(!wound)continue;wounds++;if(critW)critWounds++;if(critW&&c.devastating){const d=engineApplyFnp(engineRoll(w.D)+(c.melta&&m.halfRange?c.melta:0),m);totalDamage+=d;continue}const save=engineSaveDistribution(t,w,c,m);let sr=1+Math.floor(Math.random()*6);if(m.rerollSave1&&sr===1)sr=1+Math.floor(Math.random()*6);const savedThis=sr!==1&&sr>=save.need;if(savedThis){saved++;continue}let d=engineRoll(w.D)+(c.melta&&m.halfRange?c.melta:0);if(m.minusDamage1)d=Math.max(0,d-1);d=engineApplyFnp(d,m);if(d>0){let remaining=Math.max(0,woundsState[0]||Number(t.profile.W)||1);const applied=Math.min(remaining,d);woundsState[0]=remaining-applied;if(woundsState[0]<=0){let idx=woundsState.findIndex((x,i)=>i>0&&x>0);if(idx>=0)woundsState[0]=woundsState[idx],woundsState[idx]=0}totalDamage+=applied}}
}
return {damage:totalDamage,hits,wounds,saved,critHits,critWounds,rollLog,remaining:woundsState}}
function engineMonteCarlo(a,w,t,m,samples){samples=Math.max(100,Math.min(20000,Number(samples)||2000));const defModels=Math.max(1,Number(m.defenderModels)||t.models||1);const hp=Math.max(1,Number(t.profile.W)||1);let totalDamage=0,totalKilled=0,wipes=0;for(let s=0;s<samples;s++){const woundsState=Array.from({length:defModels},()=>hp);let dmg=0;for(let model=0;model<Math.max(1,Number(m.attackerModels)||a.models||1);model++){const r=engineOneAttack(a,w,t,m,defModels,woundsState);dmg+=r.damage;if(woundsState.every(x=>x<=0))break}const killed=woundsState.filter(x=>x<=0).length;totalDamage+=dmg;totalKilled+=killed;if(killed>=defModels)wipes++}return {samples,avgDamage:totalDamage/samples,avgKilled:totalKilled/samples,wipeChance:wipes/samples}}
function simulateOne(a,w,t,m){const r=engineMonteCarlo(a,w,t,m,1);return {damage:r.avgDamage,killed:r.avgKilled,dead:r.wipeChance>=1}}
function runMathSimulation(){

  const ae=mathRosterEntry('my'), alloc=mathWeaponAlloc(ae,a); const groups=(a.weapons||[]).map(w=>({weapon:w,count:Number(alloc[w.name])||0})).filter(g=>g.count>0);
  const m={...(state.mathRules||{}),defenderModels:Math.max(1,Number(ae?mathRosterEntry('opp')?.models:state.mathRules?.defenderModels)||t.models||1)};
  const n=Math.max(100,Math.min(20000,Number(document.getElementById('simCount')?.value)||5000)); const r=engineMonteCarloMixed(a,t,groups,m,n); const el=document.getElementById('simResult');
  if(el)el.innerHTML=`<div class="grid3"><div class="result-card"><div class="result-label">Average Damage</div><div class="result-value">${r.avgDamage.toFixed(2)}</div></div><div class="result-card"><div class="result-label">Average Models Killed</div><div class="result-value">${r.avgKilled.toFixed(2)}</div></div><div class="result-card"><div class="result-label">Full Unit Destroyed</div><div class="result-value">${(r.wipeChance*100).toFixed(1)}%</div></div></div><div class="status">${n.toLocaleString()} complete mixed-loadout attack sequences • ${esc(a.name)} → ${esc(t.name)}</div>`;
}

function resolveAttack(){const fullBefore=snapshotForUndo();const a=get(state.attacker),t=get(state.target),w=(a.weapons||[]).find(x=>x.name===state.weapon)||a.weapons[0];if(!w)return;const m=state.mathRules||{};const woundsState=Array.from({length:Math.max(1,Number(t.models)||1)},()=>Number(t.profile.W)||1);const r=engineOneAttack(a,w,t,m,t.models||1,woundsState);const te=state.opp.find(e=>e.unitId===t.id)||state.my.find(e=>e.unitId===t.id);if(te){if(!te.game)te.game={models:te.models,wounds:te.models*t.wounds,status:'Alive'};const before=JSON.parse(JSON.stringify(te.game));te.game.wounds=Math.max(0,te.game.wounds-r.damage);te.game.models=Math.max(0,woundsState.filter(x=>x>0).length);te.game.status=te.game.wounds<=0?'Destroyed':te.game.wounds<te.models*t.wounds?'Damaged':'Alive';event('ATTACK_RESOLUTION',{attacker:a.name,weapon:w.name,target:t.name,unit:a.name,action:'Attack with '+w.name+' → '+t.name,attacks:Math.round(engineExpectedDice(w.A)),hits:r.hits,wounds:r.wounds,saved:r.saved,damage:r.damage,critHits:r.critHits,critW:r.critWounds,before,after:te.game,rollLog:r.rollLog},fullBefore)}else event('ATTACK_RESOLUTION',{attacker:a.name,weapon:w.name,target:t.name,unit:a.name,action:'Attack with '+w.name+' → '+t.name,hits:r.hits,wounds:r.wounds,saved:r.saved,damage:r.damage,critHits:r.critHits,critW:r.critWounds,rollLog:r.rollLog},fullBefore);state.page='battle';save();render()}

const CLOUD_CONFIG_KEY='onoforge-supabase-config-v1';
const SUPABASE_SCRIPT_URL='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
let supabaseClient=null;
let supabaseAuthListenerBound=false;
let supabaseLoadPromise=null;

function getCloudConfig(){
  try{
    const raw=localStorage.getItem(CLOUD_CONFIG_KEY);
    const x=raw?JSON.parse(raw):null;
    if(x?.url&&x?.key)return {url:String(x.url).trim(),key:String(x.key).trim()};
  }catch(_){}
  return {url:'',key:''};
}
function cloudConfigReady(){
  const c=getCloudConfig();
  return !!(c.url&&c.key);
}
function cloudStatusClass(){
  if(state.cloud?.status==='Connected')return 'ok';
  if(state.cloud?.status==='Error')return 'err';
  if(state.cloud?.status==='Connecting' || state.cloud?.status==='Syncing')return 'warn';
  return '';
}
function cloudStatusText(){
  if(state.cloud?.status==='Connected'&&state.cloud?.email)return `Connected as ${esc(state.cloud.email)}`;
  return esc(state.cloud?.status||'Not connected');
}
function cloudMark(status,error=''){
  if(!state.cloud)state.cloud={email:'',userId:'',status:'Not connected',lastSync:'',error:''};
  state.cloud.status=status;
  state.cloud.error=error||'';
  save();
}
function loadSupabaseLibrary(){
  if(window.supabase?.createClient)return Promise.resolve(true);
  if(supabaseLoadPromise)return supabaseLoadPromise;
  supabaseLoadPromise=new Promise(resolve=>{
    const s=document.createElement('script');
    s.src=SUPABASE_SCRIPT_URL;
    s.async=true;
    s.onload=()=>resolve(!!window.supabase?.createClient);
    s.onerror=()=>resolve(false);
    document.head.appendChild(s);
  });
  return supabaseLoadPromise;
}
async function ensureSupabaseClient(){
  const cfg=getCloudConfig();
  if(!cfg.url||!cfg.key)throw new Error('Enter your Supabase Project URL and Publishable key first.');
  const loaded=await loadSupabaseLibrary();
  if(!loaded)throw new Error('Supabase library could not be loaded. Check your internet connection.');
  if(!supabaseClient){
    supabaseClient=window.supabase.createClient(cfg.url,cfg.key);
    if(!supabaseAuthListenerBound){
      supabaseAuthListenerBound=true;
      supabaseClient.auth.onAuthStateChange((event,session)=>{
        const u=session?.user||null;
        state.cloudPasswordRecovery=event==='PASSWORD_RECOVERY';
        state.cloud=state.cloud||{};
        state.cloud.email=u?.email||'';
        state.cloud.userId=u?.id||'';
        state.cloud.status=u?'Connected':'Not signed in';
        state.cloud.error='';
        save();
        render();
        if(u)setTimeout(()=>{cloudSyncSavedLists().catch(()=>{});cloudRefreshBattles().catch(()=>{});},0);
      });
    }
  }
  return supabaseClient;
}
async function connectCloudFromInputs(){
  const url=(document.getElementById('cloud-project-url')?.value||'').trim().replace(/\/+$/,'');
  const key=(document.getElementById('cloud-publishable-key')?.value||'').trim();
  if(!url||!key){alert('Enter both your Supabase Project URL and Publishable key.');return}
  if(!/^https:\/\/[A-Za-z0-9.-]+\.supabase\.co$/.test(url)){alert('The Project URL should look like https://your-project.supabase.co');return}
  if(!key.startsWith('sb_publishable_')){alert('Use the Supabase Publishable key (sb_publishable_...). Do not use an sb_secret_ key.');return}
  localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url,key}));
  state.cloud=state.cloud||{};
  state.cloud.status='Connecting';state.cloud.error='';
  save();render();
  try{
    const client=await ensureSupabaseClient();
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    const u=data?.session?.user||null;
    state.cloud.email=u?.email||'';state.cloud.userId=u?.id||'';state.cloud.status=u?'Connected':'Ready — sign in below';state.cloud.error='';
    save();render();
    if(u){await ensureCloudProfile(u);await cloudSyncSavedLists();await cloudRefreshBattles();}
  }catch(e){
    state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render();
  }
}
async function initCloudOnLoad(){
  if(!cloudConfigReady())return;
  try{
    await ensureSupabaseClient();
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    const u=data?.session?.user||null;
    state.cloud.email=u?.email||'';state.cloud.userId=u?.id||'';state.cloud.status=u?'Connected':'Ready — sign in below';state.cloud.error='';
    save();render();
    if(u){await ensureCloudProfile(u);await cloudSyncSavedLists();await cloudRefreshBattles();}
  }catch(e){
    state.cloud=state.cloud||{};
    state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render();
  }
}
async function cloudSignUp(){
  const email=(document.getElementById('cloud-email')?.value||'').trim();
  const password=document.getElementById('cloud-password')?.value||'';
  if(!email||!password){alert('Enter an email address and password.');return}
  if(password.length<8){alert('Password must be at least 8 characters.');return}
  try{
    const client=await ensureSupabaseClient();
    state.cloud.status='Connecting';state.cloud.error='';save();render();
    const redirectTo=`${location.origin}${location.pathname}`;
    const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:redirectTo}});
    if(error)throw error;
    if(data?.session){
      alert('Account created and signed in.');
    }else{
      alert('Account created. Check your email and click the confirmation link to finish signing in.');
    }
  }catch(e){state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render()}
}
async function cloudForgotPassword(){
  const email=(document.getElementById('cloud-email')?.value||'').trim();
  if(!email){alert('Enter your Cloud Sync email address first.');return}
  try{
    const client=await ensureSupabaseClient();
    state.cloud.status='Connecting';state.cloud.error='';save();render();
    const redirectTo=location.href.split('#')[0];
    const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    state.cloud.status='Ready — check your email';state.cloud.error='';
    save();render();
    alert('Password reset email sent. Check your email and open the reset link.');
  }catch(e){
    state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render();
  }
}
async function cloudUpdatePassword(){
  const password=document.getElementById('cloud-new-password')?.value||'';
  const confirmPassword=document.getElementById('cloud-confirm-password')?.value||'';
  if(!password||!confirmPassword){alert('Enter and confirm your new password.');return}
  if(password.length<8){alert('Password must be at least 8 characters.');return}
  if(password!==confirmPassword){alert('The passwords do not match.');return}
  try{
    const client=await ensureSupabaseClient();
    state.cloud.status='Connecting';state.cloud.error='';save();render();
    const {data,error}=await client.auth.updateUser({password});
    if(error)throw error;
    const u=data?.user;
    state.cloudPasswordRecovery=false;
    state.cloud.email=u?.email||state.cloud.email||'';
    state.cloud.userId=u?.id||state.cloud.userId||'';
    state.cloud.status='Connected';state.cloud.error='';
    save();render();
    alert('Password updated. Cloud Sync is ready to use.');
    await cloudSyncSavedLists();await cloudRefreshBattles();
  }catch(e){
    state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render();
  }
}
async function cloudSignIn(){
  const email=(document.getElementById('cloud-email')?.value||'').trim();
  const password=document.getElementById('cloud-password')?.value||'';
  if(!email||!password){alert('Enter your email and password.');return}
  try{
    const client=await ensureSupabaseClient();
    state.cloud.status='Connecting';state.cloud.error='';save();render();
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error)throw error;
    const u=data?.user||data?.session?.user;
    state.cloud.email=u?.email||email;state.cloud.userId=u?.id||'';state.cloud.status='Connected';state.cloud.error='';
    await ensureCloudProfile(u);
    save();render();
    await cloudSyncSavedLists();await cloudRefreshBattles();
  }catch(e){state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render()}
}
async function cloudSignOut(){
  try{
    if(supabaseClient)await supabaseClient.auth.signOut();
  }catch(e){console.warn('Supabase sign out failed',e)}
  state.cloudPasswordRecovery=false;
  state.cloud={email:'',userId:'',status:'Not signed in',lastSync:state.cloud?.lastSync||'',error:''};
  state.cloudBattles=[];
  save();render();
}
function clearCloudConfiguration(){
  if(!confirm('Remove the saved Supabase connection settings from this browser? Your Supabase account and cloud data will not be deleted.'))return;
  localStorage.removeItem(CLOUD_CONFIG_KEY);
  supabaseClient=null;
  supabaseAuthListenerBound=false;
  state.cloud={email:'',userId:'',status:'Not connected',lastSync:'',error:''};
  state.cloudBattles=[];
  save();render();
}
async function ensureCloudProfile(user){
  if(!user||!supabaseClient)return;
  try{
    await supabaseClient.from('profiles').upsert({id:user.id,display_name:user.email?.split('@')[0]||''},{onConflict:'id'});
  }catch(_){}
}
function cloudArmyPayload(list,userId){
  const copy=JSON.parse(JSON.stringify(list));
  return {user_id:userId,name:copy.name||'Army List',faction:copy.faction||'',detachment:copy.detachment||'',army_data:copy,created_at:copy.created||new Date().toISOString(),updated_at:new Date().toISOString()};
}
async function cloudUpsertArmyList(list){
  if(!list||!state.cloud?.userId)return false;
  try{
    const client=await ensureSupabaseClient();
    const payload=cloudArmyPayload(list,state.cloud.userId);
    if(list.cloudId){
      const {error}=await client.from('saved_army_lists').update(payload).eq('id',list.cloudId).eq('user_id',state.cloud.userId);
      if(error)throw error;
    }else{
      const {data,error}=await client.from('saved_army_lists').insert(payload).select('id').single();
      if(error)throw error;
      if(data?.id)list.cloudId=data.id;
    }
    list.updated=new Date().toISOString();
    save();
    state.cloud.lastSync=new Date().toISOString();
    state.cloud.status='Connected';state.cloud.error='';
    save();
    return true;
  }catch(e){
    state.cloud.error=e.message||String(e);state.cloud.status='Error';save();return false;
  }
}
async function cloudDeleteArmyList(list){
  if(!list?.cloudId||!state.cloud?.userId||!supabaseClient)return false;
  try{
    const client=await ensureSupabaseClient();
    const {error}=await client.from('saved_army_lists').delete().eq('id',list.cloudId).eq('user_id',state.cloud.userId);
    if(error)throw error;
    return true;
  }catch(e){state.cloud.error=e.message||String(e);save();return false}
}
async function cloudSyncSavedLists(){
  if(!state.cloud?.userId)return;
  try{
    const client=await ensureSupabaseClient();
    const {data:remote,error}=await client.from('saved_army_lists').select('id,name,faction,detachment,army_data,created_at,updated_at').order('updated_at',{ascending:false});
    if(error)throw error;
    const remoteByLocalId=new Map();
    (remote||[]).forEach(r=>{const localId=r.army_data?.id||r.army_data?.localId;if(localId)remoteByLocalId.set(localId,r)});
    for(const list of (state.savedArmyLists||[])){
      let remoteRow=list.cloudId?(remote||[]).find(r=>r.id===list.cloudId):remoteByLocalId.get(list.id);
      const payload=cloudArmyPayload(list,state.cloud.userId);
      if(remoteRow){
        const {error:e}=await client.from('saved_army_lists').update(payload).eq('id',remoteRow.id).eq('user_id',state.cloud.userId);
        if(e)throw e;
        list.cloudId=remoteRow.id;
      }else{
        const {data:d,error:e}=await client.from('saved_army_lists').insert(payload).select('id').single();
        if(e)throw e;
        list.cloudId=d?.id||'';
      }
      list.updated=new Date().toISOString();
    }
    const {data:latest,error:e2}=await client.from('saved_army_lists').select('id,name,faction,detachment,army_data,created_at,updated_at').order('updated_at',{ascending:false});
    if(e2)throw e2;
    const locals=Array.isArray(state.savedArmyLists)?state.savedArmyLists:[];
    (latest||[]).forEach(r=>{
      const d=(r.army_data&&typeof r.army_data==='object')?JSON.parse(JSON.stringify(r.army_data)):{};
      const localId=d.id||d.localId||uid();
      const existing=locals.find(x=>x.cloudId===r.id||x.id===localId);
      const merged={...d,id:existing?.id||localId,cloudId:r.id,name:r.name||d.name||'Army List',faction:r.faction||d.faction||'',detachment:r.detachment||d.detachment||'',units:Array.isArray(d.units)?d.units:[],created:d.created||r.created_at,updated:r.updated||r.updated_at};
      if(existing)Object.assign(existing,merged);else locals.push(merged);
    });
    state.savedArmyLists=locals;
    state.cloud.lastSync=new Date().toISOString();state.cloud.status='Connected';state.cloud.error='';
    save();render();

    state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render();

}
async function cloudSaveCurrentBattle(opts={}){
  if(!state.cloud?.userId){alert('Sign in to Supabase first.');return}
  if(state.cloudBattleSaving)return;
  state.cloudBattleSaving=true; state.cloudBattleSaveError='';
  save();render();
  try{
    const client=await ensureSupabaseClient();
    const snapshot=JSON.parse(JSON.stringify(state));
    delete snapshot.cloudBattles;delete snapshot._undoSnapshot;delete snapshot.cloudBattleSaving;delete snapshot.cloudBattleSaveError;
    const name=`${state.myName||'My Army'} vs ${state.oppName||'Opponent'} • Round ${state.round||1}`;
    let data=null;
    if(state.cloudBattleId){
      const result=await client.from('battle_records').update({name,battle_data:snapshot,updated_at:new Date().toISOString()}).eq('id',state.cloudBattleId).eq('user_id',state.cloud.userId).select('id,name,created_at,updated_at').single();
      if(result.error)throw result.error;
      data=result.data;
    }else{
      const result=await client.from('battle_records').insert({user_id:state.cloud.userId,name,battle_data:snapshot}).select('id,name,created_at,updated_at').single();
      if(result.error)throw result.error;
      data=result.data; state.cloudBattleId=data?.id||'';
    }
    state.cloudBattleSavedAt=data?.updated_at||new Date().toISOString();
    state.cloudBattleSaving=false; state.cloud.status='Connected'; state.cloud.error='';
    save(); await cloudRefreshBattles(); render();
    if(!opts.silent)alert('Battle saved to Supabase.');
    return data;
  }catch(e){
    state.cloudBattleSaving=false; state.cloudBattleSaveError=e.message||String(e);
    state.cloud.status='Error'; state.cloud.error=e.message||String(e);
    save();render();
    if(!opts.silent)alert('Battle save failed: '+(e.message||e));
  }
}
async function cloudRefreshBattles(){

    const client=await ensureSupabaseClient();

async function cloudLoadBattle(id){
  if(!id||!state.cloud?.userId)return;

    const client=await ensureSupabaseClient();
    const {data,error}=await client.from('battle_records').select('battle_data').eq('id',id).eq('user_id',state.cloud.userId).single();
    if(error)throw error;
    if(!data?.battle_data)throw new Error('Cloud battle data is empty.');
    const cloudData=data.battle_data;
    state={...state,...cloudData};
    state.cloud=state.cloud||{email:'',userId:'',status:'Connected',lastSync:'',error:''};
    state.cloud.userId=state.cloud.userId||'';
    state.cloudBattleId=id;
    state.cloudBattleSavedAt=new Date().toISOString();
    state.cloudBattleSaving=false;
    state.cloudBattleSaveError='';
    ensureGameTimer();save();render();

function exportAllData(){
  try{
    const backup={schema:'onoforge40k.backup.v272',app:'OnoForge 40K',version:'v272',exportedAt:new Date().toISOString(),state:JSON.parse(JSON.stringify(state)),DEMO:JSON.parse(JSON.stringify(DEMO))};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='onoforge40k-backup-v272-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){alert('Export failed: '+e.message)}
}
function importAllData(inp){
  const f=inp.files?.[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const raw=JSON.parse(rd.result);
      if(!raw||typeof raw!=='object'||!raw.state||!Array.isArray(raw.DEMO))throw new Error('This is not a valid OnoForge backup file.');
      if(!confirm('Import this backup? Your current local OnoForge data will be replaced.')){inp.value='';return}
      state={...state,...raw.state};
      DEMO.splice(0,DEMO.length,...raw.DEMO);
      state.my=Array.isArray(state.my)?state.my:[];state.opp=Array.isArray(state.opp)?state.opp:[];state.savedArmyLists=Array.isArray(state.savedArmyLists)?state.savedArmyLists:[];state.events=Array.isArray(state.events)?state.events:[];state.rulesLog=Array.isArray(state.rulesLog)?state.rulesLog:[];state.detachmentSelections=Array.isArray(state.detachmentSelections)?state.detachmentSelections:[];state.oppDetachmentSelections=Array.isArray(state.oppDetachmentSelections)?state.oppDetachmentSelections:[];
      ensureGameTimer();
      save();
      alert('OnoForge data imported successfully.');
      render();
    }catch(e){alert('Import failed: '+e.message)}finally{inp.value=''}
  };
  rd.readAsText(f);
}
function clearAllLocalData(){
  if(!confirm('Clear ALL OnoForge data saved in this browser? This cannot be undone unless you have an exported backup.'))return;
  try{
    localStorage.removeItem(STORAGE_KEY);

  }catch(e){alert('Could not clear local data: '+e.message);return}
  location.reload();
}

function resetAllSecondaryMissions(side){
  const before=snapshotForUndo();
  const key=side==='opp'?'secondaryOpp':'secondaryMy';
  const missions=Array.isArray(state[key])?state[key]:[];
  missions.forEach(m=>{
    if(m && typeof m==='object'){
      m.completed=false;
      m.scored=false;
      delete m.completedRound;
      delete m.scoredRound;
      delete m.roundCompleted;
    }
  });
  if(side==='my') state.secondaryMyVP=0;
  else state.secondaryOppVP=0;
  event('SECONDARY_RESET_ALL',{
    side,
    unit:side==='my'?'Secondary Missions':'Opponent Secondary Missions',
    action:'Reset all secondary missions'
  },before);
  save();
  render();
}
