function collectBSDataObjects(root){
  const map=new Map(), seen=new Set();
  function walk(x){
    if(!x||typeof x!=='object'||seen.has(x))return;
    seen.add(x);
    if(typeof x.id==='string')map.set(x.id,x);
    Object.keys(x).forEach(k=>walk(x[k]));
  }
  walk(root);
  return map;
}

    out[k]=c.$text??'';
  });
  return out;
}

function bsAbilities(entry){
  const out=[],seen=new Set();
  function walk(x){
    if(!x||typeof x!=='object')return;
    if(Array.isArray(x.profiles)){
      x.profiles.forEach(p=>{
        if(String(p.typeName||'').toLowerCase()!=='abilities')return;
        const description=(p.characteristics||[]).find(c=>c.name==='Description')?.$text||'';
        if(!p.name||!description||seen.has(p.name))return;
        seen.add(p.name);
        out.push({name:p.name,description});
      });
    }
    if(Array.isArray(x.selectionEntries))x.selectionEntries.forEach(walk);
    if(Array.isArray(x.selectionEntryGroups))x.selectionEntryGroups.forEach(walk);
    if(Array.isArray(x.entryLinks)){
      x.entryLinks.forEach(link=>{
        const targetId=link.targetId||link.id;
        if(window.__BS_OBJECT_MAP&&targetId){
          const target=window.__BS_OBJECT_MAP.get(targetId);
          if(target)walk(target);
        }
      });
    }
  }
  walk(entry);
  return out;
}
function normalize11eWeaponAbilities(raw){
  const src=Array.isArray(raw)?raw:[];
  const out=[];
  src.forEach(value=>{
    const text=String(value??'').trim();
    if(!text)return;
    // 11th edition renamed the former PISTOL weapon keyword to CLOSE-QUARTERS.
    // Normalize legacy source labels at ingestion so stale supplemental data
    // cannot silently reintroduce 10th-edition terminology into the engine.
    const normalized=text.toUpperCase().replace(/-/g,' ').replace(/_/g,' ').replace(/\\s+/g,' ').trim();
    if(normalized==='PISTOL') out.push('CLOSE QUARTERS');
    else out.push(text);
  });
  return [...new Set(out)];
}

function bsWeapons(entry){
  const out=[], seen=new Set(), visited=new Set();
  const objectMap=(typeof window!=='undefined' && window.__BS_OBJECT_MAP && typeof window.__BS_OBJECT_MAP.get==='function')?window.__BS_OBJECT_MAP:null;
  function walk(x){
    if(!x||typeof x!=='object')return;
    const objectId=x.id||x.targetId;
    if(objectId){
      if(visited.has(objectId))return;
      visited.add(objectId);
    }
    if(Array.isArray(x.profiles)){
      x.profiles.forEach(p=>{
        const type=String(p.typeName||'').toLowerCase();
        if(type!=='ranged weapons' && type!=='melee weapons' && !type.includes('ranged weapon') && !type.includes('melee weapon'))return;
        const chars=bsCharacteristics(p);
        const w={name:p.name,...chars,abilities:normalize11eWeaponAbilities(chars.Keywords?[chars.Keywords]:[])};
        delete w.Keywords;
        const key=JSON.stringify(w);
        if(!seen.has(key)){seen.add(key);out.push(w);}
      });
    }
    if(Array.isArray(x.selectionEntries))x.selectionEntries.forEach(walk);
    if(Array.isArray(x.selectionEntryGroups))x.selectionEntryGroups.forEach(walk);
    if(Array.isArray(x.entryLinks)){
      x.entryLinks.forEach(link=>{
        const targetId=link.targetId||link.id;
        if(objectMap && targetId){
          const target=objectMap.get(targetId);
          if(target)walk(target);
        }
      });
    }
  }
  walk(entry);
  return out;
}
function bsWargearOptions(entry){
  const out=[],seen=new Set();
  function walk(x){
    if(!x||typeof x!=='object')return;
    if(Array.isArray(x.selectionEntries))x.selectionEntries.forEach(s=>{
      if(s.type==='upgrade' && s.name && !seen.has(s.name)){
        seen.add(s.name);out.push(s.name);
      }
      walk(s);
    });
    if(Array.isArray(x.selectionEntryGroups))x.selectionEntryGroups.forEach(walk);
  }
  walk(entry);
  return out;
}

function bsUnitFromEntry(entry,faction){
  if(!entry||entry.type!=='unit')return null;
  const p=bsProfile(entry,'Unit');
  if(!p)return null;
  const stats=bsCharacteristics(p);
  const pts=(entry.costs||[]).find(c=>c.name==='pts');
  const categories=(entry.categoryLinks||[]).map(c=>c.name).filter(Boolean);
  const weapons=bsWeapons(entry);
  return {
    id:`${faction}_${String(entry.name).toLowerCase().replace(/[^a-z0-9]+/g,'_')}`,
    name:entry.name,
    faction,
    points:pts?Number(pts.value):0,
    models:1,
    wounds:Number(stats.W)||1,
    profile:stats,
    keywords:categories,
    abilities:bsAbilities(entry),
    weapons,
    weaponOptions:bsWargearOptions(entry),
    dataSource:'BSData 11e',
    dataVersion:'current'
  };
}

async function refreshCurrentUnitDatabase(showMessage=true){
  try{
    const all=[];
    for(const faction of Object.keys(CURRENT_11E_DATA_SOURCES)){
      const res=await fetch(CURRENT_11E_DATA_SOURCES[faction],{cache:'no-store'});
      if(!res.ok)throw new Error(`${faction} data request failed (${res.status})`);
      const root=await res.json();
      const map=collectBSDataObjects(root);
      window.__BS_OBJECT_MAP=map;
      const links=root?.catalogue?.entryLinks||[];
      const seen=new Set();
      links.forEach(link=>{
        const entry=map.get(link.targetId||link.id);
        const u=bsUnitFromEntry(entry,faction);
        if(u&&!seen.has(u.name)){seen.add(u.name);all.push(u);}
      });
      // Only catalogue-linked unit entries are eligible for supplemental import.
      // Direct model entries include weapon/model variants and must not become units.
    }

    if(!all.length)throw new Error('No unit data was found.');
    const currentByName=new Map(all.map(u=>[`${u.faction}|${u.name}`,u]));

    // 40k.app is the canonical unit source for OnoForge. BSData is supplemental:
    // use it only to fill units absent from the audited canonical catalogue.
    // Do not overwrite canonical points, profiles, compositions, or wargear with
    // a secondary source that can lag the current 40k.app revision.
    const merged=(typeof EXPANDED_CATALOGUE!=='undefined'
      ? EXPANDED_CATALOGUE.map(old=>({...old}))
      : []);
    all.forEach(fresh=>{
      if(!merged.some(u=>u.faction===fresh.faction&&u.name===fresh.name)){
        merged.push(fresh);
      }
    });
    window.CURRENT_UNIT_DATABASE=merged;
    DEMO.splice(0,DEMO.length,...merged);
    state.dataUpdatedAt=new Date().toISOString();
    save();
    render();
    if(showMessage)alert(`Updated ${all.length} units from current 11th-edition data.`);
  }catch(err){
    console.error(err);
    if(showMessage)alert('Unit database update failed: '+(err.message||err));
  }
}

function scorePrimary(side,vpInput){
  let vp=Math.floor(Number(vpInput)||0);
  if(vp<1)return;
  const key=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
  const before=Number(state[key])||0;
  const roundTotal=primaryRoundScoredVP(side);
  const allowed=Math.min(vp,Math.max(0,15-roundTotal),Math.max(0,45-before));
  if(allowed<=0){alert(roundTotal>=15?'Primary scoring is capped at 15 VP for this round.':'Primary Missions are capped at 45 VP for the game.');return;}
  const after=Math.min(45,before+allowed);
  const actual=after-before;
  if(actual<=0)return;
  const fullBefore=snapshotForUndo();
  state[key]=after;
  if(side==='my')state.myVP=scoreTotalForSide('my');
  else state.oppVP=scoreTotalForSide('opp');
  event('PRIMARY_SCORED',{
    side,
    unit:side==='my'?'Primary Mission':'Opponent Primary Mission',
    action:'Primary scored +'+actual+' VP',
    before,after,delta:actual,
    mission:primaryMission(side)
  },fullBefore);
  save();render();
}
function resetPrimary(side){
  const key=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
  const actual=Number(state[key])||0;
  if(actual<=0)return;

  state[key]=0;
  const byRoundKey=side==='my'?'primaryScoringByRoundMy':'primaryScoringByRoundOpp';
  const amountKey=side==='my'?'primaryScoringAmountsByRoundMy':'primaryScoringAmountsByRoundOpp';
  const valueKey=side==='my'?'primaryScoringValuesByRoundMy':'primaryScoringValuesByRoundOpp';
  state[byRoundKey]={};

  state[side==='my'?'primaryScoredItemsMy':'primaryScoredItemsOpp']=[];
  if(side==='my')state.myVP=scoreTotalForSide('my');
  else state.oppVP=scoreTotalForSide('opp');

    side,
    unit:side==='my'?'Primary Mission':'Opponent Primary Mission',
    action:'Primary score reset -'+actual+' VP',

}

function primaryScoringRoundRange(timing){
  const text=String(timing||'').toUpperCase();
  const m=text.match(/R(\\d+)\\s*[–—-]\\s*(\\d+)/);
  if(m)return {min:Number(m[1]),max:Number(m[2])};
  const plus=text.match(/R(\\d+)\\s*\\+/);
  if(plus)return {min:Number(plus[1]),max:5};
  const single=text.match(/R(\\d+)\\b/);
  if(single)return {min:Number(single[1]),max:Number(single[1])};
  return {min:1,max:5};
}
function primaryScoringRowAvailable(timing,round){
  const range=primaryScoringRoundRange(timing);
  return round>=range.min&&round<=range.max;
}

function primaryRoundCapRemaining(side){return Math.max(0,15-primaryRoundScoredVP(side));}
function missionDecisionContext(){
  ensureScoreLedger();

  const round=Math.max(1,Number(state.round)||1);
  const primaryMy=Math.max(0,Math.min(45,Number(state.primaryMyScoredVP)||0));
  const primaryOpp=Math.max(0,Math.min(45,Number(state.primaryOppScoredVP)||0));

  const myRoundPrimary=primaryRoundScoredVP('my'),oppRoundPrimary=primaryRoundScoredVP('opp');
  const myRoundSecondary=secondaryRoundScoredVP('my',round),oppRoundSecondary=secondaryRoundScoredVP('opp',round);
  const objectiveSummary=objectiveStateSummary();
  const myObjectives=objectiveSummary.current.filter(o=>o.owner==='my').length;
  const oppObjectives=objectiveSummary.current.filter(o=>o.owner==='opp').length;
  return {
    round,turn:state.currentTurn||'my',score:{my,opp,gap:my-opp},
    primary:{my:primaryMy,opp:primaryOpp,myRemaining:45-primaryMy,oppRemaining:45-primaryOpp,myRound:myRoundPrimary,oppRound:oppRoundPrimary,myRoundRemaining:Math.max(0,15-myRoundPrimary),oppRoundRemaining:Math.max(0,15-oppRoundPrimary)},

    objectives:{my:myObjectives,opp:oppObjectives,summary:objectiveSummary.current}
  };
}
function scorePrimaryItem(side,index,mission,amountOverride){
  syncPrimaryScoringRound();
  const round=Math.max(1,Number(state.round)||1);
  const roundKey=String(round);
  const listKey=side==='my'?'primaryScoredItemsMy':'primaryScoredItemsOpp';
  const byRoundKey=side==='my'?'primaryScoringByRoundMy':'primaryScoringByRoundOpp';
  const amountKey=side==='my'?'primaryScoringAmountsByRoundMy':'primaryScoringAmountsByRoundOpp';
  const valueKey=side==='my'?'primaryScoringValuesByRoundMy':'primaryScoringValuesByRoundOpp';
  const vpKey=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
  const overallKey=side==='my'?'myVP':'oppVP';
  const rows=primaryScoringRowsForRound(mission);
  const row=rows[index];
  if(!row)return;
  const scored=Array.isArray(state[byRoundKey][roundKey])?state[byRoundKey][roundKey].slice():[];
  const values=state[valueKey][roundKey]||{};
  const amounts=state[amountKey][roundKey]||{};
  const wasScored=scored.includes(index);
  const fullBefore=snapshotForUndo();

  if(wasScored){
    const actual=Math.max(0,Number(values[index])||0);
    const before=Number(state[vpKey])||0;
    const after=Math.max(0,before-actual);
    const delta=after-before;
    state[vpKey]=after;
    state[overallKey]=scoreTotalForSide(side);
    state[byRoundKey][roundKey]=scored.filter(i=>i!==index);
    delete values[index];
    delete amounts[index];
    state[listKey]=state[byRoundKey][roundKey];
    event('PRIMARY_UNSCORED',{side,unit:side==='my'?'Primary Mission':'Opponent Primary Mission',action:'Primary scoring condition removed -'+Math.abs(delta)+' VP',before,after,delta,mission,round,scoringItem:row[2],scoringTiming:row[0]},fullBefore);
  }else{
    const per=primaryScoringIsPer(row);
    const amount=per?Math.max(1,Math.min(50,Math.floor(Number(amountOverride??amounts[index]??1)||1))):1;
    const baseVP=primaryScoringVP(row[1]);
    const requestedVP=baseVP*amount;
    const originalIndex=primaryScoringOriginalIndex(mission,index);
    const group=primaryScoringExclusiveGroup(mission,originalIndex);

    const before=Number(state[vpKey])||0;
    const roundTotalBefore=primaryRoundScoredVP(side);
    let groupExistingVP=0;
    if(group){
      for(const otherIndex of scored){
        if(primaryScoringExclusiveGroup(mission,primaryScoringOriginalIndex(mission,otherIndex))===group){
          groupExistingVP+=Math.max(0,Number(values[otherIndex])||0);
        }
      }
    }
    const replacementBaseVP=Math.max(0,before-groupExistingVP);
    const replacementRoundBase=Math.max(0,roundTotalBefore-groupExistingVP);
    const endOfBattle=String(row[0]||'').toLowerCase().includes('end of battle');
    if(endOfBattle&&!state.battleEnded){alert('This Primary scoring condition can only be recorded after the battle ends.');return;}
    const roundAllowance=Math.max(0,15-replacementRoundBase);
    const gameAllowance=Math.max(0,45-replacementBaseVP);
    const allowedVP=Math.min(requestedVP,roundAllowance,gameAllowance);
    if(allowedVP<=0){
      alert(gameAllowance<=0?'Primary Missions are capped at 45 VP for the game.':'Primary scoring is capped at 15 VP for this round.');
      return;
    }

    if(group){
      for(const otherIndex of [...scored]){
        if(primaryScoringExclusiveGroup(mission,primaryScoringOriginalIndex(mission,otherIndex))===group){
          delete values[otherIndex];
          delete amounts[otherIndex];
        }
      }
      state[byRoundKey][roundKey]=scored.filter(i=>primaryScoringExclusiveGroup(mission,primaryScoringOriginalIndex(mission,i))!==group);
    }

    const after=replacementBaseVP+allowedVP;
    const delta=after-before;
    state[vpKey]=after;
    state[overallKey]=Math.max(0,(Number(state[overallKey])||0)+delta);
    state[byRoundKey][roundKey]=[...state[byRoundKey][roundKey],index];
    state[valueKey][roundKey][index]=allowedVP;
    state[amountKey][roundKey][index]=amount;
    state[listKey]=state[byRoundKey][roundKey];
    event('PRIMARY_SCORED',{side,unit:side==='my'?'Primary Mission':'Opponent Primary Mission',action:'Primary scored '+(delta>=0?'+':'')+delta+' VP',before,after,delta,mission,round,scoringItem:row[2],scoringTiming:row[0],amount,roundCap:15,roundTotal:replacementRoundBase+allowedVP},fullBefore);
  }
  save();
  render();
}

 });
 return groups;
}

function ensureSecondaryRoundLedger(){
  if(!state.secondaryMyScoredVPByRound||typeof state.secondaryMyScoredVPByRound!=='object')state.secondaryMyScoredVPByRound={};
  if(!state.secondaryOppScoredVPByRound||typeof state.secondaryOppScoredVPByRound!=='object')state.secondaryOppScoredVPByRound={};
  // Migrate the temporary END bucket created by an earlier scoring implementation.
  // Current 11th-edition scoring still counts end-of-battle Secondary VP against
  // the final battle-round 15 VP limit.
  for(const side of ['my','opp']){
    const key=side==='my'?'secondaryMyScoredVPByRound':'secondaryOppScoredVPByRound';
    const roundMapKey=side==='my'?'secondaryMyScoredRound':'secondaryOppScoredRound';
    const end=state[key].END;
    if(end&&typeof end==='object'){
      const finalRound=String(Math.max(1,Number(state.round)||1));
      if(!state[key][finalRound]||typeof state[key][finalRound]!=='object')state[key][finalRound]={};
      let room=Math.max(0,15-Object.values(state[key][finalRound]).reduce((s,v)=>s+Math.max(0,Number(v)||0),0));
      for(const [name,value] of Object.entries(end)){
        const amount=Math.min(Math.max(0,Number(value)||0),room);
        if(amount>0)state[key][finalRound][name]=Math.max(0,Number(state[key][finalRound][name])||0)+amount;
        room-=amount;
        if(state[roundMapKey]?.[name]==='END')state[roundMapKey][name]=Number(finalRound);
      }
      delete state[key].END;
    }
  }
}

function attachmentIssues(side){
  const out=[];
  const list=Array.isArray(state[side])?state[side]:[];
  const byId=new Map(list.map(e=>[e.uid,e]));
  list.forEach(e=>{
    const u=get(e.unitId);
    if(e.attachedTo){
      const parent=byId.get(e.attachedTo);
      if(!parent)out.push(u.name+': attachment target '+e.attachedTo+' is missing');
      else if(e.attachedRole==='leader'){
        const leaders=Array.isArray(parent.leaderUids)?parent.leaderUids:[];
        if(!leaders.includes(e.uid))out.push(u.name+': Leader attachment is missing from Bodyguard leaderUids');
      }
    }
    const ids=Array.isArray(e.leaderUids)?e.leaderUids:[];
    ids.forEach(id=>{
      const leader=byId.get(id);
      if(!leader)out.push(u.name+': leader '+id+' is missing');
      else if(leader.attachedTo!==e.uid||leader.attachedRole!=='leader')out.push(u.name+': leader '+id+' points to a different Bodyguard');
      else if(!isLeaderUnit(get(leader.unitId)))out.push(u.name+': attached entry '+id+' is not a Leader');
    });
    if(e.leaderUid&& !ids.includes(e.leaderUid))out.push(u.name+': legacy leaderUid is not synchronized with leaderUids');
  });
  return out;
}
function issues(side){
 let out=[],seen={};
 attachmentIssues(side).forEach(x=>out.push(x));
 for(const e of state[side]){
   const u=get(e.unitId),r=unitRules(u);
   seen[e.unitId]=(seen[e.unitId]||0)+e.qty;
   if(e.models<r.minModels||e.models>r.maxModels||((e.models-r.minModels)%r.step))out.push(u.name+': invalid model count');
   if(e.qty>r.maxUnits)out.push(u.name+': too many units');
   if((u.weapons||[]).length&&!activeWeaponNames(e,u).length)out.push(u.name+': no active weapons selected');
   compositionIssues(e,u).forEach(x=>out.push(x));
   modelRosterIssues(e,u).forEach(x=>out.push(x));
   for(const g of wargearGroups(u)){
     if(g.type==='allocation'){
       const total=allocationTotal(e,g),models=Math.max(1,Math.floor(Number(e.models)||1));
       if(g.required&&total!==models)out.push(u.name+': '+g.label+' must allocate exactly '+models+' models');
       if(total>models)out.push(u.name+': '+g.label+' allocates too many models');
     }
   }
   if(side==='my'&&u.faction!==state.faction)out.push(u.name+': faction mismatch');
   if(e.attachedTo){
     const parent=entry(side,e.attachedTo);
     if(!parent){
       out.push(u.name+': attachment target missing');
     }else if(e.attachedRole==='leader'||(!e.attachedRole&&isLeaderUnit(u))){
       const pu=get(parent.unitId);
       if(!pu||!leaderNamesForBodyguard(pu).includes(u.name))out.push(u.name+': invalid Leader/Bodyguard attachment');
     }else if(e.attachedRole==='support'||(!e.attachedRole&&isSupportUnit(u))){
       const pu=get(parent.unitId);
       if(!pu||!supportNamesForBodyguard(pu).includes(u.name))out.push(u.name+': invalid support attachment');
     }
   }
 }
 for(const id in seen){
   const u=get(id);
   if(seen[id]>unitRules(u).maxUnits)out.push(u.name+': duplicate limit exceeded');
 }
 if(total(side)>state.limit)out.push('Points limit exceeded');
 return [...new Set(out)]
}

 const i=ids.indexOf(id);
 if(i>=0){
   ids.splice(i,1);
   const qtyKey=side==='my'?'selectedUnitAddQtyMy':'selectedUnitAddQtyOpp';
   if(state[qtyKey]&&typeof state[qtyKey]==='object')delete state[qtyKey][id];
 }else{
   ids.push(id);
   selectedUnitAddQty(side,id);
 }
 state[key]=ids;
 save();render();
}
function addSelectedUnits(side){
 const key=side==='my'?'selectedUnitsMy':'selectedUnitsOpp';
 const qtyKey=side==='my'?'selectedUnitAddQtyMy':'selectedUnitAddQtyOpp';
 const ids=selectedUnitIds(side).slice();
 if(!ids.length){alert('Select at least one unit first.');return;}
 let changed=false;
 ids.forEach(id=>{
   const u=get(id); if(!u)return;
   const requested=selectedUnitAddQty(side,id);
   const maxUnits=Math.max(1,Number(unitRules(u).maxUnits)||1);
   const current=(state[side]||[]).filter(e=>e.unitId===id).reduce((n,e)=>n+Math.max(0,Number(e.qty)||0),0);
   const room=Math.max(0,maxUnits-current);
   if(room<=0)return;
   const add=Math.min(requested,room);
   for(let i=0;i<add;i++){
     const e=makeEntry(u);
     e.qty=1;
     state[side].push(e);
     changed=true;
   }
   if(add<requested)alert(`${u.name}: only ${add} additional unit${add===1?' is':'s are'} allowed by the ${maxUnits}-unit limit.`);
 });
 state[key]=[];
 if(state[qtyKey]&&typeof state[qtyKey]==='object')state[qtyKey]={};
 save();
 render();
}

    state.gameTimer={elapsedMs:0,running:false,paused:false,startedAt:0,pausedAt:0,finishedAt:0,turnMyMs:0,turnOppMs:0,turnStartedGameMs:0,turnPaused:false};
  }
  return state.gameTimer;
}
function gameTimerElapsed(){
  const t=ensureGameTimer();
  if(!t.running)return Math.max(0,Number(t.elapsedMs)||0);
  return Math.max(0,(Number(t.elapsedMs)||0)+(Date.now()-(Number(t.startedAt)||Date.now())));
}

function turnElapsedMs(side){
  const t=ensureGameTimer();
  const key=side==='opp'?'turnOppMs':'turnMyMs';
  const saved=Math.max(0,Number(t[key])||0);
  if(t.turnPaused)return saved;
  if(state.currentTurn!==side)return saved;
  return saved+Math.max(0,gameTimerElapsed()-(Number(t.turnStartedGameMs)||0));
}
function finalizeCurrentTurnTime(){
  const t=ensureGameTimer();
  if(t.turnPaused)return;
  const side=state.currentTurn==='opp'?'opp':'my';
  const key=side==='opp'?'turnOppMs':'turnMyMs';
  const now=gameTimerElapsed();
  const delta=Math.max(0,now-(Number(t.turnStartedGameMs)||0));
  t[key]=Math.max(0,Number(t[key])||0)+delta;
  t.turnStartedGameMs=now;
}
function toggleTurnPause(){
  const t=ensureGameTimer();
  if(t.finishedAt)return;
  if(t.turnPaused){
    t.turnStartedGameMs=gameTimerElapsed();
    t.turnPaused=false;
  }else{
    finalizeCurrentTurnTime();
    t.turnPaused=true;
  }
  save();
  render();
}
function switchTurnClock(next){
  const t=ensureGameTimer();
  if(!t.turnPaused){
    finalizeCurrentTurnTime();
    t.turnStartedGameMs=gameTimerElapsed();

}
function formatGameTime(ms){
  const total=Math.max(0,Math.floor(Number(ms)||0)/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=Math.floor(total%60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startGameTimer(){
  const t=ensureGameTimer();
  t.elapsedMs=0;
  t.startedAt=Date.now();
  t.pausedAt=0;
  t.finishedAt=0;
  t.running=true;
  t.paused=false;

  gameTimerInterval=setInterval(updateGameTimerDisplay,100);
  updateGameTimerDisplay();
}

function finishGameTimer(){
  const t=ensureGameTimer();

  if(t.running){finalizeCurrentTurnTime();t.elapsedMs=gameTimerElapsed();}
  t.running=false;
  t.paused=false;
  t.finishedAt=Date.now();
  if(gameTimerInterval){clearInterval(gameTimerInterval);gameTimerInterval=null;}

  render();
}

function snapshotForUndo(){
  const x=JSON.parse(JSON.stringify(state));
  delete x.events;
  delete x._undoSnapshot;
  // Materialize the live game/turn clocks into the snapshot so undo restores
  // the logical time at which the action began rather than stale timer fields.
  const t=ensureGameTimer();
  if(t&&typeof t==='object'){
    const elapsed=gameTimerElapsed();
    const currentSide=state.currentTurn==='opp'?'opp':'my';
    const turnKey=currentSide==='opp'?'turnOppMs':'turnMyMs';
    const otherKey=currentSide==='opp'?'turnMyMs':'turnOppMs';
    const savedTurn=Math.max(0,Number(t[turnKey])||0);
    const turnStarted=Math.max(0,Number(t.turnStartedGameMs)||0);
    const liveTurn=!t.turnPaused&&t.running&&!t.finishedAt
      ?savedTurn+Math.max(0,elapsed-turnStarted)
      :savedTurn;
    x.gameTimer={...x.gameTimer,elapsedMs:elapsed};
    x.gameTimer[turnKey]=liveTurn;
    x.gameTimer[otherKey]=Math.max(0,Number(t[otherKey])||0);
    if(t.running&&!t.finishedAt){
      // Rebase the restored running timer to the moment the snapshot was taken.
      x.gameTimer.startedAt=Date.now();
      x.gameTimer.turnStartedGameMs=elapsed;
    }
  }
  return x;
}

    t.startedAt=Date.now();

function undoLastAction(){

  const restored=JSON.parse(JSON.stringify(e.before));
  restored.events=keepEvents;
  restored._undoSnapshot=null;
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state,restored);

  save();
  render();

function armyStateCard(side,title){const units=side==='my'?state.my:state.opp;const empty=side==='my'?'<div class="empty">No army. Go to List Builder to add units, then Start / Reset Battle.</div>':'<div class="empty">No army.</div>';return `<div class="card army-state-card"><h3>${esc(title)}</h3>${(units||[]).map(e=>gameRow(side,e)).join('')||empty}</div>`}
function sortBattleState(arr){return (arr||[]).slice().sort((a,b)=>{const au=get(a.unitId),bu=get(b.unitId);const ag=a.game||{models:a.models,wounds:a.models*(au?.wounds||1),status:'Alive',battleshocked:false};const bg=b.game||{models:b.models,wounds:b.models*(bu?.wounds||1),status:'Alive',battleshocked:false};const aDestroyed=ag.status==='Destroyed'?1:0,bDestroyed=bg.status==='Destroyed'?1:0;if(aDestroyed!==bDestroyed)return aDestroyed-bDestroyed;const aShock=ag.battleshocked?0:1,bShock=bg.battleshocked?0:1;if(aShock!==bShock)return aShock-bShock;const aMax=a.models*(au?.wounds||1),bMax=b.models*(bu?.wounds||1);const aDamaged=Number(ag.wounds)<aMax?0:1,bDamaged=Number(bg.wounds)<bMax?0:1;if(aDamaged!==bDamaged)return aDamaged-bDamaged;if(aDamaged===0&&Number(ag.wounds)!==Number(bg.wounds))return Number(ag.wounds)-Number(bg.wounds);return String(au?.name||'').localeCompare(String(bu?.name||''));});}

 if(n.includes('hormagaunt')){

   if(p==='Fight') add('Synapse: +1 Strength','Exocrine');
 }
 if(n.includes('tyrannofex')){

 }
 if(n.includes('tyranid prime')){

 }
 if(n.includes('lictor')&&p==='Movement') add('Rapid Ingress free reminder','Lictor');
 return out;

function gameUnitReferenceHtml(u,phase){
 const refs=gameUnitReferenceReminders(u,phase);
 if(!refs.length)return '';
 return '<div class="game-unit-reference">'+refs.map(r=>`<span class="game-unit-reference-pill"><b>${esc(r.tag)}</b> ${esc(r.text)}</span>`).join('')+'</div>';
}
function gameRow(side,e){
  const u=get(e.unitId),displayName=unitDisplayName(side,e),perModelWounds=Math.max(1,Number(u.wounds)||1);
  const g=e.game||{models:e.models,wounds:e.models*perModelWounds,status:'Alive',battleshocked:false};
  const rosterTracked=!!modelRosterRule(u);
  if(rosterTracked)syncModelRosterBattleState(e,u);
  if(g.battleshocked==null)g.battleshocked=false;
  const maxWounds=Math.max(0,e.models*perModelWounds);
  if(!rosterTracked){
    g.wounds=Math.max(0,Math.min(maxWounds,Number(g.wounds)||0));
    if(perModelWounds>1)g.models=Math.max(0,Math.min(e.models,g.wounds>0?Math.ceil(g.wounds/perModelWounds):0));
    else g.models=Math.max(0,Math.min(e.models,Number(g.models)||0));
    if(g.models<=0||g.wounds<=0)g.status='Destroyed';
    else if(g.wounds<maxWounds)g.status='Damaged';
    else g.status='Alive';
  }
  const modelControls=e.models>1&&!rosterTracked?'<button class="btn" type="button" onclick="changeUnit(\''+side+'\',\''+e.uid+'\',-1,0);return false;">M−</button><button class="btn" type="button" onclick="changeUnit(\''+side+'\',\''+e.uid+'\',1,0);return false;">M+</button>':'';
  const shockControl='<button class="btn'+(g.battleshocked?' danger':'')+'" type="button" onclick="toggleBattleshocked(\''+side+'\',\''+e.uid+'\');return false;">'+(g.battleshocked?'✓ Shocked':'Shock')+'</button>';
  const destroyedControl=rosterTracked?'':'<button class="btn'+(g.status==='Destroyed'?' danger':'')+'" type="button" onclick="setUnitDestroyed(\''+side+'\',\''+e.uid+'\');return false;">'+(g.status==='Destroyed'?'✓ Dead':'Dead')+'</button>';
  const stats=perModelWounds===1
    ? (e.models>1?(g.models+'/'+e.models+' models'):'1 model')+' • '+g.status
    : (e.models>1?(g.models+'/'+e.models+' models • '):'')+g.wounds+'/'+maxWounds+' wounds • '+g.status;
  const woundControls=perModelWounds>1&&!rosterTracked?'<button class="btn" type="button" onclick="changeUnit(\''+side+'\',\''+e.uid+'\',0,-1);return false;">W−</button><button class="btn" type="button" onclick="changeUnit(\''+side+'\',\''+e.uid+'\',0,1);return false;">W+</button>':'';
  return '<div class="game-unit-row '+(g.battleshocked?'is-battleshocked':'')+'" data-entry-id="'+esc(e.uid)+'"><div class="game-unit-name"><strong>'+esc(displayName)+'</strong>'+(g.battleshocked?'<span class="battleshock-badge">BATTLESHOCKED</span>':'')+'</div><div class="game-unit-controls"><div class="game-unit-stats">'+stats+'</div><div class="row game-unit-actions game-status-actions">'+shockControl+destroyedControl+'</div><div class="row game-unit-actions game-modifier-actions">'+modelControls+woundControls+'</div></div>'+gameUnitReferenceHtml(u,state.phase)+modelRosterHtml(side,e,u)+'</div></div>';
}
function syncModelRosterBattleState(e,u){
  if(!e||!u)return;
  if(!e.game)e.game={entryId:e.uid,models:e.models,wounds:e.models*Math.max(1,Number(u.wounds)||1),status:'Alive',battleshocked:false};
  const roster=ensureModelRoster(e,u);
  const maxWounds=Math.max(0,e.models*Math.max(1,Number(u.wounds)||1));
  const alive=roster.filter(m=>m.alive!==false);
  const wounds=alive.reduce((sum,m)=>sum+Math.max(0,Number(m.woundsRemaining)||0),0);
  e.game.models=alive.length;
  e.game.wounds=Math.max(0,Math.min(maxWounds,wounds));
  e.game.status=alive.length===0?'Destroyed':(wounds<maxWounds?'Damaged':'Alive');
}
function modelRosterHtml(side,e,u){
  if(!modelRosterRule(u))return '';
  const roster=ensureModelRoster(e,u);
  return '<div class="model-roster-list"><div class="model-roster-title">Model-level casualties</div>'+
    roster.map(m=>{
      const alive=m.alive!==false,max=Math.max(1,Number(u.wounds)||1),remaining=Math.max(0,Math.min(max,Number(m.woundsRemaining)==null?max:Number(m.woundsRemaining)));
      m.woundsRemaining=remaining;
      const weapons=(Array.isArray(m.weapons)?m.weapons:[]).join(' • ')||'Standard weapons';
      const woundText=alive?(max>1?remaining+'/'+max+' wounds remaining':'Alive'):'Destroyed';
      const woundButtons=alive&&max>1?'<button class="btn" type="button" onclick="changeModelWounds(\''+side+'\',\''+e.uid+'\',\''+m.id+'\',-1);return false;">W−</button><button class="btn" type="button" onclick="changeModelWounds(\''+side+'\',\''+e.uid+'\',\''+m.id+'\',1);return false;">W+</button>':'';
      const stateButton=alive?'<button class="btn danger" type="button" onclick="setModelDestroyed(\''+side+'\',\''+e.uid+'\',\''+m.id+'\');return false;">Dead</button>':'<button class="btn" type="button" onclick="restoreModel(\''+side+'\',\''+e.uid+'\',\''+m.id+'\');return false;">Restore</button>';
      return '<div class="model-roster-row '+(alive?'':'destroyed')+'"><div><div class="model-roster-name">'+esc(m.role||('Model '+m.index))+'</div><div class="model-roster-weapons">'+esc(weapons)+'</div><div class="model-roster-wounds">'+woundText+'</div></div><div class="model-roster-actions">'+woundButtons+stateButton+'</div></div>';
    }).join('')+'</div>';
}
function setModelDestroyed(side,id,modelId){
  const fullBefore=snapshotForUndo(),e=entry(side,id);if(!e)return;
  const u=get(e.unitId);if(!u||!modelRosterRule(u))return;
  const roster=ensureModelRoster(e,u),m=roster.find(x=>x.id===modelId);if(!m||m.alive===false)return;
  const before=JSON.parse(JSON.stringify(e.game||{})),modelBefore={alive:m.alive,woundsRemaining:m.woundsRemaining};
  m.alive=false;m.woundsRemaining=0;syncModelRosterBattleState(e,u);
  event('MODEL_STATE_CHANGED',{side,unitId:e.unitId,entryId:id,unit:u.name,modelId:m.id,modelRole:m.role,action:'Model destroyed',modelBefore,modelAfter:{alive:false,woundsRemaining:0},before,after:e.game},fullBefore);
  save();render();
}
function restoreModel(side,id,modelId){
  const fullBefore=snapshotForUndo(),e=entry(side,id);if(!e)return;
  const u=get(e.unitId);if(!u||!modelRosterRule(u))return;
  const roster=ensureModelRoster(e,u),m=roster.find(x=>x.id===modelId);if(!m||m.alive!==false)return;
  const before=JSON.parse(JSON.stringify(e.game||{}));
  m.alive=true;m.woundsRemaining=Math.max(1,Number(u.wounds)||1);syncModelRosterBattleState(e,u);
  event('MODEL_STATE_CHANGED',{side,unitId:e.unitId,entryId:id,unit:u.name,modelId:m.id,modelRole:m.role,action:'Model restored',before,after:e.game},fullBefore);
  save();render();
}
function changeModelWounds(side,id,modelId,delta){
  const d=Math.trunc(Number(delta)||0);if(!d)return;
  const fullBefore=snapshotForUndo(),e=entry(side,id);if(!e)return;
  const u=get(e.unitId);if(!u||!modelRosterRule(u))return;
  const roster=ensureModelRoster(e,u),m=roster.find(x=>x.id===modelId);if(!m||m.alive===false)return;
  const max=Math.max(1,Number(u.wounds)||1),beforeModel={alive:m.alive,woundsRemaining:Number(m.woundsRemaining)||max};
  m.woundsRemaining=Math.max(0,Math.min(max,beforeModel.woundsRemaining+d));
  if(m.woundsRemaining<=0){m.woundsRemaining=0;m.alive=false;}
  syncModelRosterBattleState(e,u);
  event('MODEL_STATE_CHANGED',{side,unitId:e.unitId,entryId:id,unit:u.name,modelId:m.id,modelRole:m.role,action:'Model wounds '+(d>0?'+':'')+d,modelBefore:beforeModel,modelAfter:{alive:m.alive,woundsRemaining:m.woundsRemaining},before,after:e.game},fullBefore);
  save();render();
}
function setUnitDestroyed(side,id){
  const fullBefore=snapshotForUndo();const e=entry(side,id);if(!e)return;const u=get(e.unitId);if(!u)return;const perModelWounds=Math.max(1,Number(u.wounds)||1);
  if(!e.game)e.game={entryId:e.uid,models:e.models,wounds:e.models*perModelWounds,status:'Alive',battleshocked:false};
  if(e.game.entryId!==e.uid)e.game={...e.game,entryId:e.uid};
  const before=JSON.parse(JSON.stringify(e.game));
  if(e.game.status==='Destroyed'){
    const restore=e.game.preDestroyedState&&typeof e.game.preDestroyedState==='object'?e.game.preDestroyedState:null;
    if(restore){
      const restoredGame={...restore.game};
      delete restoredGame.preDestroyedState;
      e.game=restoredGame;
      if(modelRosterRule(u)&&Array.isArray(restore.modelRoster)){
        e.modelRoster=JSON.parse(JSON.stringify(restore.modelRoster));
        e.game.modelRoster=e.modelRoster.map(m=>({...m,weapons:Array.isArray(m.weapons)?[...m.weapons]:[]}));
        syncModelRosterBattleState(e,u);
      }
    }else{
      e.game.wounds=Math.min(perModelWounds,e.models*perModelWounds);
      e.game.models=Math.max(1,Math.min(e.models,Math.ceil(e.game.wounds/perModelWounds)));
      e.game.status='Damaged';
      if(modelRosterRule(u)){const roster=ensureModelRoster(e,u);roster.forEach(m=>{m.alive=true;m.woundsRemaining=Math.max(1,Number(u.wounds)||1)});syncModelRosterBattleState(e,u);}
    }
  } else {
    const priorRoster=modelRosterRule(u)?JSON.parse(JSON.stringify(ensureModelRoster(e,u))):null;
    const priorGame=JSON.parse(JSON.stringify(e.game));
    e.game={...e.game,models:0,wounds:0,status:'Destroyed',preDestroyedState:{game:priorGame,modelRoster:priorRoster}};
    if(modelRosterRule(u)){const roster=ensureModelRoster(e,u);roster.forEach(m=>{m.alive=false;m.woundsRemaining=0});syncModelRosterBattleState(e,u);}
  }
  event('UNIT_STATE_CHANGED',{side,unitId:e.unitId,entryId:id,unit:u.name,action:e.game.status==='Destroyed'?'Destroyed':'Destroyed cleared',modelsBefore:before.models,modelsAfter:e.game.models,woundsBefore:before.wounds,woundsAfter:e.game.wounds,statusBefore:before.status,statusAfter:e.game.status,before,after:e.game},fullBefore);save();render();
}
function toggleBattleshocked(side,id){const fullBefore=snapshotForUndo();const e=entry(side,id);if(!e)return;const u=get(e.unitId);if(!u)return;if(!e.game)e.game={entryId:e.uid,models:e.models,wounds:e.models*u.wounds,status:'Alive',battleshocked:false};
if(e.game.entryId!==e.uid)e.game={...e.game,entryId:e.uid};const before=!!e.game.battleshocked;e.game.battleshocked=!before;event('BATTLESHOCK_CHANGED',{side,unit:e?u.name:'Unit',entryId:id,action:e.game.battleshocked?'Battleshocked':'Battleshock cleared',battleshockedBefore:before,battleshockedAfter:e.game.battleshocked},fullBefore);save();render()}
function setCurrentTurn(side){
  const fullBefore=snapshotForUndo();
  const next=side==='opp'?'opp':'my';
  const before=state.currentTurn==='opp'?'opp':'my';
  if(before===next){
    if(ensureTacticalTurnDraw(next)>0){save();render();}
    return;
  }
  switchTurnClock(next);
  state.currentTurn=next;
  state.objectiveTurnStartOwners={...(state.objectiveTurnStartOwners||{})};
  const turnKey=Math.max(1,Number(state.round)||1)+'|'+next;
  state.objectiveTurnStartOwners[turnKey]=Object.fromEntries(Object.entries(state.objectives||{}).map(([name,owner])=>[name,['my','opp','contested','none'].includes(owner)?owner:'none']));
  ensureTacticalTurnDraw(next);
  event('TURN_CHANGED',{
    side:next,
    unit:next==='my'?state.myName:state.oppName,
    action:'Current Player Turn → '+(next=== 'my'?state.myName:state.oppName),
    before,
    after:next
  },fullBefore);
  save();
  render();
}
window.setCurrentTurn=setCurrentTurn;
function changeUnit(side,id,dm,dw){
  const fullBefore=snapshotForUndo();const e=entry(side,id);if(!e)return;const u=get(e.unitId);if(!u)return;
  const perModelWounds=Math.max(1,Number(u.wounds)||1);
  if(!e.game)e.game={entryId:e.uid,models:e.models,wounds:e.models*perModelWounds,status:'Alive',battleshocked:false};
  if(e.game.entryId!==e.uid)e.game={...e.game,entryId:e.uid};if(e.game.battleshocked==null)e.game.battleshocked=false;
  const before=JSON.parse(JSON.stringify(e.game));const oldModels=e.game.models,oldWounds=e.game.wounds;const maxWounds=e.models*perModelWounds;
  let wounds=Math.max(0,Math.min(maxWounds,Number(e.game.wounds)||0));let models=Math.max(0,Math.min(e.models,Number(e.game.models)||0));
  if(dm){
    const nextModels=Math.max(0,Math.min(e.models,models+dm));
    if(perModelWounds===1){models=nextModels;wounds=models;}
    else if(dm<0){models=nextModels;wounds=Math.min(wounds,models*perModelWounds);models=wounds>0?Math.min(models,Math.ceil(wounds/perModelWounds)):0;}
    else{models=nextModels;wounds=Math.min(maxWounds,wounds+perModelWounds);models=wounds>0?Math.min(models,Math.ceil(wounds/perModelWounds)):0;}
  }
  if(dw&&perModelWounds>1){wounds=Math.max(0,Math.min(maxWounds,wounds+dw));models=wounds>0?Math.min(e.models,Math.ceil(wounds/perModelWounds)):0;}
  e.game.models=models;e.game.wounds=wounds;e.game.status=models<=0||wounds<=0?'Destroyed':(wounds<maxWounds?'Damaged':'Alive');
  if(modelRosterRule(u)){
    const roster=ensureModelRoster(e,u);
    const targetModels=Math.max(0,Math.min(e.models,Number(e.game.models)||0));
    let alive=roster.filter(m=>m.alive!==false);
    while(alive.length>targetModels){
      const m=alive.pop();m.alive=false;m.woundsRemaining=0;
    }
    while(alive.length<targetModels){
      const m=roster.find(x=>x.alive===false);
      if(!m)break;
      m.alive=true;m.woundsRemaining=perModelWounds;alive.push(m);
    }
    let targetWounds=Math.max(0,Math.min(targetModels*perModelWounds,Number(e.game.wounds)||0));
    let currentWounds=alive.reduce((sum,m)=>sum+Math.max(0,Number(m.woundsRemaining)||0),0);
    if(currentWounds>targetWounds){
      for(let i=alive.length-1;i>=0&&currentWounds>targetWounds;i--){
        const m=alive[i],beforeW=Math.max(0,Number(m.woundsRemaining)||0);
        const next=Math.max(0,beforeW-(currentWounds-targetWounds));
        m.woundsRemaining=next;
        if(next<=0)m.alive=false;
        currentWounds-=beforeW-next;
      }
    }else if(currentWounds<targetWounds){
      for(let i=0;i<alive.length&&currentWounds<targetWounds;i++){
        const m=alive[i],beforeW=Math.max(0,Number(m.woundsRemaining)||0);
        const next=Math.min(perModelWounds,beforeW+(targetWounds-currentWounds));
        m.woundsRemaining=next;
        currentWounds+=next-beforeW;
      }
    }
    syncModelRosterBattleState(e,u);
    models=e.game.models;wounds=e.game.wounds;
  }
  if(e.game.models===oldModels&&e.game.wounds===oldWounds)return;
  const action=dm?('Models '+(dm>0?'+':'')+dm):('Wounds '+(dw>0?'+':'')+dw);
  event('UNIT_STATE_CHANGED',{side,unitId:e.unitId,entryId:id,unit:u.name,action,modelsBefore:oldModels,modelsAfter:e.game.models,woundsBefore:oldWounds,woundsAfter:e.game.wounds,statusBefore:before.status,statusAfter:e.game.status,before,after:e.game},fullBefore);save();render();
}
function ensureScoreLedger(){
  const sides=['my','opp'];
  sides.forEach(side=>{
    const pk=side==='my'?'primaryMyScoredVP':'primaryOppScoredVP';
    const sk=side==='my'?'secondaryMyScoredVP':'secondaryOppScoredVP';
    const mk=side==='my'?'manualVPMy':'manualVPOpp';
    const totalKey=side==='my'?'myVP':'oppVP';
    if(!Number.isFinite(Number(state[pk])))state[pk]=0;
    if(!state[sk]||typeof state[sk]!=='object')state[sk]={};
    const secondary=Object.values(state[sk]).reduce((s,v)=>s+Math.max(0,Number(v)||0),0);
    state[pk]=Math.max(0,Math.min(45,Number(state[pk])||0));
    const expected= (side==='my'?(state.battleReadyMy?10:0):(state.battleReadyOpp?10:0))+Math.min(45,Number(state[pk])||0)+Math.min(45,secondary);
    if(!Number.isFinite(Number(state[mk])))state[mk]=Math.max(0,(Number(state[totalKey])||0)-expected);
    state[mk]=Math.max(0,Math.min(100,Number(state[mk])||0));
    state[totalKey]=Math.min(100,expected+state[mk]);
  });
  return state;
}
function scoreTotalForSide(side){
  ensureScoreLedger();
  const primary=Math.max(0,Math.min(45,Number(state[side==='my'?'primaryMyScoredVP':'primaryOppScoredVP'])||0));
  const secondary=Math.max(0,Math.min(45,Number(secondaryTotalScoredVP(side))||0));
  const ready=side==='my'?(state.battleReadyMy?10:0):(state.battleReadyOpp?10:0);
  const manual=Math.max(0,Number(state[side==='my'?'manualVPMy':'manualVPOpp'])||0);
  return Math.min(100,ready+primary+secondary+manual);
}

function tacticalWeaponPhaseEligible(w,phase,attackerEntry,targetEntry){

  const raw=String(w.rng??w.range??'').trim().toUpperCase();
  const closeQuarters=tacticalWeaponIsCloseQuarters(w);
  const blast=tacticalWeaponIsBlast(w);
  const assault=tacticalWeaponIsAssault(w);
  const monsterVehicle=tacticalUnitIsMonsterVehicle(attackerEntry);
  const ctx=attackerEntry&&targetEntry?tacticalPairState(attackerEntry.uid,targetEntry.uid):null;
  const targetEngaged=!!targetEntry&&(
    ctx?.engagement==='engaged'||tacticalUnitIsEngagedAny(targetEntry.uid)

  const movementEntry=attackerEntry?combatRootEntry('my',attackerEntry):null;
  const movementType=tacticalUnitMovementType(movementEntry?.uid||attackerEntry?.uid);

    if(raw==='MELEE')return false;

    if(tacticalWeaponIsIndirect(w)&&tacticalUnitIsEngagedAny(attackerEntry?.uid))return false;

    // that Advanced this turn. Close-quarters shooting additionally requires
    // that the unit did not Advance.
    if(advanced===true){
      if(ctx?.engagement==='engaged')return false;
      return assault;
    }
    if(targetEngaged&&blast)return false;
    if(ctx?.engagement==='engaged'){
      if(!monsterVehicle&&!closeQuarters)return false;

function tacticalWeaponRange(w){

function tacticalTargetLegality(attackerEntry,targetEntry,phase){

    const movementType=tacticalUnitMovementType(attackerEntry.uid);
    if(!tacticalPhaseActionAvailable(attackerEntry.uid,'Shooting'))return {status:'known',known:true,canTarget:false,reasons:['attacker has already completed its Shooting action'],context:ctx};
    const targetEngaged=ctx.engagement==='engaged'||tacticalUnitIsEngagedAny(targetEntry.uid);
    const targetCombatUnit=combatTargetUnit('opp',targetEntry)||get(targetEntry.unitId);
    const targetIsMonsterVehicle=!!targetCombatUnit&&((targetCombatUnit.keywords||[]).map(k=>String(k||'').toUpperCase().trim()).some(k=>k==='MONSTER'||k==='VEHICLE'));
    if(advanced===null)reasons.push('movement state unknown');
    if(engaged&&ctx.engagement!=='engaged'){
      return {status:'known',known:true,canTarget:false,reasons:['engaged unit can only target an enemy unit it is engaged with during Close-quarters Shooting'],context:ctx};
    }
    if(!engaged&&targetEngaged&&!targetIsMonsterVehicle){

    }

    if(ctx.los==='no'&&!hasIndirect){

    }
    if(ctx.los==='no'&&hasIndirect)reasons.push('using Indirect Fire; attacking model lacks line of sight');
    const ranges=groups.map(g=>tacticalWeaponRange(g.weapon)).filter(Number.isFinite);
    if(!groups.length)return {status:'known',known:true,canTarget:false,reasons:['attacker has no phase-eligible ranged weapons'],context:ctx};
    if(!ranges.length)reasons.push('weapon range unknown');

    const movementType=tacticalUnitMovementType(combatRootEntry('my',attackerEntry)?.uid||attackerEntry.uid);
    if(tacticalUnitHasKeyword(attackerEntry,'AIRCRAFT'))reasons.push('AIRCRAFT units cannot declare charges');
    if(tacticalUnitHasKeyword(targetEntry,'AIRCRAFT')&&!tacticalUnitCanFly(attackerEntry))reasons.push('only FLYING units can select AIRCRAFT units as charge targets');
    if(movementType==='advance')reasons.push('attacker advanced and cannot declare a charge');
    if(movementType==='fallback')reasons.push('attacker fell back and cannot declare a charge');
    if(tacticalUnitIsEngagedAny(attackerEntry.uid))reasons.push('attacker is already engaged');
    if(ctx.distanceInches===null)reasons.push('distance unknown');
    if(ctx.distanceInches!==null&&ctx.distanceInches>12)reasons.push('target is beyond the 12-inch charge declaration range');
    if(ctx.engagement==='unknown')reasons.push('engagement status unknown');
    if(ctx.engagement==='engaged')reasons.push('target is already within engagement range');
    const blocked=reasons.some(x=>x==='AIRCRAFT units cannot declare charges'||x==='only FLYING units can select AIRCRAFT units as charge targets'||x==='attacker advanced and cannot declare a charge'||x==='attacker fell back and cannot declare a charge'||x==='attacker is already engaged'||x==='target is beyond the 12-inch charge declaration range'||x==='target is already within engagement range');
    return {status:blocked?'known':(reasons.length?'unknown':'known'),known:!reasons.length||blocked,canTarget:blocked?false:(reasons.length?null:true),reasons,context:ctx};
  }
  if(p==='Fight'){
    if(!tacticalPhaseActionAvailable(attackerEntry.uid,'Fight'))return {status:'known',known:true,canTarget:false,reasons:['attacker has already completed its Fight action'],context:ctx};

    if(tacticalUnitHasKeyword(attackerEntry,'AIRCRAFT'))reasons.push('AIRCRAFT units can only make melee attacks against FLYING units');
    if(tacticalUnitHasKeyword(targetEntry,'AIRCRAFT')&&!tacticalUnitCanFly(attackerEntry))reasons.push('only FLYING models can make melee attacks against AIRCRAFT units');

function resolveAttack(){

  const fullBefore=snapshotForUndo();
  const ae=mathRosterEntry('my'),de=mathRosterEntry('opp');
  const a=get(state.attacker),t=get(state.target),w=(a.weapons||[]).find(x=>x.name===state.weapon)||a.weapons[0];
  if(!w)return;
  const m={...(state.mathRules||{})};
  const selectedTargetEntry=de&&get(de.unitId)?.id===t.id?de:null;
  const te=selectedTargetEntry||state.opp.find(e=>e.unitId===t.id)||null;
  const attackerRoster=ae&&modelRosterRule(a)?survivingModelRoster(ae,a):[];
  const attackerRoot=ae?combatRootEntry('my',ae):ae;
  const movementEntry=attackerRoot||ae;
  const movementActions=tacticalAdvisorActionState(movementEntry?.uid);
  const advanced=tacticalUnitAdvancedState(movementEntry?.uid);
  const pairCtx=ae&&te?tacticalPairState(ae.uid,te.uid):null;
  const targetEngaged=!!te&&(pairCtx?.engagement==='engaged'||tacticalUnitIsEngagedAny(te.uid));
  m.engagedTargetMonsterVehicle=targetEngaged&&tacticalUnitIsMonsterVehicle(te);
  m.attackerEngagedWithTarget=pairCtx?.engagement==='engaged';
  m.attackerEngagedAny=!!ae&&tacticalUnitIsEngagedAny(ae.uid);
  m.attackerMonsterVehicle=!!ae&&tacticalUnitIsMonsterVehicle(ae);
  m.stationary=!!movementEntry&&tacticalUnitMovementType(movementEntry.uid)==='remained';
  const movementDistance=movementActions?.movementDistanceInches;
  const effectiveMovementDistance=m.stationary?0:movementDistance;
  const setUpThisTurn=movementActions?.setUpThisTurn;
  m.movementDistanceInches=effectiveMovementDistance;
  m.setUpThisTurn=setUpThisTurn;
  m.heavyEligible=!!movementEntry&&
    !tacticalUnitIsEngagedAny(movementEntry.uid)&&
    setUpThisTurn!==true&&
    effectiveMovementDistance!==null&&
    Number.isFinite(Number(effectiveMovementDistance))&&
    Number(effectiveMovementDistance)<=3;
  m.chargeMade=!!movementActions?.chargeMade;

  const phaseEligible=tacticalWeaponPhaseEligible(w,phase,ae,te||null);
  if(!phaseEligible)return;
  const leg=tacticalTargetLegality(ae,te,phase);
  if(leg.canTarget===false)return;
  if(phase==='Shooting'){
    const pairCtxNow=ae&&te?tacticalPairState(ae.uid,te.uid):null;
    if(pairCtxNow?.los==='no'&&!tacticalWeaponIsIndirect(w))return;
    const rangeNow=tacticalWeaponRange(w);
    if(pairCtxNow?.distanceInches!==null&&Number.isFinite(rangeNow)&&rangeNow<pairCtxNow.distanceInches)return;
  }
  const exactWeaponModels=attackerRoster.length
    ?attackerRoster.filter(model=>(Array.isArray(model.weapons)?model.weapons:[]).includes(w.name))
    :[];
  const eligibleWeaponModels=exactWeaponModels.length
    ?exactWeaponModels.filter(model=>
        !tacticalWeaponModelAlreadyUsed(ae.uid,model.id,w.name,state.round,state.phase,'my') &&
        !tacticalWeaponModelModeConflict(ae.uid,model.id,w,ae,state.round,state.phase,'my')

    :[];
  let modelsAvailable=0;
  if(attackerRoster.length){
    modelsAvailable=eligibleWeaponModels.length;
  }else{
    const allocated=Math.max(0,Number(mathWeaponAlloc(ae,a)?.[w.name])||0);
    const available=tacticalWeaponAvailableForPhase(
      ae?.uid,w,allocated,state.round,state.phase,'my'

  }

  if(modelsAvailable<=0)return;

  const modelsResolved=Math.max(1,modelsAvailable);

  m.attackerModels=modelsResolved;
  let woundsState,rosterAlive=[],targetSlots=null,targetRoot=null;
  targetRoot=combatRootEntry('opp',te||selectedTargetEntry||null);
  const targetSnap=targetRoot?combatSnapshot('opp',targetRoot):null;
  const attachedTarget=!!(targetSnap&&targetSnap.components?.length>1&&targetSnap.components.some(x=>x.role==='bodyguard')&&targetSnap.components.some(x=>x.role==='leader'||x.role==='support'));
  if(attachedTarget){
    const bodyComp=targetSnap.components.find(x=>x.role==='bodyguard')||null;
    const charComps=targetSnap.components.filter(x=>x.role==='leader'||x.role==='support');
    const bodySlots=(bodyComp?.models||[]).filter(x=>x.alive!==false).map(x=>({model:x,profile:{...(x.profile||{})},maxWounds:Math.max(1,Number(x.maxWounds)||Number(x.profile?.W)||1)}));
    const charSlots=charComps.flatMap(comp=>(comp.models||[]).filter(x=>x.alive!==false).map(x=>({model:x,profile:{...(x.profile||{})},maxWounds:Math.max(1,Number(x.maxWounds)||Number(x.profile?.W)||1)})));
    targetSlots={bodyComp,charComps,bodySlots,charSlots};

    woundsState=[...bodySlots,...charSlots].map(x=>Math.max(0,Number(x.model.woundsRemaining)||x.maxWounds));

        }

    }else if(rosterTracked){

      te.game.wounds=Math.max(0,te.game.wounds-r.damage);

      attacker:a.name,attackerEntryUid:ae?.uid||null,weapon:w.name,target:t.name,targetEntryUid:te?.uid||null,unit:a.name,
      action:'Attack with '+w.name+' → '+t.name,
      attacks:Math.round(engineExpectedDice(w.A)*modelsResolved),modelsResolved,hits:r.hits,wounds:r.wounds,saved:r.saved,damage:r.damage,
      critHits:r.critHits,critW:r.critWounds,before,after:te.game,rollLog:r.rollLog,
      modelIds:resolvedModelIds,shootingMode:state.phase==='Shooting'?tacticalWeaponShootingMode(w):null,
      modelLevel:rosterTracked

    event('ATTACK_RESOLUTION',{
      attacker:a.name,attackerEntryUid:ae?.uid||null,weapon:w.name,target:t.name,targetEntryUid:te?.uid||null,unit:a.name,
      action:'Attack with '+w.name+' → '+t.name,

      hits:r.hits,wounds:r.wounds,saved:r.saved,damage:r.damage,critHits:r.critHits,critW:r.critWounds,rollLog:r.rollLog

  }

}

function loadSupabaseLibrary(){
  if(window.supabase?.createClient)return Promise.resolve(true);

    s.src=SUPABASE_SCRIPT_URL;
    s.async=true;
    s.onload=()=>resolve(!!window.supabase?.createClient);
    s.onerror=()=>resolve(false);

async function ensureSupabaseClient(){
  const cfg=getCloudConfig();
  if(!cfg.url||!cfg.key)throw new Error('Enter your Supabase Project URL and Publishable key first.');
  const loaded=await loadSupabaseLibrary();
  if(!loaded)throw new Error('Supabase library could not be loaded. Check your internet connection.');
  if(!supabaseClient){
    supabaseClient=window.supabase.createClient(cfg.url,cfg.key);
    if(!supabaseAuthListenerBound){
      supabaseAuthListenerBound=true;
      supabaseClient.auth.onAuthStateChange((event,session)=>{
        const u=session?.user||null;
        state.cloudPasswordRecovery=event==='PASSWORD_RECOVERY';
        state.cloud=state.cloud||{};
        state.cloud.email=u?.email||'';
        state.cloud.userId=u?.id||'';
        state.cloud.status=u?'Connected':'Not signed in';
        state.cloud.error='';
        save();
        render();
        if(u)setTimeout(()=>{cloudSyncSavedLists().catch(()=>{});cloudRefreshBattles().catch(()=>{});},0);

async function cloudSyncSavedLists(){

    if(error)throw error;
    const remoteByLocalId=new Map();
    (remote||[]).forEach(r=>{const localId=r.army_data?.id||r.army_data?.localId;if(localId)remoteByLocalId.set(localId,r)});
    for(const list of (state.savedArmyLists||[])){
      let remoteRow=list.cloudId?(remote||[]).find(r=>r.id===list.cloudId):remoteByLocalId.get(list.id);
      const payload=cloudArmyPayload(list,state.cloud.userId);
      if(remoteRow){
        const {error:e}=await client.from('saved_army_lists').update(payload).eq('id',remoteRow.id).eq('user_id',state.cloud.userId);
        if(e)throw e;
        list.cloudId=remoteRow.id;
      }else{
        const {data:d,error:e}=await client.from('saved_army_lists').insert(payload).select('id').single();
        if(e)throw e;
        list.cloudId=d?.id||'';
      }
      list.updated=new Date().toISOString();
    }
    const {data:latest,error:e2}=await client.from('saved_army_lists').select('id,name,faction,detachment,army_data,created_at,updated_at').order('updated_at',{ascending:false});
    if(e2)throw e2;

    (latest||[]).forEach(r=>{
      const d=(r.army_data&&typeof r.army_data==='object')?JSON.parse(JSON.stringify(r.army_data)):{};

    });

    save();render();
  }catch(e){
    state.cloud.status='Error';state.cloud.error=e.message||String(e);save();render();
  }
}

function importAllData(inp){
  const f=inp.files?.[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const raw=JSON.parse(rd.result);
      if(!raw||typeof raw!=='object'||!raw.state||!Array.isArray(raw.DEMO))throw new Error('This is not a valid OnoForge backup file.');
      if(!confirm('Import this backup? Your current local OnoForge data will be replaced.')){inp.value='';return}
      state={...state,...raw.state};
      DEMO.splice(0,DEMO.length,...raw.DEMO);
      state.my=Array.isArray(state.my)?state.my:[];state.opp=Array.isArray(state.opp)?state.opp:[];state.savedArmyLists=Array.isArray(state.savedArmyLists)?state.savedArmyLists:[];state.events=Array.isArray(state.events)?state.events:[];state.rulesLog=Array.isArray(state.rulesLog)?state.rulesLog:[];state.detachmentSelections=Array.isArray(state.detachmentSelections)?state.detachmentSelections:[];state.oppDetachmentSelections=Array.isArray(state.oppDetachmentSelections)?state.oppDetachmentSelections:[];
      ensureGameTimer();
      save();
      alert('OnoForge data imported successfully.');
      render();
    }catch(e){alert('Import failed: '+e.message)}finally{inp.value=''}
  };
  rd.readAsText(f);
}

}

  if(sd){ev.preventDefault();ev.stopPropagation();selectSecondaryDetail(sd.dataset.secondaryDetailSide,sd.dataset.secondaryDetailName);return;}
  const sr=ev.target.closest('[data-secondary-row-score]');
  if(sr){ev.preventDefault();ev.stopPropagation();secondaryScoreRow(sr.dataset.secondaryRowScoreSide,sr.dataset.secondaryRowScoreName,Number(sr.dataset.secondaryRowScoreIndex));return;}
  const ss=ev.target.closest('[data-secondary-score]');
  if(ss){ev.preventDefault();ev.stopPropagation();setSecondaryDetailScore(ss.dataset.secondaryScoreSide,ss.dataset.secondaryScoreName,ss.dataset.secondaryScoreValue);return;}
  const tr=ev.target.closest('[data-secondary-track]');
  if(tr){ev.preventDefault();ev.stopPropagation();chooseSecondary(tr.dataset.secondaryTrackSide,tr.dataset.secondaryTrackName);return;}
  const sc=ev.target.closest('[data-secondary-side]');
  if(sc){
    ev.preventDefault();ev.stopPropagation();
    const side=sc.dataset.secondarySide;
    const sid=sc.dataset.secondarySelect;
    const box=document.getElementById(sid);
    const sel=box && box.tagName==='SELECT' ? box : (box?box.querySelector('select'):null);
    const names=sel ? Array.from(sel.selectedOptions).map(o=>o.value) : [];
    if(names.length) chooseSecondaryBatch(side,names);
    return;
  }
  const b=ev.target.closest('[data-score]');
  if(b){ev.preventDefault();const kind=b.dataset.score,side=b.dataset.side,delta=Number(b.dataset.delta)||0;if(kind==='vp')changeVP(side,delta);else if(kind==='cp')changeCP(side,delta);return;}
  const c=ev.target.closest('[data-battle-control]');
  if(c){ev.preventDefault();const action=c.dataset.battleControl;if(action==='phase')advancePhase();else if(action==='round')nextRound();else if(action==='previous-phase')previousPhase();else if(action==='round')nextRound();else if(action==='previous-round')previousRound();return;}
});
load();loadStratagems();
refreshCurrentUnitDatabase(false);
render();
load40kAppSourceManifest();
loadEventCompanionData();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js?v=312',{updateViaCache:'none'}).catch(()=>{});});}
setTimeout(()=>initCloudOnLoad(),0);
</script>
